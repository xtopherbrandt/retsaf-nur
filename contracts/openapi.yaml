  # ------------------------------------------------------- Archive import
  /imports:
    post:
      tags: [Sessions]
      operationId: startImport
      summary: Import a Garmin export archive (or any zip of FIT files)
      description: >
        F020. The multipart part `file` is a zip, matched by content, not by
        name. Checked in order: a declared length over 1 GiB is 413 (text,
        from the upload middleware, on /imports and /imports/ alike); an
        import already queued, scanning or running is 409 naming its
        import_id; the part is copied counting bytes, 413 past 1 GiB; a copy
        that does not open as a zip (zero bytes included) is 400. A refused
        request leaves no import and no temp dir. Then 202 with the Import in
        status queued, and the job screens every FIT file by its file_id,
        stores runs and recognised resting captures oldest first, and reports
        every activity in files[] (getImport). As-built errors are FastAPI
        {detail}.
      x-readiness: implemented
      x-owner-spec: "runcoach-api F020"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary, description: "A zip archive, at most 1 GiB." }
      responses:
        "202":
          description: Import queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Import" }
        "400":
          description: The upload does not open as a zip archive (a zero-byte upload included)
          content: { application/json: { schema: { type: object } } }
        "409":
          description: An import is queued, scanning or running; the detail names its import_id
          content: { application/json: { schema: { type: object } } }
        "413":
          description: The archive exceeds the 1 GiB limit (text/plain from the middleware on a declared length; {detail} when counted while copying)
          content:
            application/json: { schema: { type: object } }
            text/plain: { schema: { type: string } }
        "422":
          description: No `file` part (FastAPI-default {detail})
          content: { application/json: { schema: { type: object } } }
        "500":
          description: The archive could not be stored (disk full, unwritable data dir, the stored copy unreadable), or the worker could not start; the detail names the cause, and no import or temp dir is left
          content: { application/json: { schema: { type: object } } }
    get:
      tags: [Sessions]
      operationId: listImports
      summary: Every import, newest first, without files
      description: >
        F020. Ordered by created_at descending; no item carries files. Nothing
        is written.
      x-readiness: implemented
      x-owner-spec: "runcoach-api F020"
      responses:
        "200":
          description: Imports, newest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportPage" }

  /imports/{import_id}:
    get:
      tags: [Sessions]
      operationId: getImport
      summary: One import with its per-file rows
      description: >
        F020. The job's status, progress and counts, and files[] in processing
        order (seq). Poll it while the status is queued, scanning or running.
        A row outlives the session it names. 404 for an unknown import_id.
      x-readiness: implemented
      x-owner-spec: "runcoach-api F020"
      parameters:
        - name: import_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The import
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Import" }
        "404": { $ref: "#/components/responses/NotFound" }

  /race-tags:
    put:
      tags: [Sessions]
      operationId: setRaceTags
      summary: Carry Garmin Connect race and threshold workout marks onto stored runs
      description: >
        F023, F026. {items: [...]}, 1 to 500 items with distinct
        connect_activity_id, each {connect_activity_id, start_time, distance_m,
        duration_s} with exactly one of tag and race: start_time is Connect's
        startTimeGMT as YYYY-MM-DDTHH:MM:SS in UTC, whole seconds, ending Z or
        +00:00; distance_m and duration_s are numbers at or above 0, or null
        (zero is accepted and agrees only with a stored 0; null never agrees);
        tag is race, threshold_workout or null (null clears); race is a
        boolean, read as before (true means the tag race, false means null).
        Each item is matched to the stored running sessions at its start
        second (resting captures excluded) and confirmed by distance and
        duration within 1 %. On a match the stored tag and the wanted one
        decide: equal is unchanged; null to a tag is tagged; a tag to null is
        cleared; race to threshold_workout or back is retagged; any other
        stored tag is left as is (other_tag). tagged, cleared and retagged are
        written. 200 with one outcome per item, in request order, every
        outcome's count (all eight keys, zeros included) and by_tag, the
        tagged, cleared and retagged counts per tag (tagged and retagged keyed
        by the wanted tag, cleared by the stored one); re-sending the same
        items is idempotent. 422, with nothing written, for any other key, a
        non-integer id, a repeated id, 0 or more than 500 items, both or
        neither of tag and race, a tag other than the two or null, a race
        that is not a boolean (null included), a start_time in another zone,
        with a fraction of a second or that does not parse, or a negative, NaN
        or infinite number. Only activity_tag changes.
      x-readiness: implemented
      x-owner-spec: "runcoach-api F023, F026"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RaceTagsUpdate" }
      responses:
        "200":
          description: One outcome per item, in request order, and the counts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RaceTagsResult" }
        "422": { $ref: "#/components/responses/RequestValidationError" }

  /sessions/{session_id}/laps:
    put:
      tags: [Sessions]
      operationId: attachSessionLaps
      summary: Read a stored run's laps and workout steps from its original FIT file
      description: >
        F025. Multipart, one FIT file, the same size limit as ingestSession.
        In order: an unknown session_id is a 404, before the file is decoded;
        the file is decoded as ingestSession decodes it, and a file
        ingestSession refuses gets the status and detail ingestSession gives
        it (400, 413); a file whose derived session id (its device and start)
        is not session_id is a 409 naming both ids and both start instants.
        Otherwise the session's laps and workout steps are replaced by the
        file's and laps_read_at is set; no other table or session column is
        written, and repeating the call gives the same rows. 200 with the
        counts. As-built errors are FastAPI {detail}.
      x-readiness: implemented
      x-owner-spec: "runcoach-api F025"
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary, description: "The session's original .fit file, at most 50 MB." }
      responses:
        "200":
          description: The session's laps and steps were replaced; the counts stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionLapsAttached" }
        "400":
          description: Not a FIT file, a parse failure or a required canonical field that could not be determined (ingestSession's detail)
          content: { application/json: { schema: { type: object } } }
        "404":
          description: No stored session has that session_id; the file is not decoded
          content: { application/json: { schema: { type: object } } }
        "409":
          description: The file is another session's; the detail names both ids and both start instants
          content: { application/json: { schema: { type: object } } }
        "413":
          description: The file exceeds the upload limit or a decode ceiling (ingestSession's detail)
          content: { application/json: { schema: { type: object } } }
        "422": { $ref: "#/components/responses/RequestValidationError" }

  /laps/candidates:
    post:
      tags: [Sessions]
      operationId: matchLapCandidates
      summary: Match listed Garmin Connect runs to stored runs by start second (read-only)
      description: >
        F025. {items: [...]}, 1 to 500 items with distinct connect_activity_id,
        each {connect_activity_id, start_time}: start_time is Connect's
        startTimeGMT as setRaceTags takes it. Each item is matched to the
        stored running sessions at its start second (resting captures
        excluded): matched (exactly one, with its session_id and
        laps_read_at), not_stored (none) or ambiguous (two or more). Distance
        and duration are never compared: attachSessionLaps' identity check on
        the file proves the match. 200 with one answer per item, in request
        order. 422 for any other key, a non-integer or repeated id, 0 or more
        than 500 items, or another start_time form. Nothing is written. As-built
        errors are FastAPI {detail}.
      x-readiness: implemented
      x-owner-spec: "runcoach-api F025"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LapCandidatesRequest" }
      responses:
        "200":
          description: One answer per item, in request order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LapCandidatesResult" }
        "422": { $ref: "#/components/responses/RequestValidationError" }

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Planned. Backend is single-athlete/no-auth today; alignment #2 adds this."

  parameters:
    SessionId:
      name: session_id
      in: path
      required: true
      schema: { type: string }
      description: Deterministic id = truncated SHA-256 over (source_device, start_time).
    WorkoutId:
      name: workout_id
      in: path
      required: true
      schema: { type: string }
    DecisionId:
      name: decision_id
      in: path
      required: true
      schema: { type: string }
    ProposalId:
      name: proposal_id
      in: path
      required: true
      schema: { type: string }
    Since:
      name: since
      in: query
      required: false
      schema: { type: string }
      description: Opaque cursor from a prior page's next_cursor.
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }

  responses:
    Unauthorized:
      description: Missing/invalid credentials
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    NotFound:
      description: Resource not found
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Conflict:
      description: Conflict (e.g. duplicate)
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    ValidationError:
      description: Request failed validation
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    RequestValidationError:
      description: >
        Request failed validation, as served: FastAPI's {detail}, one entry per refused input,
        naming where it is (loc), why (msg) and the error type. Nothing is written. getState,
        setRaceTags, matchLapCandidates, attachSessionLaps, getGoal, setGoal and previewGoal reference it.
      content:
        application/json:
          schema:
            type: object
            required: [detail]
            properties:
              detail:
                type: array
                items:
                  type: object
                  required: [loc, msg, type]
                  properties:
                    loc:
                      type: array
                      items: { oneOf: [ { type: string }, { type: integer } ] }
                    msg: { type: string }
                    type: { type: string }

  schemas:

    # ---- Common ---------------------------------------------------------
    Error:
      type: object
      description: Uniform error envelope (alignment #3). As-built endpoints currently return FastAPI {detail}.
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, example: not_found }
            message: { type: string }
            details: { type: object, additionalProperties: true }

    Page:
      type: object
      description: Cursor pagination envelope.
      required: [items]
      properties:
        items: { type: array, items: {} }
        next_cursor:
          type: string
          nullable: true
          description: Pass as `since` to fetch the next page; null when exhausted.

    ConfidenceValue:
      type: object
      description: >
        The anti-false-precision primitive. A point estimate with an optional
        interval and a confidence label; `provisional` flags cold-start / low-data
        estimates the UI must present as provisional (spec/04 §4.6, spec/09).
      required: [value]
      properties:
        value: { type: number }
        unit: { type: string, nullable: true }
        interval:
          type: object
          nullable: true
          properties:
            low: { type: number }
            high: { type: number }
        confidence:
          type: string
          enum: [low, medium, high]
        provisional: { type: boolean, default: false }

    Trend:
      type: object
      properties:
        direction: { type: string, enum: [improving, stable, declining, unknown] }
        rate: { type: number, nullable: true, description: "Units per week; sign matches direction." }

    # ---- System ---------------------------------------------------------
    HealthResponse:
      type: object
      required: [status, version]
      properties:
        status: { type: string, enum: [ok] }
        version: { type: string }

    # ---- Sessions (canonical raw — EXACT to repo models.py / db.py) ------
    IngestResponse:
      type: object
      required: [session_id, quality_flags]
      properties:
        session_id: { type: string }
        quality_flags:
          type: array
          items: { type: string }
          description: Data-quality flags raised at ingest (never hidden). See spec/02 §2.4.
        filter_applied:
          type: boolean
          description: "True only on an upload sent with `runs_and_captures_only`; absent otherwise (never null)."
        replaced_session_id:
          type: string
          description: >
            An HRV_STATUS night only: the stored re-summary of the same night (same device and
            series start, earlier summary time) this upload replaced. Absent otherwise (never null).

    IngestSkipped:
      type: object
      description: >
        ingestSession's 200: a file stored nothing. `non_activity` and `skipped_sport` only with
        `runs_and_captures_only` (a file the rule does not keep); `no_night` an HRV_STATUS file
        that holds no night, with or without it.
      required: [skipped, reason, filter_applied]
      properties:
        skipped: { type: boolean, enum: [true] }
        reason: { type: string, enum: [non_activity, skipped_sport, no_night] }
        file_type:
          type: string
          nullable: true
          description: "non_activity: the file_id type name, or its number as a string; no_night: hrv_status."
        sport:
          type: string
          nullable: true
          description: "skipped_sport: the sport as the FIT file names it."
        filter_applied:
          type: boolean
          description: Whether the upload was sent with `runs_and_captures_only`.

    SessionDetail:
      type: object
      description: Canonical session as GET /sessions/{id} returns it (quarantine sidecar excluded).
      required: [session_id, start_time, sport, source_vendor, records, rr_intervals, laps, workout_steps, laps_read_at]
      properties:
        session_id: { type: string }
        athlete_id: { type: string, nullable: true }
        start_time: { type: string, description: "ISO-8601." }
        sport: { type: string }
        activity_tag: { type: string, nullable: true }
        source_vendor: { type: string }
        source_device: { type: string, nullable: true }
        recording_interval:
          type: string
          nullable: true
          description: Descriptor, not a period — "1hz" / "smart" / "irregular" (spec/02 §2.2.3).
        hr_source: { type: string, nullable: true }
        rr_valid_fraction:
          type: number
          nullable: true
          description: Surviving-beat fraction; null when no RR stream (distinct from 0.0).
        rmssd_precomputed: { type: number, nullable: true, description: "Device-ONLY audit record of resting rMSSD (ms) — the device value on Tier 2 and on a night (its HRV_STATUS file's last_night_average), null on Tier 1. Not the engine's read; see resting_rmssd_ms." }
        resting_rmssd_ms:
          type: number
          nullable: true
          exclusiveMinimum: 0
          x-invariant: >
            Scoped, not table-wide. Post-amendment rows (written 2026-09-06+):
            hrv_source_tier != null  ⇒  resting_rmssd_ms != null AND > 0 (every
            tier writes tier and reading together past a non-positive gate).
            Pre-amendment Tier-1 rows may have hrv_source_tier != null WITH
            resting_rmssd_ms == null (the amendment resolved the rule, not the
            rows; no backfill). So a non-null tier does NOT imply a non-null
            reading across the window.
          description: >
            RESOLVED resting rMSSD (ms) the engine (E003) reads on every tier —
            device value on Tier 2 and on a night, system-computed from beats on Tier 1 (added
            2026-09-06). Nullable, and when present strictly positive
            (exclusiveMinimum 0). Per x-invariant, a non-null hrv_source_tier does
            NOT guarantee a non-null value across the amendment window, so
            consumers guard the read (never assume ln() is safe) and the UI
            surfaces a null reading as provisional/absent, never as zero. This is
            the engine's read; rmssd_precomputed is only the device-value audit.
        hrv_source_tier:
          type: string
          nullable: true
          enum: [chest_strap_raw, health_snapshot, health_api_overnight]
          description: >
            Which tier produced the reading. Non-null does not by itself imply a
            non-null resting_rmssd_ms — see that field's x-invariant.
        rr_source: { type: string, nullable: true, description: "Session-level RR-stream source (spec/02 §2.2.3)." }
        quality_flags: { type: array, items: { type: string } }
        summary: { type: object, nullable: true, additionalProperties: true }
        context: { $ref: "#/components/schemas/SessionContext" }
        records:
          type: array
          items: { $ref: "#/components/schemas/Record" }
        rr_intervals:
          type: array
          items: { $ref: "#/components/schemas/RRInterval" }
        import_id: { type: string, nullable: true, description: "The archive import that stored the session (F020); null for a one-file upload." }
        laps:
          type: array
          items: { $ref: "#/components/schemas/SessionLap" }
          description: "The file's laps in lap order (F025); empty until the laps are read."
        workout_steps:
          type: array
          items: { $ref: "#/components/schemas/SessionWorkoutStep" }
          description: "The file's workout steps in file order (F025); empty until the laps are read."
        laps_read_at:
          type: string
          nullable: true
          description: "When the laps were last read from a file (UTC, ISO-8601); null means never read, not no laps."

    Record:
      type: object
      description: One per-sample canonical record (raw streams).
      required: [t]
      properties:
        t: { type: number, description: "Seconds from session start." }
        lat: { type: number, nullable: true }
        lon: { type: number, nullable: true }
        distance: { type: number, nullable: true }
        speed: { type: number, nullable: true }
        heart_rate: { type: number, nullable: true }
        cadence: { type: number, nullable: true }
        altitude: { type: number, nullable: true }
        power: { type: number, nullable: true }
        power_model: { type: string, nullable: true }
        vertical_oscillation: { type: number, nullable: true }
        ground_contact_time: { type: number, nullable: true }
        gct_balance: { type: number, nullable: true }
        step_length: { type: number, nullable: true }
        temperature: { type: number, nullable: true, description: "Device thermistor, not environmental truth." }
        gps_degraded: { type: boolean, nullable: true }
        sample_quality: { type: array, items: { type: string } }

    RRInterval:
      type: object
      properties:
        seq: { type: integer, nullable: true }
        rr_ms: { type: number, nullable: true }
        rr_source: { type: string, nullable: true, description: "Per-beat tier (spec/02 §2.2.3)." }
        rr_carrier: { type: string, nullable: true }
        is_artefact: { type: boolean, nullable: true }

    SessionContext:
      type: object
      nullable: true
      description: Environmental + provenance metadata (spec/02 §2.2.4). env_* require an external weather source, null on the FIT-upload route.
      properties:
        ingested_at: { type: string, nullable: true }
        provenance: { type: object, additionalProperties: true }
        env_temperature_c: { type: number, nullable: true }
        env_humidity_pct: { type: number, nullable: true }
        env_wind_ms: { type: number, nullable: true }
        env_wind_dir: { type: string, nullable: true }
        subjective: { type: object, nullable: true, additionalProperties: true }

    SessionSummary:
      type: object
      description: "One row of GET /sessions (F019, implemented): the list-view projection of a stored session, newest first. distance_m, duration_s and avg_pace_s_per_km are the quantities SessionFeatures serves under the same names, computed on read by the same segment rule; null for a session not stored as running, for a run whose records count no segment, and for a row whose records could not be read (the page is still served)."
      required: [session_id, start_time, sport, activity_tag, name, distance_m, duration_s, avg_pace_s_per_km, quality_flags, workout_id]
      properties:
        session_id: { type: string }
        start_time: { type: string, description: "As stored: ISO 8601 in UTC with a +00:00 offset." }
        sport: { type: string, description: "The canonical sport as stored: running or other." }
        activity_tag: { type: string, nullable: true }
        name: { type: string, nullable: true, description: "The name saved at upload (the FIT workout name, else the activity profile name); for a session stored before the name column existed, the profile name saved in its context, else null." }
        distance_m: { type: number, nullable: true }
        duration_s: { type: number, nullable: true }
        avg_pace_s_per_km: { type: number, nullable: true }
        quality_flags: { type: array, items: { type: string } }
        workout_id: { type: string, nullable: true, description: "Linked planned workout, if this activity executed one." }

    # ---- Athlete / onboarding (planned — field-level per spec/04 §4.4) ---
    Athlete:
      type: object
      description: >
        GET /me (F016, implemented). id, display_name, units and created_at are
        the athlete's settings. Each profile field is an entry: its effective
        value is the stored session with the latest start time whose file
        carries it (for max_hr_bpm and threshold_hr_bpm, sessions stored as
        running only), else the latest entered value, else unavailable
        (`missing`). sex and birth_date were scalars before F016 and are entries
        now. anchors holds the four HR anchors under the ordering rule.
        Computed on read, so deleting a session recomputes it. OnboardingInput
        still names the weight weight_kg, where this names it body_mass_kg.
      required: [id, display_name, sex, birth_date, units, created_at, body_mass_kg, height_cm, resting_hr_bpm, max_hr_bpm, threshold_hr_bpm, anchors]
      properties:
        id: { type: string }
        display_name: { type: string, nullable: true }
        sex: { $ref: "#/components/schemas/ProfileSexEntry" }
        birth_date: { $ref: "#/components/schemas/ProfileDateEntry" }
        units: { $ref: "#/components/schemas/UnitPrefs" }
        created_at: { type: string, description: "When the athlete's settings were first created, ISO 8601 in UTC." }
        body_mass_kg: { $ref: "#/components/schemas/ProfileNumberEntry" }
        height_cm: { $ref: "#/components/schemas/ProfileNumberEntry" }
        resting_hr_bpm: { $ref: "#/components/schemas/ProfileIntegerEntry" }
        max_hr_bpm: { $ref: "#/components/schemas/ProfileIntegerEntry" }
        threshold_hr_bpm: { $ref: "#/components/schemas/ProfileIntegerEntry" }
        anchors: { $ref: "#/components/schemas/HrAnchors" }

    AthleteProfileUpdate:
      type: object
      description: "updateMe's body. Every field is optional; a field left out is unchanged, and null clears a profile entry or display_name."
      additionalProperties: false
      properties:
        display_name: { type: string, nullable: true }
        units: { $ref: "#/components/schemas/UnitPrefs" }
        sex: { type: string, nullable: true, enum: [female, male, unspecified] }
        birth_date: { type: string, nullable: true, format: date, description: "Not after today in the athlete's timezone." }
        body_mass_kg: { type: number, nullable: true, exclusiveMinimum: 0, description: "In kg; finite." }
        height_cm: { type: number, nullable: true, exclusiveMinimum: 0, description: "In cm; finite." }
        resting_hr_bpm: { type: integer, nullable: true, exclusiveMinimum: 0 }
        max_hr_bpm: { type: integer, nullable: true, exclusiveMinimum: 0 }
        threshold_hr_bpm: { type: integer, nullable: true, exclusiveMinimum: 0 }

    UnitPrefs:
      type: object
      description: "All three keys are required on updateMe; a units object missing a key, or null, is a 422."
      required: [distance, pace, temperature]
      additionalProperties: false
      properties:
        distance: { type: string, enum: [km, mi] }
        pace: { type: string, enum: [min_per_km, min_per_mi] }
        temperature: { type: string, enum: [c, f] }

    OnboardingInput:
      type: object
      description: "Cold-start questionnaire (planned). Fields must match spec/04 §4.4 exactly at drafting."
      required: [consent_import_history]
      properties:
        sex: { type: string, enum: [female, male, unspecified] }
        birth_date: { type: string, format: date }
        height_cm: { type: number, nullable: true }
        weight_kg: { type: number, nullable: true }
        resting_hr_bpm: { type: number, nullable: true }
        self_rated_activity: { type: integer, nullable: true, description: "Non-exercise activity index for the cold-start VO2max seed (spec/04 §4.4)." }
        recent_weekly_km: { type: number, nullable: true }
        runs_per_week: { type: integer, nullable: true }
        consent_import_history: { type: boolean, description: "Consent to import historical Garmin data for the initial fit." }

    # ---- Goal (getGoal, setGoal and previewGoal implemented; the proposals planned) ----
    GoalContract:
      type: object
      description: >
        setGoal and getGoal: the stored goal race and goal time with the projection recomputed on
        every read (F032 reference sections 2 and 6). `status` is derived on read and never stored:
        `completed` when the race date is before the local date of the instant the projection is
        for, else `active`; a goal replaced by a later setGoal is never served.
      required: [id, race, target_time_s, status, created_at, target]
      properties:
        id: { type: string, description: "The stored row's id, as a string." }
        race: { $ref: "#/components/schemas/GoalRace" }
        target_time_s: { type: number, nullable: true, description: "The athlete's goal finish time in seconds, or null." }
        status: { type: string, enum: [active, completed] }
        created_at: { type: string, format: date-time, description: "The UTC instant the goal was set." }
        target:
          allOf: [{ $ref: "#/components/schemas/PaceTarget" }]
          description: "The projection at the instant used (`as_of`, else now); not stored."

    GoalContractInput:
      type: object
      description: "The body of setGoal: the race and an optional goal time. Any other key is a 422."
      required: [race]
      additionalProperties: false
      properties:
        race: { $ref: "#/components/schemas/GoalRaceInput" }
        target_time_s: { type: number, nullable: true, exclusiveMinimum: 0, description: "The athlete's goal finish time in seconds, a finite number above 0, or null; a goal time is stored and compared with the projection (`goal_time_gap`), never proposed." }

    GoalPreviewInput:
      type: object
      description: "The body of previewGoal: GoalContractInput with the race's `date` optional. Any other key is a 422."
      required: [race]
      additionalProperties: false
      properties:
        race: { $ref: "#/components/schemas/GoalPreviewRaceInput" }
        target_time_s: { type: number, nullable: true, exclusiveMinimum: 0, description: "The athlete's goal finish time in seconds, a finite number above 0, or null." }

    GoalRaceInput:
      type: object
      description: >
        The goal race as setGoal takes it (F032 reference section 2). Strict: `date` is a
        `YYYY-MM-DD` string naming a real day (a timestamp or a date-time is a 422), not before the
        athlete's local today; `distance_m` a finite number above 0 (a boolean or a string is a
        422); `name` at most 200 characters or null; `course_elevation` and `environment` are
        accepted only as null (a course profile and conditions are not modelled; the projection
        assumes a flat course in cool, still conditions and lists that in `assumptions`); any other
        key is a 422.
      required: [date, distance_m]
      additionalProperties: false
      properties:
        date: { type: string, format: date, description: "The race day as `YYYY-MM-DD`, not before the reference date." }
        distance_m: { type: number, exclusiveMinimum: 0, description: "The race distance in metres, a finite number above 0." }
        name: { type: string, nullable: true, maxLength: 200, description: "The race's name, at most 200 characters, or null." }
        course_elevation: { type: "null", description: "Accepted only as null: a course profile is not modelled." }
        environment: { type: "null", description: "Accepted only as null: conditions are not modelled." }

    GoalPreviewRaceInput:
      type: object
      description: "previewGoal's race: as GoalRaceInput, with `date` optional. Absent or null, the route dates the race on the local date of the instant used."
      required: [distance_m]
      additionalProperties: false
      properties:
        date: { type: string, format: date, nullable: true, description: "The race day as `YYYY-MM-DD`, not before the local date of the instant used; null or absent means that date." }
        distance_m: { type: number, exclusiveMinimum: 0, description: "The race distance in metres, a finite number above 0." }
        name: { type: string, nullable: true, maxLength: 200, description: "The race's name, at most 200 characters, or null." }
        course_elevation: { type: "null", description: "Accepted only as null: a course profile is not modelled." }
        environment: { type: "null", description: "Accepted only as null: conditions are not modelled." }

    GoalRace:
      type: object
      description: "The goal race as served: the race date (the request's, else the reference date), the distance and the name."
      required: [date, distance_m, name]
      properties:
        date: { type: string, description: "The race day, `YYYY-MM-DD`." }
        distance_m: { type: number }
        name: { type: string, nullable: true }

    PaceTarget:
      type: object
      description: >
        previewGoal's 200 and `GoalContract.target`: the projected finish over the goal distance
        from the races the `riegel_exponent` determinant used at the instant, by the fitted line
        when they clear its bar (`route` `fitted_line`) and by the closest race with the population
        exponent below it (`route` `closest_race`: no interval, `provisional`), with the label, the
        goal time's gap, the provenance and the assumptions (F032 reference sections 3, 4 and 6).
        When `unavailable` is set every figure is null and the assumptions and parameters are still
        served. Nothing is stored.
      required: [as_of, timezone, race, target_time_s, unavailable, route, projected_time_s, avg_pace_s_per_km, halfwidth, confidence, goal_time_gap, provenance, leave_one_out, effort_note, assumptions, parameters, gap_to_goal]
      properties:
        as_of: { type: string, format: date-time, description: "The instant the projection is for." }
        timezone: { type: string, description: "The configured `athlete_timezone`, which the reference date was read in." }
        race: { $ref: "#/components/schemas/GoalRace" }
        target_time_s: { type: number, nullable: true, description: "The goal time the gap is read against, or null." }
        unavailable:
          type: string
          nullable: true
          enum: [no_races, riegel_unavailable, projection_not_finite]
          description: "`no_races` with no race used; `riegel_unavailable` when the exponent's estimate is not finite; `projection_not_finite` when a served figure is not finite or overflows, or a served time or pace underflows to 0 (it must be a finite positive number). Null when a projection is served."
        route: { type: string, nullable: true, enum: [fitted_line, closest_race], description: "Null when unavailable." }
        projected_time_s:
          allOf: [{ $ref: "#/components/schemas/ConfidenceValue" }]
          nullable: true
          description: "The projected finish in seconds (`unit` `s`): the value, its 80 % prediction interval (null on route `closest_race`), the label (`confidence.label`) and `provisional` (true on route `closest_race`). Null when unavailable."
        avg_pace_s_per_km:
          allOf: [{ $ref: "#/components/schemas/ConfidenceValue" }]
          nullable: true
          description: "The same projection as a pace (`unit` `s/km`), the interval its ends divided by the distance. Null when unavailable."
        halfwidth: { type: number, nullable: true, description: "The interval's upper side as a fraction of the time; null on route `closest_race` and when unavailable." }
        confidence:
          allOf: [{ $ref: "#/components/schemas/GoalConfidence" }]
          nullable: true
          description: "The label and what it was read from (F032 reference section 4); null when unavailable."
        goal_time_gap:
          allOf: [{ $ref: "#/components/schemas/GoalTimeGap" }]
          nullable: true
          description: "Null without a goal time or when unavailable."
        provenance: { $ref: "#/components/schemas/GoalProvenance" }
        leave_one_out:
          allOf: [{ $ref: "#/components/schemas/GoalLeaveOneOutSet" }]
          nullable: true
          description: "Null on route `closest_race` and when unavailable."
        effort_note: { type: "null", description: "Always null: no effort note is composed." }
        assumptions:
          type: array
          items: { type: string }
          description: "The defaults the projection assumes, in this order: `flat_course`, `still_air`, `cool_conditions`, `no_economy_adjustment`, `no_durability_adjustment`, `projected_for_today_not_race_day`, `watch_timer_time` (the races' times are watch timer times, which an auto-pause shortens; chip time may differ)."
        parameters: { $ref: "#/components/schemas/PaceTargetParameters" }
        gap_to_goal: { type: "null", description: "Always null: the determinant breakdown (`GapToGoal`) is not modelled, so a non-null value is refused; the goal time's gap is `goal_time_gap`." }

    GoalConfidence:
      type: object
      description: "F032 reference section 4: the label; `basis` (`range` when the interval's halfwidth is the uncertainty read, `one_race` when a leave-one-out shift is; null on route `closest_race`); `uncertainty` (the figure read, null there); `reasons`, the codes of the rules that held, in the reference's order."
      required: [label, basis, uncertainty, reasons]
      properties:
        label: { type: string, enum: [low, medium, high] }
        basis: { type: string, nullable: true, enum: [range, one_race] }
        uncertainty: { type: number, nullable: true }
        reasons:
          type: array
          items: { type: string, enum: [fitness_below_races, population_default, below_one, outside_calibrated_range, beyond_longest_race] }

    GoalTimeGap:
      type: object
      description: "The goal time against the projection: `gap_s = target_time_s - projected_time_s` (negative when the goal is faster), `gap_fraction = gap_s / projected_time_s`, and whether the goal sits inside the interval (null on route `closest_race`, which has none)."
      required: [gap_s, gap_fraction, within_range]
      properties:
        gap_s: { type: number }
        gap_fraction: { type: number }
        within_range: { type: boolean, nullable: true }

    GoalProvenance:
      type: object
      description: "What the projection was built from: the endurance exponent b with its error, label and `population_default` as the `riegel_exponent` determinant serves them, the effective race count, the races used in that determinant's order, the newest race, and F032 reference section 5's fitness figures, served beside the time and never applied to it."
      required: [b, error, label, population_default, n_eff, races, newest_race, fitness_at_races, fitness_now]
      properties:
        b: { type: number, nullable: true, description: "The exponent at the instant; the population 1.06 below the bar; null when the exponent's estimate is not finite (`riegel_unavailable`), and served on `no_races` and `projection_not_finite`." }
        error: { type: number, nullable: true }
        label: { type: string, nullable: true, enum: [low, medium, high], description: "The exponent's own label." }
        population_default: { type: boolean }
        n_eff: { type: number, nullable: true, description: "`(sum w)^2 / sum(w^2)` over the races used; null with no race." }
        races:
          type: array
          items: { $ref: "#/components/schemas/GoalRaceUsed" }
        newest_race:
          allOf: [{ $ref: "#/components/schemas/GoalNewestRace" }]
          nullable: true
        fitness_at_races: { type: number, nullable: true, description: "The weighted mean of the races' `fitness_before`, nulls skipped; null when none carries one." }
        fitness_now: { type: number, nullable: true, description: "The load chart's CTL on the local day before the local date of `as_of`, the instant the projection is for (now when no `as_of` is given; never the race date); null when that day is not in the chart." }

    GoalRaceUsed:
      type: object
      description: "A race the projection was built from, as the `riegel_exponent` determinant served it, with the session's stored name."
      required: [session_id, name, start_time, gap_equivalent_m, duration_s, weight, residual, fitness_before]
      properties:
        session_id: { type: string }
        name: { type: string, nullable: true, description: "The session row's name; null when the file carried none or the session is unknown." }
        start_time: { type: string, format: date-time }
        gap_equivalent_m: { type: number, description: "The GAP-equivalent distance the fit reads, in metres." }
        duration_s: { type: number, description: "The timer time in seconds." }
        weight: { type: number }
        residual: { type: number, nullable: true, description: "`exp(r) - 1`, positive slower than the line." }
        fitness_before: { type: number, nullable: true, description: "The load chart's CTL on the local day before the race." }

    GoalNewestRace:
      type: object
      description: The latest race used, with its session name.
      required: [session_id, name, start_time]
      properties:
        session_id: { type: string }
        name: { type: string, nullable: true }
        start_time: { type: string, format: date-time }

    GoalLeaveOneOutSet:
      type: object
      description: "Every race's leave-one-out (F032 reference section 4), in the races' order, and `largest`, the race with the largest countable shift (one whose route is `fitted_line`); null when none is countable."
      required: [races, largest]
      properties:
        races:
          type: array
          items: { $ref: "#/components/schemas/GoalLeaveOneOut" }
        largest:
          allOf: [{ $ref: "#/components/schemas/GoalLeaveOneOut" }]
          nullable: true

    GoalLeaveOneOut:
      type: object
      description: "The projection from every race but this one: its route, time and `shift = T_without / T - 1`."
      required: [session_id, route, projected_time_s, shift]
      properties:
        session_id: { type: string }
        route: { type: string, enum: [fitted_line, closest_race] }
        projected_time_s: { type: number }
        shift: { type: number }

    PaceTargetParameters:
      type: object
      description: "The constants the projection and its label were computed with (F032 reference section 1), so they can be redone by hand."
      required: [high_max_uncertainty, medium_max_uncertainty, fitness_gap, max_extrapolation, calibrated_min_m, calibrated_max_m, population_b, tie_slack]
      properties:
        high_max_uncertainty: { type: number }
        medium_max_uncertainty: { type: number }
        fitness_gap: { type: number }
        max_extrapolation: { type: number }
        calibrated_min_m: { type: number }
        calibrated_max_m: { type: number }
        population_b: { type: number }
        tie_slack: { type: number }

    GapToGoal:
      type: object
      description: Determinant-decomposed distance between current projection and goal (spec/04 §4.7).
      properties:
        summary: { type: string, nullable: true }
        components:
          type: array
          items:
            type: object
            properties:
              determinant: { type: string }
              contribution: { type: number, description: "Signed contribution to the pace gap." }

    GoalProposal:
      type: object
      properties:
        id: { type: string }
        reason: { type: string, description: "Why the engine proposes a change (drift / injury-infeasible)." }
        ordered_options:
          type: array
          description: Fixed order — revised pace first, later date second; never a distance change.
          items:
            type: object
            properties:
              kind: { type: string, enum: [revised_pace, later_date] }
              target: { $ref: "#/components/schemas/PaceTarget" }
              new_date: { type: string, format: date, nullable: true }

    # ---- Plan / calendar (planned) --------------------------------------
    CalendarDay:
      type: object
      properties:
        date: { type: string, format: date }
        planned:
          type: array
          items: { $ref: "#/components/schemas/WorkoutRef" }
        completed:
          type: array
          items: { $ref: "#/components/schemas/SessionSummary" }
        compliance: { $ref: "#/components/schemas/Compliance" }
        changed:
          type: boolean
          description: True if the engine changed this day since the athlete last looked.
        decision_id:
          type: string
          nullable: true
          description: The "why" affordance target — the decision that changed this day.

    WorkoutRef:
      type: object
      properties:
        workout_id: { type: string }
        title: { type: string }
        type: { type: string, description: "Workout typology label (spec/05)." }
        primary_determinant: { type: string, nullable: true }

    Compliance:
      type: object
      nullable: true
      description: Planned-vs-completed (the execution-score pattern). Thresholds based on owned metrics, not TSS alone.
      properties:
        execution_score: { type: number, nullable: true, description: "0–1." }
        band: { type: string, enum: [green, amber, red], nullable: true }

    LoadSeries:
      type: object
      properties:
        points:
          type: array
          items:
            type: object
            properties:
              date: { type: string, format: date }
              ctl: { type: number, nullable: true }
              atl: { type: number, nullable: true }
              tsb: { type: number, nullable: true }
              channels:
                type: object
                nullable: true
                additionalProperties: { type: number }
                description: Multi-channel load (e.g. aerobic vs mechanical), spec/03 §3 / doc06 §9.

    Constraint:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          enum: [unavailable_days, time_budget, travel, recurring_rule, add_race, move_session]
        window:
          type: object
          nullable: true
          properties:
            from: { type: string, format: date }
            to: { type: string, format: date }
        payload:
          type: object
          additionalProperties: true
          description: Kind-specific detail (e.g. move_session → {workout_id, to_date}); firmed at §8 drafting.

    ChangeSet:
      type: object
      description: What the engine changed in response to an input, and why (apply-and-notify + loop closure).
      properties:
        moved:
          type: array
          items:
            type: object
            properties:
              workout_id: { type: string }
              from_date: { type: string, format: date, nullable: true }
              to_date: { type: string, format: date, nullable: true }
              change: { type: string, enum: [moved, added, removed, rescaled, softened] }
        rationale: { type: string }
        decision_ids: { type: array, items: { type: string } }
        safety_instruction:
          $ref: "#/components/schemas/SafetyInstruction"

    SafetyInstruction:
      type: object
      nullable: true
      description: A stop/return-to-run/seek-assessment instruction, surfaced plainly, never softened (spec/08 §8.5).
      properties:
        severity: { type: string, enum: [caution, stop, seek_assessment] }
        message: { type: string }

    # ---- Workouts (planned) ---------------------------------------------
    PlannedWorkout:
      type: object
      description: "Planned. Owner spec/05 (workout representation)."
      properties:
        id: { type: string }
        date: { type: string, format: date }
        title: { type: string }
        type: { type: string }
        determinant_targets:
          type: array
          items: { type: string }
          description: Which physiological determinant(s) this session targets (spec/05 / spec/01 determinants).
        rationale: { type: string, description: "The 'why this session' text, grounded in the engine's intent." }
        steps:
          type: array
          items: { $ref: "#/components/schemas/WorkoutStep" }
        completion:
          allOf:
            - $ref: "#/components/schemas/Compliance"
          nullable: true

    WorkoutStep:
      type: object
      properties:
        order: { type: integer }
        kind: { type: string, enum: [warmup, work, recovery, cooldown, repeat] }
        repeat_count: { type: integer, nullable: true }
        duration_s: { type: number, nullable: true }
        distance_m: { type: number, nullable: true }
        target:
          type: object
          nullable: true
          description: Relative-anchored target — stored relative to the current state estimate so zones update automatically (spec/05).
          properties:
            metric: { type: string, enum: [pace, hr, power, effort] }
            anchor: { type: string, description: "e.g. threshold_pace, critical_speed." }
            low: { type: number, nullable: true }
            high: { type: number, nullable: true }

    # ---- Subjective (planned) -------------------------------------------
    SessionFeedback:
      type: object
      required: [rpe]
      properties:
        rpe: { type: integer, minimum: 1, maximum: 10, description: "Session-RPE (research/03)." }
        comment: { type: string, nullable: true }

    WellnessReport:
      type: object
      description: Five-item wellness (research/03 §3.3), each 1–5.
      required: [fatigue, sleep, soreness, stress, mood]
      properties:
        fatigue: { type: integer, minimum: 1, maximum: 5 }
        sleep: { type: integer, minimum: 1, maximum: 5 }
        soreness: { type: integer, minimum: 1, maximum: 5 }
        stress: { type: integer, minimum: 1, maximum: 5 }
        mood: { type: integer, minimum: 1, maximum: 5 }
        sleep_duration_h: { type: number, nullable: true }
        illness_flag: { type: boolean, nullable: true }

    PainReport:
      type: object
      description: Pain traffic-light (research/03 §3.5).
      required: [location, intensity]
      properties:
        location: { type: string, description: "Body location; implies tissue type for the verdict." }
        intensity: { type: integer, minimum: 0, maximum: 10 }
        overnight_settle: { type: boolean, nullable: true }
        weekly_trend: { type: string, enum: [improving, stable, worsening], nullable: true }

    # ---- State & metrics -------------------------------------------------
    StateModel:
      type: object
      description: "Owned determinant profile with confidence + gap-to-goal (spec/04)."
      required: [as_of, timezone, determinants, readiness, gap_to_goal]
      properties:
        as_of: { type: string, format: date-time, description: "The instant the estimate is for (UTC)." }
        timezone:
          type: string
          description: "The configured `athlete_timezone`, which an `as_of` date was read in; dates print in it."
        determinants:
          type: array
          items: { $ref: "#/components/schemas/Determinant" }
        readiness:
          type: object
          nullable: true
          properties:
            verdict: { type: string, enum: [ready, caution, back_off], nullable: true }
            confidence: { type: string, enum: [low, medium, high], nullable: true }
        gap_to_goal:
          allOf: [{ $ref: "#/components/schemas/GapToGoal" }]
          nullable: true
          description: "Null: the goal is modelled by the Goal operations (getGoal, previewGoal), whose `PaceTarget.goal_time_gap` reads the goal time against the projection; the determinant breakdown this would hold is not."

    Determinant:
      description: >
        One determinant with its estimate and trend, told apart by `name`: `functional_threshold_pace`
        (`ThresholdDeterminant`) and `riegel_exponent` (`RiegelDeterminant`) are served, and each
        branch's `name` enum holds its one name so a client can narrow on it. The other names
        (`critical_speed`, `d_prime`, `vvo2max`, `running_economy`, `durability`) are planned; each
        gets its own branch and mapping entry when it ships.
      oneOf:
        - $ref: "#/components/schemas/ThresholdDeterminant"
        - $ref: "#/components/schemas/RiegelDeterminant"
      discriminator:
        propertyName: name
        mapping:
          functional_threshold_pace: "#/components/schemas/ThresholdDeterminant"
          riegel_exponent: "#/components/schemas/RiegelDeterminant"

    ThresholdDeterminant:
      type: object
      description: >
        The `functional_threshold_pace` entry, with its estimate and trend
        (F024, F026, F027: tagged races and the counted work reps of threshold workouts tagged
        Training or named in `threshold_workout_names`). Beside the
        estimate, the served entry carries what reproduces it by hand (research/00 PRIN-12):
        `error`, `short_races_only`, the races and workouts used (`efforts`), those not used
        (`excluded`) and the constants (`parameters`). The 80 % interval covers effort-to-effort
        noise, not bias: an effort read wrongly moves the estimate and the interval together, so the
        interval need not contain the true pace. Its `trend` is not computed yet: `direction` is `unknown` and `rate` null.
      required: [name, estimate, unavailable, trend, error, short_races_only, efforts, excluded, parameters]
      properties:
        name:
          type: string
          enum: [functional_threshold_pace]
        estimate:
          allOf: [{ $ref: "#/components/schemas/ConfidenceValue" }]
          nullable: true
          description: "Threshold pace in s/km with its 80 % interval (fast end `low`); null when `unavailable` is set."
        unavailable:
          type: string
          enum: [no_qualifying_effort, estimate_not_finite]
          nullable: true
          description: >
            Null with an estimate. `no_qualifying_effort` before the first qualifying race or
            workout; `estimate_not_finite` when an effort's GAP pace is so far out of range that
            the estimate overflows: `estimate` and `error` are null and `short_races_only` false,
            while `efforts` (each with its GAP pace and gain) and `parameters` are still served,
            so the effort can be found.
        trend: { $ref: "#/components/schemas/Trend" }
        error:
          type: number
          nullable: true
          description: "sqrt(P) as a fraction of speed (0.025 is 2.5 %); null when unavailable."
        short_races_only:
          type: boolean
          description: "At least one race used and every race used lasted under 1800 s, so the pace likely reads fast; workouts never set it (workouts only reads false); false when unavailable."
        efforts:
          type: array
          description: "The races and workouts used, in start-time order."
          items: { $ref: "#/components/schemas/ThresholdEffort" }
        excluded:
          type: array
          description: "Every tagged running race and threshold workout at or before `as_of` not used, in start-time order."
          items: { $ref: "#/components/schemas/ThresholdExclusion" }
        parameters: { $ref: "#/components/schemas/ThresholdPaceParameters" }

    HrvTrend:
      type: object
      description: >
        Owner spec/03 §3.7; as-built runcoach-api F005 (2026-09-09), per-tier
        datasets F006 (2026-09-21). `points[]` is the chart's series, which
        gains one field (`dataset`, AC14); everything else is the verdict for
        `to` and the inputs that produced it, added additively so the verdict
        is reproducible by hand from the response (research/00 PRIN-12; the
        inputs it does not serve are PRIN-12's OPEN exceptions, PRIN-24 and PRIN-27).
        `baseline`, `band`,
        `verdict` and `below_by` keep their names and now mean THE SELECTED
        DATASET'S; `datasets[]`, `selected_dataset`, `selected_reason` and
        `disagreed_with` are added beside them and nothing non-nullable became
        nullable (AC12), so `info.version` does not move for this change — the
        sprint's one breaking change was the removal of the exclusion reason
        F005 published for a reading of a tier other than the one holding the
        baseline, which took it to 0.2.0-draft. Field-level truth is the
        as-built `HrvTrendResponse` in /openapi.json.
      properties:
        points:
          type: array
          description: >
            One entry per athlete-local day in [from, to], in date order. Each
            day is judged against its OWN dataset baseline window, the nominal
            [date-66, date-7] clipped on that day (research/00 HRV-12, T-09);
            the band is a
            property of that baseline, so a day with no reading still carries
            it, and an unestablished-but-computable baseline (2 ≤ n < 14) still
            carries it while the day's verdict is hrv_unavailable
            (unavailable_reason baseline_unestablished, unless a cause before it
            fired first). The last entry
            describes `to` and its band equals `band`.
          items:
            type: object
            properties:
              date: { type: string, format: date }
              ln_rmssd:
                type: number
                nullable: true
                description: ln of that day's reading on the baseline tier; null when the post-exclusion series has none that day.
              baseline:
                type: number
                nullable: true
                description: Mean of ln rMSSD over that day's own dataset baseline window, the nominal [date-66, date-7] clipped at the latest of the coverage-gap resumption, the era boundary and the last internal hole (research/00 HRV-12, T-09); null together with swc_low/swc_high only when that baseline holds fewer than two readings.
              swc_low: { type: number, nullable: true, description: "That day's band.lo; null iff baseline is null." }
              swc_high: { type: number, nullable: true, description: "That day's band.hi; null iff baseline is null." }
              dataset:
                type: string
                nullable: true
                description: >
                  The source tier of the dataset this day's band came from
                  (F006 AC14). Selection runs per LOCAL DAY and reads nothing
                  from yesterday, so two adjacent points can be drawn against
                  two different instruments, whose bands differ by the
                  systematic bias between the tiers; a chart that does not read
                  this field switches instrument between adjacent days and
                  draws the step as a change in the athlete. Null only when no
                  reading of any tier exists in that day's [d-66, d], which is
                  narrower than `baseline` being null: a dataset holding one
                  baseline reading has a tier and no band, so this is non-null
                  while the other three are null. On the response's own day it
                  is `selected_dataset` when one was selected, and `datasets[]`
                  describes it in full.
        date: { type: string, format: date, description: "The local day the verdict is about (`to`)." }
        from: { type: string, format: date, description: "The start of the requested range; defaults to `to`." }
        timezone: { type: string, description: "The IANA zone every row was bucketed into local days with." }
        verdict:
          type: string
          enum: [hrv_normal, hrv_suppressed, hrv_unavailable]
          description: >
            hrv_normal and hrv_suppressed both assert an established baseline --
            baseline.n at or above the min_baseline_readings threshold the
            response echoes -- and differ only in where the 7-day mean sits:
            strictly below band.lo is hrv_suppressed, inside or above the band is
            hrv_normal. hrv_unavailable has six causes, and the response names
            which of them fired; judge evaluates them in this order and reports
            the first: when no resting-HRV reading of any tier can sustain a trend
            -- the structural case, the series holding no per-tier dataset: no
            reading of any tier in [date-66, date] after the coverage-gap clip;
            when there are fewer than two baseline readings, so no band
            exists; when there are fewer than min_window_readings (3) readings of
            baseline.tier in the judged week; when the judged week is not a fair
            sample of the dataset being judged, its readings all predating the athlete's
            return to, or first adoption of, another device (T125/T132); when
            there is a baseline below min_baseline_readings (14), reported as
            established: false -- any week judged against an unestablished
            baseline (below, inside or above the band alike: 3.7.3 serves
            hrv_unavailable there rather than hrv_suppressed, and hrv_normal
            there would tell a consumer
            readiness is intact on evidence this same response reports
            unestablished, the up-regulating direction research/00 PRIN-14 forbids);
            and when the judged day is after the athlete's local today in timezone,
            which is decided at the route and overrides whichever of the other five
            would otherwise have applied -- whatever the window holds, no verdict is
            asserted about a day that has not happened, and the other fields are
            still reported as computed. The band is still reported whenever the
            baseline can build one, established or not, so an unavailable verdict on
            an unestablished baseline remains checkable by hand.
        unavailable_reason:
          type: string
          nullable: true
          enum:
            - no_tier_sustains_a_trend
            - no_band
            - week_too_thin
            - week_not_representative
            - baseline_unestablished
            - day_not_happened
          description: >
            Why verdict is hrv_unavailable; null whenever it is not (research/00
            PRIN-12: the verdict must be reproducible by hand from the response,
            its unserved inputs being PRIN-12's OPEN exceptions (PRIN-24, PRIN-27),
            and this was the one place that rule failed -- F005's Negative Class
            row "the verdict still cannot say why it is unavailable", closed by
            T137). judge evaluates four
            causes in a fixed order and reports the first that fires:
            no_tier_sustains_a_trend (no resting-HRV reading of any tier can
            sustain a trend -- the series holds no per-tier dataset: no reading
            of any tier in [date-66, date] after the coverage-gap clip) or
            no_band (a dataset was selected or presented, but its baseline holds
            fewer than two readings, so no band exists -- build_band answers null on fewer than
            two baseline readings, so no band exists to judge the week against)
            whenever band is null; then week_too_thin (fewer than
            min_window_readings (3) readings of baseline.tier in the judged week;
            readings of other tiers feed their own datasets and do not count
            toward readings_in_window); then
            week_not_representative (the judged week is not a fair sample of the
            dataset being judged, baseline.tier -- T125/T132: its judged-week
            readings all predate a returning or brand-new device's, another dataset
            that could not be selected holding at least min_window_readings (3)
            judged-week days, every one later than every judged-week day of the
            dataset being judged); then
            baseline_unestablished (a baseline below min_baseline_readings (14),
            reported as established: false -- baseline.n below the threshold the
            response echoes, T116). day_not_happened (the judged day is after the
            athlete's local today, date beyond today in timezone) is decided at
            the route, after judge, and overrides whichever of the other five
            would otherwise have applied -- the fields that would explain them are
            still computed and returned as usual, but a day that has not happened
            is the one true reason no verdict is asserted about it.
        ln_rmssd_7d_mean:
          type: number
          nullable: true
          description: Mean of ln rMSSD over the readings in `window`; null only when the window is empty.
        below_by:
          type: number
          nullable: true
          description: band.lo − ln_rmssd_7d_mean when the verdict is hrv_suppressed; null otherwise.
        band:
          type: object
          nullable: true
          description: The SWC band in log space over the baseline, mean ± half_width. Null only when the baseline holds fewer than two readings.
          properties:
            mean: { type: number }
            half_width: { type: number, description: "max(swc_factor × sample SD of ln rMSSD over the baseline, band_floor)." }
            lo: { type: number }
            hi: { type: number }
            floored: { type: boolean, description: "True when the computed half-width fell below band_floor." }
        baseline:
          type: object
          properties:
            window:
              type: array
              items: { type: string, format: date }
              minItems: 2
              maxItems: 2
              description: >
                Closed local-date interval [max(date-66, R), date-7], where R is
                the day the current baseline era began. R is not reset_on: a
                tier-change era boundary clips this window whether or not the
                change is reported, so a clipped window beside a null
                reset_reason is a correct state (the readings clipped away are
                listed before_reset: tier_change). For coverage_gap, R is the
                later of the resumption and any era boundary: the two clips
                compose as the later of their first days, so R is reset_on only
                when no era boundary falls after the resumption, and window[0]
                may lie after reset_on. A third clip is per dataset and unreported:
                an internal capture hole of more than gap_reset_days (21) silent
                local days inside the window the first two clips left -- one tier
                silent while another bridged it, which the global gap cannot see --
                clips this dataset at its last resumption, and the readings clipped
                away are listed before_reset: coverage_gap beside a reset_reason
                that stays null or the era rule's. The three clips compose as the
                latest first day. Empty
                after a reset landing inside the judged week, rendered as the
                formula yields it (first after last) with n 0 — clients must not
                assume window[0] ≤ window[1].
            n: { type: integer, description: "Baseline readings, one per local day on `tier`." }
            tier: { type: string, nullable: true, description: "The source tier the baseline and window are built on." }
            established: { type: boolean, description: "n ≥ min_baseline_readings. Below it neither hrv_suppressed nor hrv_normal is asserted — hrv_unavailable is the only verdict emitted (see verdict), with unavailable_reason baseline_unestablished unless a cause before it fired first." }
            reset_on:
              type: string
              format: date
              nullable: true
              description: >
                The day the current baseline era began, when the reset that began
                it is reported (see reset_reason). It says what the athlete is told, not how window was
                built: a tier-change era boundary clips window whenever it exists, and is
                reported here only when its stray readings fall on fewer than
                min_window_readings (3) days of the judged week [date-6, date]
                (research/00 HRV-78, HRV-80). So a null reset_on does not mean the baseline
                spans the full 60 days; read window.
            reset_reason:
              type: string
              enum: [coverage_gap, tier_change]
              nullable: true
              description: >
                Why the current baseline era's reset is reported: coverage_gap, the
                only reset that re-establishes a baseline, or tier_change, an era
                boundary that re-establishes none (research/00 HRV-34). The baseline clip is decided by the
                era boundary alone, never by its report, so a null here can sit beside a
                clipped `window`; and a third clip, per dataset and unreported, widens that
                state: each dataset is also clipped at its last internal capture hole of
                more than gap_reset_days (21) silent local days, counted exactly as
                coverage_gap_reset counts a gap, with the pre-hole readings listed
                `before_reset: coverage_gap` while this stays null or the era rule's. The
                three clips -- era boundary, coverage gap, internal hole -- compose as the
                latest first day, and only the first two are ever reported here. A
                reported `tier_change` is always clipped, though once the era's first day
                is date-66 or older the clip `max(date-66, R)` is a no-op and `window` is
                indistinguishable from the nominal baseline window [date-66, date-7]
                before any clip (research/00 T-09). That no-op
                stretch is conditional, not promised: a reported `tier_change` sits beside
                an un-clipped `window` only once date-66 has reached R, and then only on
                the days the report is still live. Liveness is rule 4's three conditions
                together, not any one of them alone: the reported dataset's tier
                (selected, or presented when none is) still
                holds min_baseline_readings distinct days in the baseline window, the
                previous window [date-126, date-67] is still sustained by a tier other
                than that one, and the two eras still do not interleave -- the era
                boundary's stray readings fewer than min_baseline_readings days in all and
                fewer than min_window_readings days inside the judged week [date-6, date]
                (`tier_change_reset` clauses (a), (b) and (c)). Any one can lapse while
                the others hold -- a new tier that never reaches min_baseline_readings, an
                old tier whose density decays, a few days of the other device inside the
                judged week -- and this is null on such a day. So every day a
                `tier_change` is reported before date-66 reaches R carries a clipped
                `window`, and a client cannot infer from seeing a `tier_change` that an
                un-clipped `window` will follow (F005 decision log D4, 2026-09-13; T103,
                T105, T109).
        window:
          type: array
          items: { type: string, format: date }
          minItems: 2
          maxItems: 2
          description: The closed local-date interval [date-6, date] the mean is taken over.
        readings_in_window: { type: integer }
        included:
          type: array
          description: The readings that fed ln_rmssd_7d_mean, only; the baseline is summarised by `baseline`.
          items:
            type: object
            properties:
              date: { type: string, format: date }
              session_id: { type: string }
              tier: { type: string }
              rmssd_ms: { type: number }
        excluded:
          type: array
          description: Every stored row inside [date-66, date] that fed neither the baseline nor the window, with its reason.
          items:
            type: object
            properties:
              date: { type: string, format: date }
              session_id: { type: string }
              reason:
                type: string
                description: >
                  One of pre_amendment_window, null_tier, unknown_tier: <tier>,
                  unusable_value: <value>,
                  same_day_later_capture, before_reset: <coverage_gap|tier_change>.
        thresholds:
          type: object
          description: >
            The band, verdict and dataset-selection constants (spec/03 §3.7).
            The tolerance of the recency gate is served here as recency_tolerance_days, beside the six the block
            already served (PRIN-24 names window_days as the one verdict-affecting constant it does not serve),
            so selected_reason and baseline.tier are recomputable from the response alone (research/00 PRIN-12;
            C33, 2026-09-23, which reversed IDEA-070's narrowing of 2026-09-15).
          properties:
            baseline_days: { type: integer }
            min_baseline_readings: { type: integer }
            min_window_readings: { type: integer }
            gap_reset_days: { type: integer }
            band_floor: { type: number }
            swc_factor: { type: number }
            recency_tolerance_days: { type: integer }
        datasets:
          type: array
          description: >
            One entry per source tier present in the gap-clipped span —
            [date-66, date], or [baseline.reset_on, date] when a global
            coverage gap clipped the series — in fidelity
            order, each with its own baseline, its own band and its own reading
            of the judged week against that band (F006 AC1/AC2/AC10, added
            2026-09-21 by T159; the span corrected from [date-66, date] by
            sprint-006 spec review, 2026-09-21). A tier read only before such a
            resumption has no entry here at all: its readings are listed in
            `excluded` as `before_reset: coverage_gap`, so a consumer counting
            tiers reads them there rather than finding them nowhere.
            Each tier keeps its own dataset and no reading
            of one contributes to another's baseline (spec/03 §3.7.3's
            anti-mixing rule, honoured by construction), so the datasets the
            verdict was NOT taken from are retained rather than discarded:
            every reading inside the span is in exactly one dataset here or in
            `excluded` with a reason, never in neither and never in both (AC15,
            research/00 PRIN-23). Empty only when no reading of any tier exists in
            the span. Additive: `baseline`, `band` and `verdict` still describe
            the selected dataset and nothing non-nullable became nullable
            (AC12).
          items:
            type: object
            properties:
              tier:
                type: string
                description: >
                  The source tier, which IS the dataset's key: the stored source_device is the
                  watch; since F007 the store also records the connected heart-rate sensor's
                  serial, but no rule reads it, so a per-unit key is a later feature. One entry
                  per tier present in the gap-clipped span, in fidelity order, highest first.
              n:
                type: integer
                description: >
                  Baseline readings of this tier, one per local day, over THIS
                  dataset's own post-clip baseline window. It is `baseline.n`
                  only for the selected dataset, and each dataset's window can
                  be clipped at a different day: the coverage gap is global,
                  the era boundary and the internal capture hole are this
                  dataset's own.
              established:
                type: boolean
                description: >
                  n ≥ min_baseline_readings, for this dataset alone. A dataset
                  must be established AND hold at least min_window_readings
                  judged-week days to be a candidate for selection (AC8);
                  `week_days` is the other half of that test.
              band:
                type: object
                nullable: true
                description: >
                  This dataset's own SWC band over its own baseline — the
                  yardstick its own week is read against here. Null only when
                  this dataset holds fewer than two baseline readings, in which
                  case it cannot disagree with anything and is visible carrying
                  `n` and `week_days` instead (AC10). The selected dataset's
                  band is the response's `band`.
                properties:
                  mean: { type: number }
                  half_width: { type: number }
                  lo: { type: number }
                  hi: { type: number }
                  floored: { type: boolean }
              fidelity_rank:
                type: integer
                description: >
                  This tier's ordinal in the source hierarchy spec/03 §3.7.1
                  ratifies, 0 being the highest: a chest-strap RR capture this
                  system reduces to rMSSD itself, degrading to a
                  device-computed numeric resting rMSSD, which research/00
                  HRV-04 admits at reduced fidelity: this ordinal rank.
                  THIS is the sense of quality that arbitrates; selection
                  promotes the lowest rank among the judgeable datasets, so
                  `selected_reason` is recomputable by hand from this field
                  beside `established`, `week_days` and `last_read`. The other
                  sense — a numeric per-tier CONFIDENCE WEIGHT, which HRV-04
                  rules out for the numeric tiers — is deliberately not here:
                  §3.7.4 computes no confidence weight in Section 3 and defers
                  the weighting to Section 6's readiness fusion, so emitting
                  one would mint a constant Section 3 does not own.
              last_read:
                type: string
                format: date
                nullable: true
                description: >
                  The latest local day this tier was read on INSIDE the
                  series baseline window, the nominal [date-66, date-7] clipped at
                  the coverage-gap resumption (research/00 HRV-15, T-09) — the
                  slice the recency gate is normative over (AC6), not the latest
                  reading overall.
                  Null when this tier has no reading in that window at all. The
                  gate is reproducible from this field: a judgeable dataset more
                  than recency_tolerance_days behind the greatest `last_read`
                  among the ESTABLISHED datasets is skipped, strictly greater
                  than, so a dataset exactly at the tolerance is kept. The
                  tolerance is served as thresholds.recency_tolerance_days
                  (C33, reversing IDEA-070).
              week_days:
                type: integer
                description: >
                  Distinct local days of the judged week [date-6, date] this
                  tier was read on — this dataset's share of the week, which is
                  `readings_in_window` only for the selected dataset. It is the
                  count half of judgeability (at least min_window_readings, 3)
                  and it is what weighs a name in `disagreed_with`.
              week_mean:
                type: number
                nullable: true
                description: >
                  Mean of ln rMSSD over this dataset's own judged-week
                  readings; null when it has none. It is `ln_rmssd_7d_mean` for
                  the selected dataset and is computed the same way for every
                  other, so `below` can be recomputed by hand from this and
                  `band`.
              below:
                type: boolean
                nullable: true
                description: >
                  week_mean < band.lo, STRICTLY LESS — the same comparison the
                  verdict makes for hrv_suppressed, made here against this
                  dataset's own band whether or not it is judgeable and whether
                  or not its own verdict would be withheld (AC10, taken
                  literally). Null when either side is missing, and a dataset
                  whose `below` is null cannot appear in `disagreed_with`.
                  Reported for every dataset, including when nothing is
                  selected and `disagreed_with` is empty by construction.
              reset_on:
                type: string
                format: date
                nullable: true
                description: >
                  This dataset's OWN reported reset day, decided per
                  dataset (AC17): the global coverage gap's resumption when one
                  fired — the same on every dataset, since a gap measures the
                  silence of the series as a whole — else this dataset's own era
                  boundary when that is reported, else null. `baseline.reset_on`
                  is the SELECTED dataset's, so a dataset that is not selected
                  can carry a report the rest of the response never shows.
              reset_reason:
                type: string
                enum: [coverage_gap, tier_change]
                nullable: true
                description: >
                  Why this dataset's reset is reported, with the same
                  meanings as `baseline.reset_reason` and the same caveat: the
                  report is not the clip. A dataset's baseline window is clipped
                  by its era boundary whether or not the change is reported, and
                  by an internal capture hole of more than gap_reset_days silent
                  local days, which is never reported at all — so a null here
                  can sit beside an `n` far below what the nominal 60-day
                  window [date-66, date-7] would hold, since `n` counts this
                  dataset's clipped baseline window (research/00 HRV-12, T-09).
        selected_dataset:
          type: string
          nullable: true
          description: >
            The source tier of the dataset `baseline` and `band` describe, and
            of the one `verdict` and `below_by` describe WHEREVER A VERDICT WAS
            ASSERTED — the highest-fidelity JUDGEABLE dataset the recency gate
            did not skip (F006 AC5–AC8). The scope on that second half is every
            verdict-free state on a selected dataset: its judged week withheld as
            unrepresentative (`week_not_representative`, research/00 HRV-31),
            and the future day, where for a `to` after the athlete's
            local today the verdict is replaced with hrv_unavailable /
            `day_not_happened`. In both the verdict is hrv_unavailable and
            `below_by` is null, so those two describe no dataset, while this
            field still names the one the retained `baseline`/`band` were
            computed from — a producer of the response, not a claim about it.
            `disagreed_with` is empty there for the converse reason. Null when no dataset was
            selected, which is EITHER that no dataset is judgeable OR that every
            judgeable one was skipped by the recency gate. In that case the verdict is
            hrv_unavailable and `baseline`/`band` are still populated, for
            presentation only, from the dataset the presentation fallback names
            (AC9; research/00 HRV-24, HRV-59): the
            established dataset read last in the baseline window, ties by `n`
            then fidelity; with none established, the densest by `n`; with no
            baseline reading of any tier, the densest in the judged week, ties
            to fidelity throughout. So every field non-nullable before F006
            still carries a value and this addition stays additive (AC12). The
            fallback PRESENTS; it never judges — no verdict is conferred by it,
            and `disagreed_with` is empty there even when the presented
            dataset's own week reads below its band, because a disagreement is
            with a verdict and there is none to disagree with. `datasets[]`
            still shows every dataset's side, so that state stays legible.
        selected_reason:
          type: string
          nullable: true
          enum:
            - highest_fidelity_judgeable
            - higher_fidelity_skipped_stale
          description: >
            Why `selected_dataset` is the one, drawn from a closed enum:
            `highest_fidelity_judgeable` — no judgeable dataset outranks it;
            `higher_fidelity_skipped_stale` — one did, and the recency gate
            skipped it, so `baseline`/`band` come from a
            lower-fidelity instrument — and, wherever a verdict is conferred, so
            does the verdict — and the response says so rather than leaving that
            fall invisible. Where `verdict` is hrv_unavailable (T125's returning
            athlete is served this value beside week_not_representative) no
            verdict is taken from any dataset: the value still says which
            dataset was presented and why, kept as computed (research/00 HRV-57),
            and makes no claim about a verdict. Non-null EXACTLY WHEN
            `selected_dataset` is non-null, null with null (AC13; the same
            shape `unavailable_reason` carries). It is derived from the
            selection rather than stored beside it, so it cannot disagree with
            which datasets were skipped.
        disagreed_with:
          type: array
          description: >
            The datasets whose judged week reads the OTHER SIDE OF THEIR OWN
            BAND from the selected dataset, in fidelity order, each with the
            judged-week count that weighs it (F006 AC10/AC11). Both directions
            are reported: a dataset below its band while the selected one reads
            within, and one within while the selected one reads below. A
            dataset below its band beside a selected dataset also below its own
            AGREES with the verdict and is not named. Judgeability is never
            consulted — a band from two baseline readings and a week of one can
            name a dataset here — so `week_days` is what a consumer weighs the
            name by. Disagreement NEVER OVERRIDES: `verdict` is the selected
            dataset's, unchanged, whatever is listed here. EMPTY WHENEVER
            `verdict` is `hrv_unavailable`, for any cause (research/00 HRV-22,
            amended 2026-09-21): a disagreement is a claim ABOUT a
            verdict and none was conferred. One condition over all three
            verdict-free states — `selected_dataset` null, where the
            presentation fallback speaks; a dataset that IS selected whose
            verdict is withheld because a returning dataset's judged week is
            entirely later than its own (`week_not_representative`); and a day
            that has not happened (`day_not_happened`). `unavailable_reason`
            does not imply a selection: `week_not_representative` is also
            served with `selected_dataset` null, when the dataset the fallback
            presents is itself withheld, and `day_not_happened` is served on a
            future day with `selected_dataset` null or not. `selected_dataset`
            separates the second state from the first; the third is identified
            by `unavailable_reason` alone and can coincide with either (T168,
            corrected by F006 review cycle 3). `datasets[]` still
            carries every dataset's own `below` on those days, and
            `selected_dataset`, `selected_reason` and the retained
            `baseline`/`band` are kept as computed. This is the response's one report of
            HRV-25's population: hrv_normal can be promoted from the best
            available instrument while another dataset reads below its own band,
            and a consumer reading `verdict` alone is not told. That is
            research/00 PRIN-14's forbidden direction, which ships only as the named
            exception PRIN-15 lists, owned by IDEA-099, and that population may
            not grow (research/00 HRV-25, PRIN-15).
          items:
            type: object
            properties:
              dataset: { type: string, description: "The disagreeing dataset's source tier." }
              week_days:
                type: integer
                description: >
                  That dataset's `week_days`, repeated here so the name can be
                  weighed where it is read: a judged week of one morning can
                  disagree, and the count is the difference between a second
                  instrument contradicting the verdict all week and a single
                  stray capture.

    # ---- Decisions & changes (planned) ----------------------------------
    DecisionRecord:
      type: object
      description: "Owner spec/09. Every applied adaptation, its inputs, and the rule that fired."
      properties:
        id: { type: string }
        timestamp: { type: string }
        timescale: { type: string, enum: [long_term, weekly, recent_workout, daily_readiness, intra_workout] }
        trigger: { type: string }
        inputs:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              value: {}
        rule_fired: { type: string, description: "The arbitration rung / rule id (spec/06 §6.5)." }
        action: { type: string }
        affected:
          type: object
          properties:
            dates: { type: array, items: { type: string, format: date } }
            workout_ids: { type: array, items: { type: string } }
        explanation: { type: string, description: "Plain-language rendering; numbers are the engine's, not invented." }

    ChangeFeedItem:
      type: object
      properties:
        id: { type: string }
        timestamp: { type: string }
        kind: { type: string, enum: [plan_change, goal_proposal, safety, data_quality, sync] }
        summary: { type: string }
        decision_id: { type: string, nullable: true }
        seen: { type: boolean, default: false }

    # ---- Connections & sync (planned) -----------------------------------
    GarminConnection:
      type: object
      properties:
        connected: { type: boolean }
        scopes: { type: array, items: { type: string } }
        connected_at: { type: string, nullable: true }

    SyncStatus:
      type: object
      properties:
        completed_last_synced_at: { type: string, nullable: true }
        plan_last_pushed_at: { type: string, nullable: true }
        pending: { type: boolean, default: false }
        last_error: { type: string, nullable: true }

    # ---- Coach (planned) ------------------------------------------------
    CoachMessage:
      type: object
      properties:
        id: { type: string }
        role: { type: string, enum: [athlete, coach] }
        text: { type: string }
        created_at: { type: string }
        parsed_input:
          type: object
          nullable: true
          description: When an athlete message translated into a structured input, its recognized kind (spec/08 §8.4).
          properties:
            kind: { type: string, enum: [constraint, injury, subjective, plan_change_request, goal_change, explanation_request] }
        references:
          type: array
          items: { type: string }
          description: Decision-record ids this reply is grounded in.
        change_set:
          allOf: [ { $ref: "#/components/schemas/ChangeSet" } ]
          nullable: true

    # ---- Session features (F013, implemented) ---------------------------
    FeatureValue:
      type: object
      description: >
        One session feature: a value, or the reason it is unavailable. Exactly
        one of the two is non-null; a value is never imputed (spec/03 section
        3.2), so a consumer reads `unavailable` before trusting `value`.
      required: [value, unavailable]
      properties:
        value: { type: number, nullable: true, description: "The value in the unit the feature's name states; null when unavailable." }
        unavailable:
          type: string
          nullable: true
          description: >
            Why no value is served, null when one is. `sport_not_running` (every
            feature of a non-running session) and `no_records` (every feature of a
            running session with no records) take precedence; then
            `no_counted_segments` (duration_s), `no_distance` (distance_m,
            avg_pace_s_per_km, gap_avg_pace_s_per_km; a zero distance is reported
            as unavailable, never as 0.0), `no_30s_block` and `no_motion` (the two
            NGP features), `no_heart_rate` and `cadence_lock` (avg_hr_bpm),
            `no_cadence`, `no_power` and `mixed_power_models` (avg_power_w),
            `no_altitude` (ascent and descent) and `not_recorded` (the env_*
            features; always the case on the FIT-upload path today).
    PowerFeatureValue:
      type: object
      description: "`avg_power_w` with the model its power samples were recorded under."
      required: [value, unavailable, power_model]
      properties:
        value: { type: number, nullable: true }
        unavailable: { type: string, nullable: true }
        power_model: { type: string, nullable: true, description: "The one power_model the samples carry (a sample with a null model still counts); null with no power or with mixed models." }
    SessionFeatures:
      type: object
      description: >
        GET /sessions/{id}/features: one session's grade-adjusted pace, NGP and
        descriptors, computed on read from its stored canonical records (F013).
        Nothing is stored. duration_s, distance_m and avg_pace_s_per_km are the
        same quantities SessionSummary names: recorded time, not elapsed
        (consecutive records with 0 < dt <= 5 s count, and so does a moving gap:
        a gap over 5 s crossed at 0.5 m/s or more of device distance; a standstill
        contributes neither time nor distance), and listSessions computes them by the same rule.
      required: [session_id, sport, flags, gap_coverage, grade_clamped_fraction, gps_degraded_fraction, features]
      properties:
        session_id: { type: string }
        sport: { type: string }
        flags:
          type: array
          items: { type: string }
          description: >
            The session's stored quality_flags first, in stored order with
            `smart_recording` moved to the front when present; then
            `distance_regressed`, `gap_unavailable` (D > 0 and gap_coverage < 1:
            spec/03 section 3.3.4's raw-pace fallback applied to part of the run),
            `grade_clamped` (a grade was clamped to +/-0.45) and `moving_gap` (a gap
            over 5 s was counted for time and distance). Each at most once.
        gap_coverage:
          type: number
          nullable: true
          description: "Share of distance_m contributed by graded segments (two altitude samples in their +/-25 m window); 0.0 with no altitude; null when distance_m is 0."
        grade_clamped_fraction:
          type: number
          nullable: true
          description: "Share of distance_m contributed by segments whose grade was clamped to +/-0.45; null when distance_m is 0."
        gps_degraded_fraction:
          type: number
          nullable: true
          description: "Share of distance_m contributed by segments starting at a gps_degraded record. Reported, not excluded. Null when distance_m is 0."
        features:
          type: object
          description: The 14 features, in this order.
          required: [duration_s, distance_m, avg_pace_s_per_km, gap_avg_pace_s_per_km, ngp_speed_m_s, ngp_pace_s_per_km, avg_hr_bpm, avg_cadence_spm, avg_power_w, total_ascent_m, total_descent_m, env_temperature_c, env_humidity_pct, env_wind_ms]
          properties:
            duration_s:
              allOf: [ { $ref: "#/components/schemas/FeatureValue" } ]
              description: "Recorded time T: the sum of dt over counted segments: 0 < dt <= 5 s, or a moving gap (dt > 5 s with device distance advancing at 0.5 m/s or more across it). A standstill over 5 s and a dt = 0 duplicate contribute nothing."
            distance_m:
              allOf: [ { $ref: "#/components/schemas/FeatureValue" } ]
              description: "D: the sum of max(dd, 0) over counted segments; a regressing segment contributes 0 m and raises distance_regressed."
            avg_pace_s_per_km:
              allOf: [ { $ref: "#/components/schemas/FeatureValue" } ]
              description: "1000 * T / D."
            gap_avg_pace_s_per_km:
              allOf: [ { $ref: "#/components/schemas/FeatureValue" } ]
              description: "1000 * T / sum(v_actual * g * dt): g is Minetti's cost of gradient relative to the flat over +/-25 m, clamped to +/-0.45; an ungraded segment contributes at g = 1, so avg_pace / gap_avg_pace is the distance-weighted mean g."
            ngp_speed_m_s:
              allOf: [ { $ref: "#/components/schemas/FeatureValue" } ]
              description: "Normalized graded speed: fourth root of the mean fourth power of the 30 s trailing mean of device speed * g, over every full window of every contiguous block (a block of fewer than 30 records yields none); a record reached by a dt = 0 segment is left out of the series and does not split its block."
            ngp_pace_s_per_km:
              allOf: [ { $ref: "#/components/schemas/FeatureValue" } ]
              description: "1000 / ngp_speed_m_s."
            avg_hr_bpm:
              allOf: [ { $ref: "#/components/schemas/FeatureValue" } ]
              description: "Time-weighted mean HR at each counted segment's start, over records with HR > 0 and without cadence_lock."
            avg_cadence_spm:
              allOf: [ { $ref: "#/components/schemas/FeatureValue" } ]
              description: "Time-weighted mean cadence at each counted segment's start, over records with cadence > 0."
            avg_power_w:
              allOf: [ { $ref: "#/components/schemas/PowerFeatureValue" } ]
              description: "Time-weighted mean power at each counted segment's start, with its power_model."
            total_ascent_m:
              allOf: [ { $ref: "#/components/schemas/FeatureValue" } ]
              description: "Ascent by a 1 m hysteresis over the present altitude samples in t order; no vendor total is read."
            total_descent_m:
              allOf: [ { $ref: "#/components/schemas/FeatureValue" } ]
              description: "Descent by the same 1 m hysteresis."
            env_temperature_c:
              allOf: [ { $ref: "#/components/schemas/FeatureValue" } ]
              description: "The session context's env_temperature_c, verbatim."
            env_humidity_pct:
              allOf: [ { $ref: "#/components/schemas/FeatureValue" } ]
              description: "The session context's env_humidity_pct, verbatim."
            env_wind_ms:
              allOf: [ { $ref: "#/components/schemas/FeatureValue" } ]
              description: "The session context's env_wind_ms, verbatim."

    # ---- Athlete profile (F016, implemented) -----------------------------
    ProfileSexEntry:
      type: object
      description: "`sex`: `male` or `female` from a FIT file, or `male`, `female` or `unspecified` as entered. Exactly one of value and unavailable is non-null."
      required: [value, unavailable, source, session_id, recorded_at, entered_value]
      properties:
        value: { type: string, nullable: true, enum: [female, male, unspecified] }
        unavailable: { type: string, nullable: true, enum: [missing], description: "`missing` when no stored file and no entry supplies a value." }
        source: { type: string, nullable: true, enum: [fit, entered], description: "`fit` (a stored session's FIT file), `entered` (the athlete's entry), null when unavailable." }
        session_id: { type: string, nullable: true, description: "The session whose file supplied the value; null unless source is `fit`." }
        recorded_at: { type: string, nullable: true, description: "The supplying session's start time (`fit`) or the time the entry was set (`entered`)." }
        entered_value: { type: string, nullable: true, enum: [female, male, unspecified], description: "The latest entry, shown even when a FIT value shadows it; null when none or cleared." }
    ProfileDateEntry:
      type: object
      description: "`birth_date`: entered only; no FIT file carries it. Fields as ProfileSexEntry."
      required: [value, unavailable, source, session_id, recorded_at, entered_value]
      properties:
        value: { type: string, format: date, nullable: true }
        unavailable: { type: string, nullable: true, enum: [missing] }
        source: { type: string, nullable: true, enum: [fit, entered] }
        session_id: { type: string, nullable: true }
        recorded_at: { type: string, nullable: true }
        entered_value: { type: string, format: date, nullable: true }
    ProfileNumberEntry:
      type: object
      description: "A body field, `body_mass_kg` (kg) or `height_cm` (cm). Fields as ProfileSexEntry."
      required: [value, unavailable, source, session_id, recorded_at, entered_value]
      properties:
        value: { type: number, nullable: true }
        unavailable: { type: string, nullable: true, enum: [missing] }
        source: { type: string, nullable: true, enum: [fit, entered] }
        session_id: { type: string, nullable: true }
        recorded_at: { type: string, nullable: true }
        entered_value: { type: number, nullable: true }
    ProfileIntegerEntry:
      type: object
      description: "A heart-rate field in bpm; for max_hr_bpm and threshold_hr_bpm only sessions stored as running count. Fields as ProfileSexEntry."
      required: [value, unavailable, source, session_id, recorded_at, entered_value]
      properties:
        value: { type: integer, nullable: true }
        unavailable: { type: string, nullable: true, enum: [missing] }
        source: { type: string, nullable: true, enum: [fit, entered] }
        session_id: { type: string, nullable: true }
        recorded_at: { type: string, nullable: true }
        entered_value: { type: integer, nullable: true }
    HrAnchors:
      type: object
      description: "The four anchors a load computation reads, each served or unavailable with its reason."
      required: [resting_hr_bpm, max_hr_bpm, threshold_hr_bpm, sex]
      properties:
        resting_hr_bpm: { $ref: "#/components/schemas/HrAnchor" }
        max_hr_bpm: { $ref: "#/components/schemas/HrAnchor" }
        threshold_hr_bpm: { $ref: "#/components/schemas/HrAnchor" }
        sex: { $ref: "#/components/schemas/SexAnchor" }
    HrAnchor:
      type: object
      description: >
        A heart-rate anchor in bpm: served (value, source, session_id,
        recorded_at and version set; unavailable null) or unavailable (those
        null; unavailable names the reason). entered_value is the field's latest
        entry either way.
      required: [value, unavailable, source, session_id, recorded_at, version, entered_value]
      properties:
        value: { type: integer, nullable: true }
        unavailable:
          type: string
          nullable: true
          enum: [missing, order_conflict]
          description: >
            `missing` when the field has no effective value (for sex, also when
            it is `unspecified`). `order_conflict` when the effective values break
            the ordering rule: resting HR must be below max HR, or both conflict;
            threshold HR must be above resting and below max, checked against
            whichever of the two are served, or threshold alone conflicts. No
            plausibility range is applied.
        source: { type: string, nullable: true, enum: [fit, entered] }
        session_id: { type: string, nullable: true }
        recorded_at: { type: string, nullable: true }
        version:
          type: integer
          nullable: true
          description: "Starts at 1 and moves when, and only when, the served value changes; the source does not move it, and neither does a period unavailable."
        entered_value: { type: integer, nullable: true }
    SexAnchor:
      type: object
      description: "The sex anchor: `male` or `female` when served; fields as HrAnchor, never `order_conflict`."
      required: [value, unavailable, source, session_id, recorded_at, version, entered_value]
      properties:
        value: { type: string, nullable: true, enum: [female, male] }
        unavailable: { type: string, nullable: true, enum: [missing, order_conflict] }
        source: { type: string, nullable: true, enum: [fit, entered] }
        session_id: { type: string, nullable: true }
        recorded_at: { type: string, nullable: true }
        version: { type: integer, nullable: true }
        entered_value: { type: string, nullable: true, enum: [female, male, unspecified], description: "The sex anchor's latest entry, `unspecified` included." }

    # ---- Session load (F017, implemented) -------------------------------
    SessionLoadReason:
      type: string
      description: >
        Why HR-TRIMP, and with it session_load, has no value. The F017
        reference's gates in order, first match wins: `sport_not_running`,
        `declared_capture` (a resting_hrv_check or health_snapshot tag),
        `no_hr` (no running time with usable HR), `missing_anchor` (resting or
        max HR has no value used; unavailable_fields names them),
        `order_conflict` (resting >= max among the values used),
        `avg_hr_below_resting` and `avg_hr_above_max` (average HR outside the
        bounds), `wrist_hr_threshold_unknown` (a wrist session with no usable
        threshold) and `wrist_hr_at_threshold` (a wrist session averaging at
        or above threshold), `not_representable` (a value used is not a finite
        float, or max - resting is not a positive finite float). Then, with
        hr_trimp.value served, `no_threshold_hr`, `threshold_order_conflict`
        and `not_representable` (threshold - resting not a positive finite
        float) leave session_load alone unavailable.
      enum:
        - sport_not_running
        - declared_capture
        - no_hr
        - missing_anchor
        - order_conflict
        - avg_hr_below_resting
        - avg_hr_above_max
        - wrist_hr_threshold_unknown
        - wrist_hr_at_threshold
        - not_representable
        - no_threshold_hr
        - threshold_order_conflict
    SessionLoadValue:
      type: object
      description: "session_load: HR-TRIMP on the threshold-hour scale (one hour at threshold HR scores 100), or why not."
      required: [value, unavailable, driver]
      properties:
        value: { type: number, nullable: true, description: "TRIMP / threshold_hour_reference * 100; null when unavailable." }
        unavailable:
          allOf: [ { $ref: "#/components/schemas/SessionLoadReason" } ]
          nullable: true
          description: "HR-TRIMP's reason when it has no value, else no_threshold_hr, threshold_order_conflict or not_representable; null when value is served."
        driver: { type: string, nullable: true, enum: [hr_trimp], description: "The metric behind value; null whenever value is null." }
    HrTrimp:
      type: object
      description: "Banister's HR-TRIMP over running time with usable HR, with the reference that scales it."
      required: [value, unavailable, unavailable_fields, threshold_hour_reference, coefficients]
      properties:
        value: { type: number, nullable: true, description: "duration_min * r * k * e^(c r), r = (HR_avg - HR_rest) / (HR_max - HR_rest); null when unavailable." }
        unavailable:
          allOf: [ { $ref: "#/components/schemas/SessionLoadReason" } ]
          nullable: true
          description: "The first gate that refused the session; null when value is served."
        unavailable_fields:
          type: array
          items: { type: string, enum: [resting_hr_bpm, max_hr_bpm] }
          description: "Under missing_anchor, the fields with no value used; empty otherwise."
        threshold_hour_reference: { type: number, nullable: true, description: "60 * r_thr * k * e^(c r_thr) with the session's own coefficients; null when unavailable or when the threshold has no usable value." }
        coefficients: { type: string, nullable: true, enum: [male, female], description: "The Banister pair used: male (0.64, 1.92) or female (0.86, 1.67); null when value is null." }
    Rtss:
      type: object
      description: "rTSS: unavailable until threshold pace exists."
      required: [value, unavailable]
      properties:
        value: { type: number, nullable: true, description: "Always null today: no threshold pace exists to compute it from." }
        unavailable: { type: string, enum: [no_threshold_pace, sport_not_running, declared_capture], description: "no_threshold_pace on a counted running session; gates 1 and 2 are carried by every metric." }
    Srpe:
      type: object
      description: "sRPE-load: unavailable until an RPE input exists."
      required: [value, unavailable]
      properties:
        value: { type: number, nullable: true, description: "Always null today: no RPE input path exists." }
        unavailable: { type: string, enum: [no_rpe, sport_not_running, declared_capture], description: "no_rpe on a counted running session; gates 1 and 2 are carried by every metric." }
    SessionLoadMetrics:
      type: object
      description: "The three load metrics of spec/03 section 3.4; only HR-TRIMP is computed."
      required: [hr_trimp, rtss, srpe]
      properties:
        hr_trimp: { $ref: "#/components/schemas/HrTrimp" }
        rtss: { $ref: "#/components/schemas/Rtss" }
        srpe: { $ref: "#/components/schemas/Srpe" }
    SessionLoadHrInput:
      type: object
      description: >
        One HR value used (resting, max or threshold, in bpm) and where it
        came from. The value is an unbounded integer, deliberately without a
        format: an entered max of 2^63 is saved and served exactly.
      required: [value, source, session_id, anchor_version, anchor_unavailable]
      properties:
        value: { type: integer, nullable: true, description: "The value used, in bpm; null when neither the file nor the anchor had one." }
        source: { type: string, nullable: true, enum: [session_file, anchor, session_file_dated, history], description: "session_file when the session's own FIT file carried the value. Otherwise the setting in effect on the run's date: session_file_dated (an earlier stored file, named by session_id), history (a dated entry, named by entry_id and effective_from) or anchor (the HR anchor in effect when the load was saved, the run having no file at or before its start, nor entry on or before its date, or that file being the anchor's own). Null when nothing supplied it. A body saved before dated entries existed has only session_file and anchor." }
        session_id: { type: string, nullable: true, description: "The session whose file carried the value; null unless source is session_file or session_file_dated. With session_file_dated the session may since have been deleted; the value stays until recomputed." }
        anchor_version: { type: integer, nullable: true, description: "The anchor's version when the load was saved; null unless source is anchor." }
        anchor_unavailable: { type: string, nullable: true, enum: [missing, order_conflict], description: "When the file carried no value and the anchor when the load was saved had none either, the anchor's own reason; null otherwise." }
        entry_id: { type: integer, nullable: true, default: null, description: "The dated entry that supplied the value; null unless source is history." }
        effective_from: { type: string, nullable: true, default: null, description: "That entry's effective date (YYYY-MM-DD); null unless source is history." }
        out_of_period: { type: boolean, default: false, description: "True when source is anchor and that anchor came from a file dated after the run: no stored file starting at or before the run's start (a running file, for max and threshold HR) and no dated entry effective on or before the run's local date carried the value. False otherwise, and false on a body saved before dated entries existed." }
    SessionLoadSexInput:
      type: object
      description: "The sex value used for the coefficients, and where it came from; fields as SessionLoadHrInput."
      required: [value, source, session_id, anchor_version, anchor_unavailable]
      properties:
        value: { type: string, nullable: true, enum: [male, female], description: "The value used; null when neither the file nor the anchor had one (the men's pair is used and sex_defaulted is flagged)." }
        source: { type: string, nullable: true, enum: [session_file, anchor] }
        session_id: { type: string, nullable: true }
        anchor_version: { type: integer, nullable: true }
        anchor_unavailable: { type: string, nullable: true, enum: [missing, order_conflict] }
        entry_id: { type: integer, nullable: true, default: null, description: "Always null: sex has no dated entries." }
        effective_from: { type: string, nullable: true, default: null, description: "Always null: sex has no dated entries." }
        out_of_period: { type: boolean, default: false, description: "Always false: sex is the file's or the anchor's." }
    SessionLoadInputs:
      type: object
      description: "Every value the load was computed from, saved with it: the time basis and the four HR values used with their sources."
      required: [hr_time_s, recorded_time_s, timer_time_s, hr_time_fraction, avg_hr_bpm, hr_source, resting_hr_bpm, max_hr_bpm, threshold_hr_bpm, sex]
      properties:
        hr_time_s: { type: number, description: "Running time with usable HR: the sum of dt over counted segments (a stride of 0 < dt <= 5 s, or a moving gap over 5 s crossed at 0.5 m/s or more, which carries the HR at its start) whose start HR is present, above 0 and not cadence_lock. A stationary pause adds nothing; nothing is interpolated across a gap." }
        recorded_time_s: { type: number, nullable: true, description: "F013's duration_s, reported beside hr_time_s; null when unavailable." }
        timer_time_s: { type: number, nullable: true, description: "The FIT session.total_timer_time stored at ingest; null when the file carried none." }
        hr_time_fraction: { type: number, nullable: true, description: "hr_time_s / timer_time_s with no cut-off and no clamp (a full run reads within 0.01 of 1 on either side); null when timer_time_s is null or 0." }
        avg_hr_bpm: { type: number, nullable: true, description: "F013's served avg_hr_bpm, the dt-weighted mean over the same segments; null when unavailable." }
        hr_source: { type: string, nullable: true, description: "The session's stored hr_source (chest_strap, wrist_ppg or null); anything but chest_strap takes the wrist path." }
        resting_hr_bpm: { $ref: "#/components/schemas/SessionLoadHrInput" }
        max_hr_bpm: { $ref: "#/components/schemas/SessionLoadHrInput" }
        threshold_hr_bpm: { $ref: "#/components/schemas/SessionLoadHrInput" }
        sex: { $ref: "#/components/schemas/SessionLoadSexInput" }
    SessionLoad:
      type: object
      description: >
        GET /sessions/{id}/load: the training load of one session, HR-TRIMP
        first (F017), as saved at its upload or its last recompute. Computed
        in the upload's own transaction, from the session's own file values
        (else the setting in effect on the run's date) and saved with every
        value used; a later anchor change moves nothing until
        recomputeSessionLoad replaces it. The route serves the saved body and
        reads no anchor.
      required: [session_id, sport, session_load, flags, input_flags, metrics, inputs]
      properties:
        session_id: { type: string }
        sport: { type: string }
        session_load: { $ref: "#/components/schemas/SessionLoadValue" }
        flags:
          type: array
          items: { type: string, enum: [wrist_hr, sex_defaulted] }
          description: "wrist_hr on every running session whose hr_source is not chest_strap, whatever the outcome; sex_defaulted when TRIMP was computed with the men's pair for want of a sex value."
        input_flags:
          type: array
          items: { type: string }
          description: "F013's feature flags and the session's stored quality_flags, passed through, each at most once."
        metrics: { $ref: "#/components/schemas/SessionLoadMetrics" }
        inputs:
          allOf: [ { $ref: "#/components/schemas/SessionLoadInputs" } ]
          description: "The values used and their sources, reported under every gate, gates 1 and 2 included."

    # ---- Load chart (F018, implemented) --------------------------------
    LoadChartReason:
      type: string
      description: >
        Why an uncounted run's saved load is unavailable: SessionLoadReason
        minus the two exclusion reasons (sport_not_running and
        declared_capture exclude a session instead of marking its day).
      enum:
        - no_hr
        - missing_anchor
        - order_conflict
        - avg_hr_below_resting
        - avg_hr_above_max
        - wrist_hr_threshold_unknown
        - wrist_hr_at_threshold
        - not_representable
        - no_threshold_hr
        - threshold_order_conflict
    LoadChartCounted:
      type: object
      description: "A session the day counted: its saved load is a number and adds to the day's load."
      required: [session_id, load]
      properties:
        session_id: { type: string }
        load: { type: number, description: "The session's saved session_load.value, unrounded." }
    LoadChartUncounted:
      type: object
      description: >
        A running session the day could not count: its saved load is
        unavailable for a reason other than the two exclusions. It adds
        nothing and marks the day; it is never served as a 0.
      required: [session_id, reason]
      properties:
        session_id: { type: string }
        reason:
          allOf: [ { $ref: "#/components/schemas/LoadChartReason" } ]
          description: "The saved session_load.unavailable reason."
    LoadChartExcluded:
      type: object
      description: >
        A session that is not running load by design: a non-running sport or
        a declared resting capture. It adds nothing and does not mark the day.
      required: [session_id, reason]
      properties:
        session_id: { type: string }
        reason: { type: string, enum: [sport_not_running, declared_capture] }
    LoadChartSeed:
      type: object
      description: >
        The start value both curves begin from (spec/03 section 3.5.3 as
        amended by F018): the mean of the day loads over the first 42 days of
        history, or over all of it when shorter. One rule for every history
        length, so the chart never jumps when history passes 42 days.
      required: [value, window_days, provisional_until]
      properties:
        value: { type: number, description: "CTL_0 = ATL_0; the mean daily load over window_days, unrounded." }
        window_days: { type: integer, description: "The days averaged: 42, or the length of history when shorter." }
        provisional_until: { type: string, format: date, description: "first_day + 41: the last day inside the first 42 days of history, a future date while history is shorter." }
    LoadChartDay:
      type: object
      description: "One local date of history, with the sessions it counted, could not count and excluded."
      required: [date, load, ctl, atl, tsb, provisional, marked, uncounted_in_window, counted, uncounted, excluded, after_gap]
      properties:
        date: { type: string, format: date, description: "The local date in athlete_timezone." }
        load: { type: number, description: "The sum of the counted sessions' saved loads; 0 on a rest day or a marked day." }
        ctl: { type: number, description: "CTL_(d-1) + (load - CTL_(d-1)) * (1 - e^(-1/42)), unrounded." }
        atl: { type: number, description: "ATL_(d-1) + (load - ATL_(d-1)) * (1 - e^(-1/7)), unrounded." }
        tsb: { type: number, description: "CTL_(d-1) - ATL_(d-1): yesterday's values, so 0 on the first day." }
        provisional: { type: boolean, description: "True on every day inside the first 42 days of history, where the seed still moves." }
        marked: { type: boolean, description: "True when uncounted is non-empty: a run without a load moved this day like a rest day." }
        uncounted_in_window: { type: integer, description: "Uncounted sessions on the 42 days ending this day." }
        counted:
          type: array
          items: { $ref: "#/components/schemas/LoadChartCounted" }
          description: "Ordered by start_time then session_id."
        uncounted:
          type: array
          items: { $ref: "#/components/schemas/LoadChartUncounted" }
          description: "Ordered by start_time then session_id."
        excluded:
          type: array
          items: { $ref: "#/components/schemas/LoadChartExcluded" }
          description: "Ordered by start_time then session_id."
        after_gap: { type: boolean, description: "True on the first running day after a gap in history and the 41 days after it: the recursion carried on through the break, so these values are still mostly the break. Not a re-seed, and not provisional." }
    LoadChartGap:
      type: object
      description: >
        A gap in history: a stretch of more than 21 consecutive empty local
        days (no counted and no uncounted run; an excluded ride or capture
        does not end it) that ended in a running day on or before today. The
        HRV trend's coverage-gap silence, also strict. A stretch still open
        today is not listed and marks nothing.
      required: [first_empty_day, last_empty_day, empty_days]
      properties:
        first_empty_day: { type: string, format: date, description: "The first local date of the stretch: the day after the last run before the gap." }
        last_empty_day: { type: string, format: date, description: "The last local date of the stretch: the day before the first run back." }
        empty_days: { type: integer, description: "last_empty_day - first_empty_day + 1; always more than 21." }
    LoadChart:
      type: object
      description: >
        GET /metrics/load: the fitness, fatigue and form series (F018, spec/03
        section 3.5). Computed on read from the saved loads (F017; a recompute replaces one),
        the sessions' start_time and the configured athlete_timezone; nothing
        is stored. The curves always run from the first day of history; from
        and to choose which days are returned.
      required: [timezone, today, first_day, seed, gaps, days]
      properties:
        timezone: { type: string, description: "The configured athlete_timezone the days were bucketed in." }
        today: { type: string, format: date, description: "The athlete's local today, resolved once per request: the default to." }
        first_day: { type: string, format: date, nullable: true, description: "The first local date holding a counted or uncounted session; null when the store holds no running session." }
        seed:
          allOf: [ { $ref: "#/components/schemas/LoadChartSeed" } ]
          nullable: true
          description: "Null when first_day is null or after today."
        gaps:
          type: array
          items: { $ref: "#/components/schemas/LoadChartGap" }
          description: "Every gap in the whole history up to today, oldest first, whatever from and to are; empty when there is none."
        days:
          type: array
          items: { $ref: "#/components/schemas/LoadChartDay" }
          description: "Every local date from the later of from and first_day to to, in order, rest days included; empty when history has no day in the range."
    HrHistoryEntryCreate:
      type: object
      description: "addHrHistoryEntry's body. All three keys are required; any other key is a 422."
      required: [field, value, effective_from]
      additionalProperties: false
      properties:
        field: { type: string, enum: [resting_hr_bpm, max_hr_bpm, threshold_hr_bpm] }
        value: { type: integer, exclusiveMinimum: 0, description: "A whole number of bpm above 0." }
        effective_from: { type: string, format: date, description: "Not after today in the athlete's timezone." }
    HrHistoryEntry:
      type: object
      description: "One dated HR setting (F021). At most one per field and effective_from."
      required: [entry_id, field, value, effective_from, set_at]
      properties:
        entry_id: { type: integer }
        field: { type: string, enum: [resting_hr_bpm, max_hr_bpm, threshold_hr_bpm] }
        value: { type: integer }
        effective_from: { type: string, format: date }
        set_at: { type: string, description: "When the value was last written, ISO 8601 in UTC; a replacement moves it and keeps the entry_id." }
    ImportProgress:
      type: object
      description: "How far the job has got: candidates screened while scanning, activities done while running."
      required: [fit_files_scanned, activities_total, activities_processed]
      properties:
        fit_files_scanned: { type: integer, description: "FIT candidates screened so far (written every 100 while scanning)." }
        activities_total: { type: integer, description: "Rows the job will process: activities and HRV_STATUS files, plus unreadable FIT candidates." }
        activities_processed: { type: integer, description: "Rows written so far; equal to activities_total when the job completes." }
    ImportUnreadableArchive:
      type: object
      description: "An inner zip that is encrypted, could not be read, did not open, or passed its 1 GiB cap; its entries were not read."
      required: [label, reason]
      properties:
        label: { type: string, description: "The inner zip's path in the archive." }
        reason: { type: string }
    ImportCounts:
      type: object
      description: "The job's tallies. The three maps are keyed by name and count files."
      required: [stored, already_stored, failed, skipped_sport, non_activity, not_fit, unreadable_archives]
      properties:
        stored: { type: integer }
        already_stored: { type: integer }
        failed: { type: integer }
        no_night: { type: integer, default: 0, description: "HRV_STATUS files holding no night; 0 for a job stored before the key existed." }
        replaced: { type: integer, default: 0, description: "Nights that replaced a stored re-summary of themselves; 0 for a job stored before the key existed." }
        skipped_sport: { type: object, additionalProperties: { type: integer }, description: "By the sport the FIT file names (a number as its string)." }
        non_activity: { type: object, additionalProperties: { type: integer }, description: "By FIT file type name (a number for a Garmin-private type)." }
        not_fit: { type: object, additionalProperties: { type: integer }, description: "By lower-cased extension without the dot; (none) without one." }
        unreadable_archives:
          type: array
          items: { $ref: "#/components/schemas/ImportUnreadableArchive" }
    ImportFile:
      type: object
      description: "One processed activity or HRV_STATUS file (or unreadable FIT candidate), in processing order."
      required: [seq, entry, time_created, outcome, session_id, sport, activity_tag, quality_flags, status, detail]
      properties:
        seq: { type: integer, description: "Processing order from 1: oldest time_created first." }
        entry: { type: string, description: "The entry's path, or <outer path>!<inner path> inside an inner zip." }
        time_created: { type: string, nullable: true, description: "file_id.time_created, ISO 8601 in UTC." }
        outcome: { type: string, enum: [stored, replaced, already_stored, no_night, skipped_sport, failed] }
        session_id: { type: string, nullable: true, description: "Kept after that session is deleted." }
        sport: { type: string, nullable: true, description: "Canonical sport when stored; `other` on a night's row (stored, replaced or no_night); the FIT file's sport when skipped_sport." }
        activity_tag: { type: string, nullable: true, description: "resting_hrv_check and health_snapshot mark resting captures; overnight_hrv a night's stored, replaced or no_night row." }
        quality_flags: { type: array, nullable: true, items: { type: string }, description: "The stored or replacing session's quality flags ([] for a night); null for other outcomes." }
        status: { type: integer, nullable: true, description: "On failed: for a file the pipeline refused, the status POST /sessions answers for it (413 for a FIT entry over its 50 MB cap); null for a candidate that could not be screened, and otherwise." }
        detail: { type: string, nullable: true, description: "On failed: for a file the pipeline refused, the message POST /sessions answers; for a candidate that could not be screened, the scan's reason (the entry is encrypted or could not be read, file_id carries no type, file_id could not be read); otherwise \"database is locked\", or the exception's type and message." }
    Import:
      type: object
      description: "One archive import job (F020). files is served by getImport and startImport only."
      required: [import_id, archive_name, archive_bytes, status, error, created_at, started_at, finished_at, progress, counts]
      properties:
        import_id: { type: string }
        archive_name: { type: string, description: "The uploaded file's name, as sent." }
        archive_bytes: { type: integer, nullable: true }
        status: { type: string, enum: [queued, scanning, running, completed, failed, interrupted] }
        error: { type: string, nullable: true, description: "On failed: the cause." }
        created_at: { type: string, description: "ISO 8601 in UTC." }
        started_at: { type: string, nullable: true }
        finished_at: { type: string, nullable: true, description: "Also set when startup finds the job interrupted." }
        progress: { $ref: "#/components/schemas/ImportProgress" }
        counts: { $ref: "#/components/schemas/ImportCounts" }
        files:
          type: array
          nullable: true
          items: { $ref: "#/components/schemas/ImportFile" }
          description: "Every processed row in seq order; absent from listImports."
    ImportPage:
      type: object
      description: "listImports: every import job, newest first, without files."
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Import" }
          description: "Newest first by created_at; no item carries files."
    SessionLoadRecompute:
      type: object
      description: >
        recomputeSessionLoad: the recomputed body, as now saved, with
        SessionLoad's fields at the top level (no wrapper), plus changed.
      required: [session_id, sport, session_load, flags, input_flags, metrics, inputs, changed]
      properties:
        session_id: { type: string }
        sport: { type: string }
        session_load: { $ref: "#/components/schemas/SessionLoadValue" }
        flags:
          type: array
          items: { type: string, enum: [wrist_hr, sex_defaulted] }
          description: "As SessionLoad.flags."
        input_flags:
          type: array
          items: { type: string }
          description: "As SessionLoad.input_flags."
        metrics: { $ref: "#/components/schemas/SessionLoadMetrics" }
        inputs:
          allOf: [ { $ref: "#/components/schemas/SessionLoadInputs" } ]
          description: "As SessionLoad.inputs; each HR block carries out_of_period."
        changed: { type: boolean, description: "Whether any field of the new body differs from the body saved before, compared after filling the dated-entry input keys' defaults on the old body; true when the session had no saved load." }
    RaceTagsUpdate:
      type: object
      description: "setRaceTags' body: 1 to 500 items with distinct connect_activity_id. Any other key is a 422."
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 500
          items: { $ref: "#/components/schemas/RaceTagItem" }
          description: "Each connect_activity_id once; a repeated id is a 422."
    RaceTagItem:
      type: object
      description: "One Connect activity's tag. Exactly one of tag and race. Strict: any other key, a non-integer id, a non-boolean race, a tag other than the two or null, both or neither of tag and race, a negative or non-finite number, or another start_time form is a 422."
      required: [connect_activity_id, start_time, distance_m, duration_s]
      additionalProperties: false
      properties:
        connect_activity_id: { type: integer, description: "The Connect activityId." }
        start_time:
          type: string
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(Z|\+00:00)$'
          description: "Connect's startTimeGMT in UTC, whole seconds, ending Z or +00:00; a date or time that does not exist is a 422."
        distance_m: { type: number, nullable: true, minimum: 0, description: "Connect's distance in metres, or null. Zero is accepted and agrees only with a stored 0; null never agrees." }
        duration_s: { type: number, nullable: true, minimum: 0, description: "Connect's duration in seconds, or null. Zero is accepted and agrees only with a stored 0; null never agrees." }
        race: { type: boolean, description: "Whether Connect's event type is race: true means the tag race, false means no tag. An explicit null is a 422." }
        tag: { type: string, enum: [race, threshold_workout], nullable: true, description: "The tag to store (F026): race, threshold_workout, or null to clear." }
    RaceTagItemResult:
      type: object
      description: "One item's outcome, in request order."
      required: [connect_activity_id, outcome, session_id, candidates]
      properties:
        connect_activity_id: { type: integer }
        outcome: { type: string, enum: [tagged, cleared, retagged, unchanged, not_stored, mismatch, ambiguous, other_tag] }
        session_id: { type: string, nullable: true, description: "The session tagged, cleared, retagged, left unchanged or left with another tag, or the one mismatch candidate; null for not_stored and ambiguous." }
        candidates:
          type: array
          items: { type: string }
          description: "Every stored running session at the item's start second, resting captures excluded; empty for not_stored."
    RaceTagCounts:
      type: object
      description: "How many items had each outcome; every key is present, zero included. by_tag breaks the written outcomes down per tag."
      required: [tagged, cleared, retagged, unchanged, not_stored, mismatch, ambiguous, other_tag, by_tag]
      properties:
        tagged: { type: integer }
        cleared: { type: integer }
        retagged: { type: integer }
        unchanged: { type: integer }
        not_stored: { type: integer }
        mismatch: { type: integer }
        ambiguous: { type: integer }
        other_tag: { type: integer }
        by_tag: { $ref: "#/components/schemas/RaceTagCountsByTag" }
    RaceTagCountsByTag:
      type: object
      description: "RaceTagCounts.by_tag: the written outcomes per tag."
      required: [race, threshold_workout]
      properties:
        race: { $ref: "#/components/schemas/RaceTagWrites" }
        threshold_workout: { $ref: "#/components/schemas/RaceTagWrites" }
    RaceTagWrites:
      type: object
      description: "One tag's written outcomes: tagged and retagged count items that wanted the tag, cleared items whose stored tag it was."
      required: [tagged, cleared, retagged]
      properties:
        tagged: { type: integer }
        cleared: { type: integer }
        retagged: { type: integer }
    RaceTagsResult:
      type: object
      description: "setRaceTags' 200 body."
      required: [items, counts]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/RaceTagItemResult" }
          description: "One per request item, in request order."
        counts: { $ref: "#/components/schemas/RaceTagCounts" }
    SessionLapsAttached:
      type: object
      description: "attachSessionLaps' 200 body: the rows the file replaced the session's with."
      required: [session_id, laps, workout_steps]
      properties:
        session_id: { type: string }
        laps: { type: integer, description: "How many lap rows the session now has." }
        workout_steps: { type: integer, description: "How many workout step rows the session now has." }
    SessionLap:
      type: object
      description: >
        One laps entry of SessionDetail (F025), in lap order. start_t and end_t
        are signed seconds from the instant record t is measured from; an end
        before its start is served as stored. A value the file did not carry,
        or carried invalid, is null.
      required: [lap_index, start_t, end_t, timer_s, elapsed_s, distance_m, intensity, wkt_step_index, lap_trigger]
      properties:
        lap_index: { type: integer, description: "Stored laps counted from 0 in file order." }
        start_t: { type: number, nullable: true }
        end_t: { type: number, nullable: true }
        timer_s: { type: number, nullable: true, description: "total_timer_time: excludes pauses." }
        elapsed_s: { type: number, nullable: true, description: "total_elapsed_time: includes pauses." }
        distance_m: { type: number, nullable: true }
        intensity: { type: string, nullable: true, description: "The FIT profile name (warmup, active, interval, recovery, rest, cooldown, ...)." }
        wkt_step_index: { type: integer, nullable: true, description: "The workout step the lap belongs to." }
        lap_trigger: { type: string, nullable: true }
    SessionWorkoutStep:
      type: object
      description: >
        One workout_steps entry of SessionDetail (F025), in file order. Not the
        planned-workout WorkoutStep. Values are as the file writes them; their
        meaning depends on duration_type and target_type (a time step's
        duration in seconds, a speed target in m/s, a repeat step's
        duration_value the step it repeats from and target_value the repeat
        count, a heart-rate target in the FIT +100 encoding).
      required: [step_index, workout_name, step_name, intensity, duration_type, duration_value, target_type, target_value, target_low, target_high]
      properties:
        step_index: { type: integer, nullable: true, description: "The step's message_index." }
        workout_name: { type: string, nullable: true }
        step_name: { type: string, nullable: true }
        intensity: { type: string, nullable: true }
        duration_type: { type: string, nullable: true }
        duration_value: { type: number, nullable: true }
        target_type: { type: string, nullable: true }
        target_value: { type: number, nullable: true }
        target_low: { type: number, nullable: true }
        target_high: { type: number, nullable: true }
    LapCandidatesRequest:
      type: object
      description: "matchLapCandidates' body: 1 to 500 items with distinct connect_activity_id. Any other key is a 422."
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 500
          items: { $ref: "#/components/schemas/LapCandidateItem" }
          description: "Each connect_activity_id once; a repeated id is a 422."
    LapCandidateItem:
      type: object
      description: "One listed Connect run to match by its start second. Strict: any other key, a non-integer id or another start_time form is a 422."
      required: [connect_activity_id, start_time]
      additionalProperties: false
      properties:
        connect_activity_id: { type: integer, description: "The Connect activityId." }
        start_time:
          type: string
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(Z|\+00:00)$'
          description: "Connect's startTimeGMT in UTC, whole seconds, ending Z or +00:00; a date or time that does not exist is a 422."
    LapCandidateItemResult:
      type: object
      description: "One item's answer, in request order."
      required: [connect_activity_id, outcome, session_id, laps_read_at]
      properties:
        connect_activity_id: { type: integer }
        outcome: { type: string, enum: [matched, not_stored, ambiguous], description: "matched: exactly one stored running session at the item's start second (resting captures excluded); not_stored: none; ambiguous: two or more. Distance and duration are never compared." }
        session_id: { type: string, nullable: true, description: "The matched session; null for not_stored and ambiguous." }
        laps_read_at: { type: string, nullable: true, description: "When the matched session's laps were last read from its file; null when never read, and for not_stored and ambiguous." }
    LapCandidatesResult:
      type: object
      description: "matchLapCandidates' 200 body."
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/LapCandidateItemResult" }
          description: "One per request item, in request order."
    RiegelDeterminant:
      type: object
      description: >
        getState: the `riegel_exponent` entry (F029), the individual endurance exponent b from the
        tagged races of the last 1095 days that pass the F029 reference section 2 screens, or the
        population 1.06 until three races, a fading race counted by its weight, span a twofold
        distance ratio. Beside the estimate it
        carries what reproduces it by hand: `error`, `t_multiplier`, the races used (`efforts`),
        those not used (`excluded`) and the constants (`parameters`). Its interval covers
        race-to-race scatter, not bias: a race not run all-out moves b and the interval together.
        Its `trend` is not computed yet: `direction` is `unknown` and `rate` null.
      required: [name, estimate, unavailable, trend, error, t_multiplier, population_default, below_one, efforts, excluded, parameters]
      properties:
        name: { type: string, enum: [riegel_exponent] }
        estimate:
          allOf: [{ $ref: "#/components/schemas/ConfidenceValue" }]
          nullable: true
          description: "b with its 80 % interval, `unit` `1`, `provisional` true for the population value; null when `unavailable` is set. The label reads the error alone; the interval carries the precision, t included, so a consumer comparing fits reads the interval."
        unavailable:
          type: string
          enum: [estimate_not_finite]
          nullable: true
          description: "`estimate_not_finite` when a race's GAP-equivalent distance, b, the error, the interval or a residual is not finite: `estimate`, `error` and `t_multiplier` are null, `efforts` and `parameters` still served. Null with an estimate."
        trend: { $ref: "#/components/schemas/Trend" }
        error: { type: number, nullable: true, description: "The weighted standard error of b over the effective number of races less 2, n_eff = (sum w)^2 / sum(w^2) (0.05 for the population value); null when unavailable." }
        t_multiplier: { type: number, nullable: true, description: "Student's t at 0.90 for floor(n_eff + 1e-9) - 2 degrees of freedom, n_eff the effective number of races (z above 30 and for the population value); null when unavailable." }
        population_default: { type: boolean, description: "True when the races used count fewer than three by their weights (the effective number of races, so a fading race counts as less than one) or the longest is under twice the shortest: the population 1.06 is served." }
        below_one: { type: boolean, description: "A fitted b under 1: a race used was probably not all-out, or a trail race. Outranks the label." }
        efforts:
          type: array
          description: "The races used, in start-time order."
          items: { $ref: "#/components/schemas/RiegelEffort" }
        excluded:
          type: array
          description: "Every tagged running race at or before `as_of` not used, in start-time order."
          items: { $ref: "#/components/schemas/RiegelExclusion" }
        parameters: { $ref: "#/components/schemas/RiegelExponentParameters" }
    RiegelEffort:
      type: object
      description: "getState: a tagged race the fit of b used, with its weight, its fitness figures and its residual."
      required: [session_id, start_time, duration_s, distance_m, gap_pace_s_per_km, gap_equivalent_m, gap_coverage, gps_degraded_fraction, weight, fitness_before, fitness_earlier, fitness_drop, fitness_provisional, fitness_after_gap, residual]
      properties:
        session_id: { type: string }
        start_time: { type: string, format: date-time }
        duration_s: { type: number, description: "`timer_time_s`, else the summary's `duration_s`." }
        distance_m: { type: number, nullable: true, description: "The summary's `distance_m`, shown beside the GAP-equivalent distance." }
        gap_pace_s_per_km: { type: number, description: "F013's grade-adjusted pace of the race." }
        gap_equivalent_m: { type: number, nullable: true, description: "`1000 * duration_s / gap_pace_s_per_km`, the distance the fit reads; null when not finite, and the estimate is then unavailable." }
        gap_coverage: { type: number, nullable: true, description: "F013's graded share of the distance; below 1 counts at flat pace." }
        gps_degraded_fraction: { type: number, nullable: true, description: "F013's degraded-GPS share of the distance; shown, never judged." }
        weight: { type: number, description: "`min(1, (1095 - age in days) / 182)`: 1 until 913 days old, falling to 0 at 1095. The race counts by it in the effective number of races, (sum w)^2 / sum(w^2), that sets the bar, the error and t." }
        fitness_before: { type: number, nullable: true, description: "The load chart's CTL on the local day before the race; null when that day is before the chart's first day." }
        fitness_earlier: { type: number, nullable: true, description: "The load chart's CTL 29 days before the race's local day; null when that day is before the chart's first day." }
        fitness_drop: { type: number, nullable: true, description: "`1 - fitness_before / fitness_earlier`, the fall over the four weeks; null without both figures." }
        fitness_provisional: { type: boolean, nullable: true, description: "The day-before chart day's `provisional`; null when that day is before the chart's first day." }
        fitness_after_gap: { type: boolean, nullable: true, description: "The day-before chart day's `after_gap`; null when that day is before the chart's first day." }
        residual: { type: number, nullable: true, description: "`exp(r) - 1` against the fitted line, positive slower; null below the bar and when unavailable." }
    RiegelExclusion:
      type: object
      description: "getState: a tagged running race at or before `as_of` that the fit of b did not use, and why."
      required: [session_id, start_time, reason, fitness_before, fitness_earlier, fitness_drop]
      properties:
        session_id: { type: string }
        start_time: { type: string, format: date-time }
        reason:
          type: string
          enum: [admitted_as_workout, outside_window, summary_unreadable, duration_unavailable, quality_flags_unreadable, distance_regressed, smart_recording, fitness_dropped, features_unavailable, grade_clamped, gap_pace_unavailable]
          description: >
            The first of the F029 reference section 2 rows the race fails: `admitted_as_workout` (a
            listed workout name), `outside_window` (1095 days or more before `as_of`),
            `summary_unreadable` or `duration_unavailable`, `quality_flags_unreadable` or a stored
            flag (`distance_regressed`, `smart_recording`), `fitness_dropped` (fitness fell more than
            30 % in the four weeks before the day before the race), `features_unavailable` or an F013
            flag (`distance_regressed`, `smart_recording`, `grade_clamped`), `gap_pace_unavailable`.
        fitness_before: { type: number, nullable: true, description: "For `fitness_dropped`, the CTL on the local day before the race; else null." }
        fitness_earlier: { type: number, nullable: true, description: "For `fitness_dropped`, the CTL 29 days before the race's local day; else null." }
        fitness_drop: { type: number, nullable: true, description: "For `fitness_dropped`, `1 - fitness_before / fitness_earlier`; else null." }
    RiegelExponentParameters:
      type: object
      description: "getState: the constants b was computed with (F029 reference section 1), so it can be redone by hand."
      required: [window_days, fade_days, min_races, min_spread, fitness_drop, fitness_lookback_days, population_b, population_error, coverage, high_max_error, medium_max_error]
      properties:
        window_days: { type: integer }
        fade_days: { type: integer }
        min_races: { type: integer }
        min_spread: { type: number }
        fitness_drop: { type: number }
        fitness_lookback_days: { type: integer }
        population_b: { type: number }
        population_error: { type: number }
        coverage: { type: number }
        high_max_error: { type: number }
        medium_max_error: { type: number }
    ThresholdEffort:
      type: object
      description: "getState: a race or threshold workout (tagged Training or named in `threshold_workout_names`) the threshold estimate used, with the gain it entered with (1 for the first)."
      required: [session_id, start_time, kind, duration_s, gap_pace_s_per_km, gap_coverage, gps_degraded_fraction, gain, active_blocks, admitted_by, workout_name]
      properties:
        session_id: { type: string }
        start_time: { type: string, format: date-time }
        kind: { type: string, enum: [race, threshold_workout], description: "`race`, or `threshold_workout` (tagged Training in Connect, or a step's workout name listed in `threshold_workout_names`)." }
        duration_s: { type: number, description: "A race's `timer_time_s`, else the summary's `duration_s`; a workout's counted time `A`, the counted reps' summed `timer_s`." }
        gap_pace_s_per_km: { type: number, description: "F013's grade-adjusted pace of the race, or of the workout's counted reps' windows." }
        gap_coverage: { type: number, nullable: true, description: "F013's graded share of the distance (a workout's: over its counted reps' windows); below 1 counts at flat pace." }
        gps_degraded_fraction: { type: number, nullable: true, description: "F013's degraded-GPS share of the distance (a workout's: over its counted reps' windows); shown, never judged." }
        gain: { type: number }
        active_blocks: { type: integer, nullable: true, description: "A workout's runs of consecutive counted laps, remainder laps included (3x10 min with jogs reads 3 when the jogs are recovery steps; Goal Pace Run steps 1 then 2 read 1); null for a race." }
        admitted_by: { type: array, nullable: true, items: { type: string, enum: [tag, name] }, description: "What admitted a workout, in this order: `tag` (tagged Training in Connect) and `name` (a step row's workout name is listed in `threshold_workout_names`); a tagged workout whose laps are unread reads `[\"tag\"]`, its name unseen. Null for a race." }
        workout_name: { type: string, nullable: true, description: "A workout's stored workout name as written on its first step row that has one; null when none has, and for a race." }
    ThresholdExclusion:
      type: object
      description: "getState: a running race or threshold workout (tagged Training or named in `threshold_workout_names`) at or before `as_of` that the threshold estimate did not use, and why."
      required: [session_id, start_time, kind, reason, admitted_by, workout_name]
      properties:
        session_id: { type: string }
        start_time: { type: string, format: date-time }
        kind: { type: string, enum: [race, threshold_workout], description: "`race`, or `threshold_workout` (tagged Training in Connect, or a step's workout name listed in `threshold_workout_names`)." }
        admitted_by: { type: array, nullable: true, items: { type: string, enum: [tag, name] }, description: "What admitted a workout, in this order: `tag` (tagged Training in Connect) and `name` (a step row's workout name is listed in `threshold_workout_names`); a tagged workout whose laps are unread reads `[\"tag\"]`, its name unseen. Null for a race." }
        workout_name: { type: string, nullable: true, description: "A workout's stored workout name as written on its first step row that has one; null when none has, and for a race." }
        reason:
          type: string
          enum: [outside_threshold_band, distance_regressed, smart_recording, gap_pace_unavailable, summary_unreadable, quality_flags_unreadable, features_unavailable, laps_not_read, lap_times_unreadable, no_workout_steps, no_sustained_work, active_time_below_minimum, laps_unreadable]
          description: >
            The first of the F024 reference section 2 rows a race fails, or of the F027 reference
            section 4 orders a workout fails (`laps_not_read`, `laps_unreadable`,
            `lap_times_unreadable`, `no_workout_steps`, `no_sustained_work`: no work rep of 290 s;
            the record reasons; the flags; `gap_pace_unavailable`: no sustained rep with a GAP pace;
            `active_time_below_minimum`: the counted reps sum to under 590 s); or, when a stored
            value it needs does not read, `summary_unreadable` (races only),
            `quality_flags_unreadable`, `features_unavailable` or `laps_unreadable` (workouts only).
    ThresholdPaceParameters:
      type: object
      description: "getState: the constants the threshold estimate was computed with (F024 reference section 1, F027 reference section 4), so it can be redone by hand."
      required: [typical_error, doubling_days, coverage, high_max_error, medium_max_error, short_race_s, workout_min_active_s, workout_min_rep_s, workout_rep_band]
      properties:
        typical_error: { type: number }
        doubling_days: { type: integer }
        coverage: { type: number }
        high_max_error: { type: number }
        medium_max_error: { type: number }
        short_race_s: { type: integer }
        workout_min_active_s: { type: integer, description: "A threshold workout's least counted time in seconds, summed over its counted work reps; no maximum." }
        workout_min_rep_s: { type: integer, description: "A work rep's least length in seconds to count as sustained work." }
        workout_rep_band: { type: number, description: "A sustained rep counts when its GAP pace is at most this times the workout's fastest sustained rep's." }
