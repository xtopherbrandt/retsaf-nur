openapi: 3.1.0

# =============================================================================
# Run Coaching System — UI <-> Engine API (TARGET CONTRACT)
# UI spec Section 4 artifact  ·  first cut 2026-09-06
#
# This is the TARGET contract, authored top-down from the engine spec
# (spec/01-09). It is reconciled against the backend's AS-BUILT contract,
# which FastAPI emits at /openapi.json. The diff between the two is the
# shared backlog. Neither the UI nor the backend owns this document — the
# engine spec owns the objects; this is their serialization.
#
# Conventions (custom extensions):
#   x-readiness:  implemented | stubbed | planned   (state in the backend today)
#   x-owner-spec: the engine section that OWNS the object (field-level truth)
#   x-story:      the UI user story/stories the operation serves
#
# Each operation's own `x-readiness` says whether retsaf-nur serves it; this
# header lists none, so it cannot fall behind them. An `implemented`
# operation matches what the backend's /openapi.json serves (path, method,
# success statuses, required request shape), which contracts/check_drift.py
# checks; a `planned` one is developed against a mock generated from this
# file until the backend catches up. A session's saved load
# (GET /sessions/{id}/load, F017) is the body its upload saved, or the one
# its last POST /sessions/{id}/load/recompute (F021) put in its place, and
# GET /metrics/load (F018) is computed on read from those saved loads.
# POST /sessions carries the F004 `resting_capture` flag and the F022
# `runs_and_captures_only` switch (a file its rule does not keep is a 200
# IngestSkipped); SessionDetail carries the resolved, nullable
# `resting_rmssd_ms` (see its schema + x-invariant).
#
#
# OPEN backend alignments this contract assumes (see ui-development-plan.md):
#   1. GET /sessions/{id} gets a typed SessionDetail response_model
#      (today it returns an untyped dict).
#   2. Auth + athlete scoping exist in the contract from day one
#      (backend is single-athlete/no-auth now; athlete_id is already modelled).
#   3. Uniform Error envelope + `?since=` cursor pagination.
#   4. Resource naming: `sessions` (raw uploads/activities, as-built) vs.
#      `workouts` (engine-planned sessions). This draft uses BOTH deliberately:
#      /sessions = ingested activity records; /workouts = planned prescriptions.
# =============================================================================

info:
  title: Run Coaching System — UI↔Engine API
  version: 0.6.0-draft
  description: >
    Target contract for the athlete-facing web + mobile UI. Read/write surface
    over the deterministic coaching engine. The engine is the single source of
    truth for every training decision; this API only exposes the engine's
    objects and accepts the structured inputs it already consumes. See UI spec
    `spec/ui-00-outline.md` §4 and the engine spec `spec/01`–`spec/09`.

servers:
  - url: http://127.0.0.1:8000
    description: Local backend (retsaf-nur runcoach-api default)
  - url: https://api.example.invalid
    description: Placeholder for a hosted deployment (TBD)

tags:
  - name: System
    description: "Liveness/version. x-readiness: implemented."
  - name: Auth & Athlete
    description: "Session, profile, onboarding. x-readiness: implemented for GET /me (the profile and HR anchors), PATCH /me (entries and settings) and the dated HR history (GET, POST /me/hr-history and DELETE /me/hr-history/{entry_id}); planned otherwise (backend is single-athlete/no-auth today); each operation's own x-readiness is authoritative. Owner: spec/01, spec/04 section 4.4."
  - name: Connections & Sync
    description: "Garmin OAuth + sync controls. x-readiness: planned. Owner: spec/02; Garmin API per research/07 §10. `runcoach sync` (F022) implements none of these operations: it is a CLI client of ingestSession."
  - name: Goal
    description: "Goal contract + pace target + system-proposed goal changes. x-readiness: implemented for GET /goal, PUT /goal and POST /goal/preview (the goal race, its stored goal time and the projected finish from the tagged races; F032); planned for the proposals; each operation's own x-readiness is authoritative. Owner: spec/01, spec/08 section 8.5.2."
  - name: Plan & Calendar
    description: "Planned+completed calendar, load series, constraint-driven modify. x-readiness: planned. Owner: spec/05, spec/06."
  - name: Sessions
    description: "Ingested activity records (raw canonical). x-readiness: implemented (ingest + list + detail + delete + features + load + load recompute + archive imports + race tags); each operation's own x-readiness is authoritative."
  - name: Workouts
    description: "Engine-planned/structured workouts + compliance. x-readiness: planned. Owner: spec/05."
  - name: Subjective
    description: "Session-RPE, wellness, pain reports. x-readiness: planned. Owner: research/03, routed per spec/08 §8.4."
  - name: State & Metrics
    description: "Physiological state model + derived metrics, with confidence. x-readiness: implemented for getState (GET /state, threshold pace and the endurance exponent b), getHrvTrend (GET /metrics/hrv) and getLoadChart (GET /metrics/load, the fitness, fatigue and form chart); planned otherwise. Owner: spec/03, spec/04."
  - name: Decisions & Changes
    description: "Decision log (explainability) + apply-and-notify change feed. x-readiness: planned. Owner: spec/09, spec/06 §6.8."
  - name: Coach
    description: "Conversational I/O layer (explain + translate). x-readiness: planned. Owner: spec/08."

security:
  - bearerAuth: []

paths:

  # ---------------------------------------------------------------- System
  /health:
    get:
      tags: [System]
      operationId: getHealth
      summary: Liveness and version
      security: []
      x-readiness: implemented
      x-owner-spec: "runcoach-api F001"
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthResponse" }

  # ------------------------------------------------------- Auth & Athlete
  /me:
    get:
      tags: [Auth & Athlete]
      operationId: getMe
      summary: The authenticated athlete's profile
      description: >
        F016. The athlete's settings (id, display_name, units, created_at), one
        entry per profile field (its effective value, its source, the session or
        entry time behind it, and the latest entry even when a FIT value shadows
        it) and the resting, max and threshold HR and sex anchors, each served
        with a version or unavailable as `missing` or `order_conflict`. Computed
        on read; nothing is stored. An empty store is a 200 with every field and
        anchor `missing`. In a store that has been through the API's startup, a
        store out of step (no settings row, or an anchor version log that does
        not hold a served value; only a write outside the API's write paths
        causes either) is a 500 whose detail names the cause and the repair:
        restart the API, whose startup repairs both. A store deleted or replaced
        while the API runs (as deleting runcoach.db to rebuild it does) fails as
        on every other route, with a bare 500 that names neither. Other as-built
        errors are FastAPI {detail}.
      x-readiness: implemented
      x-owner-spec: "spec/01 (athlete input); spec/04 §4.4 (starting state)"
      x-story: [authenticate, create-athlete]
      responses:
        "200":
          description: Athlete profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Athlete" }
    patch:
      tags: [Auth & Athlete]
      operationId: updateMe
      summary: Update mutable profile fields
      description: >
        F016. A partial object: any of the entered profile fields plus
        display_name and units. A field left out is unchanged. Each profile
        field present stores one entered value (null clears the entry, so the
        field falls to the stored FIT value or unavailable, never to an earlier
        entry); display_name (null clears it) and units (all three, not
        nullable) change the settings. An empty object is a 200 that changes
        nothing. The response is getMe's shape, read after the write. 422, with
        nothing written, for an unknown field (units' keys included); a units
        object missing a key, or null; a display_name holding a lone surrogate (a `\ud800` escape), which is not text; an HR
        value that is not a whole number above 0 (true, "188" and 188.5 are
        refused); a body value that is not a finite number above 0; a sex
        outside the enum; a birth_date that is not a YYYY-MM-DD date or lies
        after today in the athlete's timezone. Ordering across fields is not
        checked here: an entry that conflicts with another field's effective
        value is stored, and getMe serves the anchors as order_conflict.
        As-built errors are FastAPI {detail}.
      x-readiness: implemented
      x-owner-spec: "spec/01"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AthleteProfileUpdate" }
      responses:
        "200":
          description: Updated athlete
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Athlete" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /me/hr-history:
    post:
      tags: [Auth & Athlete]
      operationId: addHrHistoryEntry
      summary: Store a dated resting, max or threshold HR setting
      description: >
        F021. {field, value, effective_from}: one of resting_hr_bpm, max_hr_bpm
        and threshold_hr_bpm, a whole number of bpm above 0 (true, "188" and
        188.5 are refused, as on updateMe), and the YYYY-MM-DD date it took
        effect. 201 with the new entry; 200 when an entry for the same field
        and date existed, whose value is replaced and whose entry_id is kept,
        so the store never holds two entries for one field and date. 422, with
        nothing written, for an unknown field (sex and the body fields have no
        dated entries) or extra key, a value that is not a whole number above
        0, or an effective_from that is not a YYYY-MM-DD date or lies after
        today in the athlete's timezone. An entry changes neither getMe nor an
        anchor. As-built errors are FastAPI {detail}.
      x-readiness: implemented
      x-owner-spec: "runcoach-api F021"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HrHistoryEntryCreate" }
      responses:
        "201":
          description: Entry stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HrHistoryEntry" }
        "200":
          description: The entry for that field and date, replaced
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HrHistoryEntry" }
        "422": { $ref: "#/components/responses/ValidationError" }
    get:
      tags: [Auth & Athlete]
      operationId: listHrHistory
      summary: The dated HR settings
      description: >
        F021. Every dated HR entry, ordered by field, then effective_from; an
        empty array when there is none. Nothing is written.
      x-readiness: implemented
      x-owner-spec: "runcoach-api F021"
      responses:
        "200":
          description: Dated HR entries
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/HrHistoryEntry" }

  /me/hr-history/{entry_id}:
    delete:
      tags: [Auth & Athlete]
      operationId: deleteHrHistoryEntry
      summary: Remove one dated HR setting
      description: >
        F021. 204 with no body; 404 for an unknown entry_id; 422 for an
        entry_id that is not an integer. A saved load that cited the entry
        keeps the value it recorded. As-built errors are FastAPI {detail}.
      x-readiness: implemented
      x-owner-spec: "runcoach-api F021"
      parameters:
        - name: entry_id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /athletes:
    post:
      tags: [Auth & Athlete]
      operationId: createAthlete
      summary: Create an athlete via the onboarding questionnaire (feeds cold-start)
      description: >
        Account creation fused with the onboarding questionnaire. The payload is
        the data front-end for the cold-start estimator; it must collect exactly
        the fields spec/04 §4.4 consumes, plus consent to import historical Garmin
        data for the initial fit.
      security: []
      x-readiness: planned
      x-owner-spec: "spec/04 §4.4 (cold-start fields); spec/01"
      x-story: [create-athlete, onboarding-starting-state]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OnboardingInput" }
      responses:
        "201":
          description: Athlete created; cold-start estimate initiated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Athlete" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }

  # --------------------------------------------------- Connections & Sync
  /connections/garmin:
    get:
      tags: [Connections & Sync]
      operationId: getGarminConnection
      summary: Garmin connection status
      x-readiness: planned
      x-note: "Not implemented by `runcoach sync`, a CLI client of ingestSession."
      x-owner-spec: "spec/02; research/07 §4.3"
      x-story: [connect-garmin]
      responses:
        "200":
          description: Connection state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GarminConnection" }
    post:
      tags: [Connections & Sync]
      operationId: initiateGarminConnect
      summary: Begin the Garmin OAuth authorization handoff
      description: Returns the provider authorize URL the client redirects to. Token exchange is server-side.
      x-readiness: planned
      x-note: "Not implemented by `runcoach sync`, a CLI client of ingestSession."
      x-owner-spec: "research/07 §4.3, §10 (Garmin Connect Developer OAuth)"
      x-story: [connect-garmin]
      responses:
        "200":
          description: Authorize URL to redirect the athlete to
          content:
            application/json:
              schema:
                type: object
                required: [authorize_url]
                properties:
                  authorize_url: { type: string, format: uri }
    delete:
      tags: [Connections & Sync]
      operationId: disconnectGarmin
      summary: Revoke the Garmin connection
      x-readiness: planned
      x-note: "Not implemented by `runcoach sync`, a CLI client of ingestSession."
      x-story: [connect-garmin]
      responses:
        "204": { description: Disconnected }

  /sync/status:
    get:
      tags: [Connections & Sync]
      operationId: getSyncStatus
      summary: Last-synced (completed data) and last-pushed (plan) state
      x-readiness: planned
      x-note: "Not implemented by `runcoach sync`, a CLI client of ingestSession."
      x-owner-spec: "spec/02; research/07 §4.7, §4.8"
      x-story: [sync-completed-from-garmin, sync-plan-to-garmin]
      responses:
        "200":
          description: Sync status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SyncStatus" }

  /sync/completed:
    post:
      tags: [Connections & Sync]
      operationId: forceSyncCompleted
      summary: Force a reconcile of completed-activity data from Garmin
      description: >
        The engine receives Garmin completed data via push callbacks
        (research/07 §10), so this reconciles against already-pushed data and
        surfaces gaps; the manual-upload fallback is POST /sessions.
      x-readiness: planned
      x-note: "Not implemented by `runcoach sync`, a CLI client of ingestSession."
      x-owner-spec: "spec/02; research/07 §4.7, §10"
      x-story: [sync-completed-from-garmin]
      responses:
        "202":
          description: Reconcile accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SyncStatus" }

  /sync/plan:
    post:
      tags: [Connections & Sync]
      operationId: pushPlanToDevice
      summary: Push the current plan's upcoming workouts to the Garmin device
      description: >
        Uses the Garmin Training API workout create/schedule capability
        (research/07 §10). Normally automatic on plan change (apply-and-notify);
        this is the manual "push now" control.
      x-readiness: planned
      x-note: "Not implemented by `runcoach sync`, a CLI client of ingestSession."
      x-owner-spec: "research/07 §4.8, §10"
      x-story: [sync-plan-to-garmin]
      responses:
        "202":
          description: Push accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SyncStatus" }

  # ------------------------------------------------------------------ Goal
  /goal:
    get:
      tags: [Goal]
      operationId: getGoal
      summary: The active goal with its projection
      description: >
        The stored goal race and goal time with the projection recomputed at the instant used
        (F032 reference sections 2 and 6). `as_of` moves the projection only: the active row is
        served whatever it is, and `status` is `completed` when the race date is before the local
        date of that instant in `athlete_timezone`, else `active`; a completed goal still serves its
        projection. Nothing is written.
      x-readiness: implemented
      x-owner-spec: "spec/01 (goal-race + pace target); runcoach-api F032 (2026-10-29)"
      x-story: [initialize-race-goal, view-state]
      parameters:
        - name: as_of
          in: query
          required: false
          description: >
            The instant to project at; default now. Parsed as getState's `as_of` is: an ISO 8601
            extended-form date-time with a zone, at or before now, or a `YYYY-MM-DD` date, meaning
            the last instant before the next local midnight in `athlete_timezone`, clamped to now;
            a future instant, a naive date-time and an unparseable value are 422, and so is an instant whose local date in `athlete_timezone` would fall before 0001-01-01; on a local date of 0001-01-01 `fitness_now` is null (the day before is outside the calendar).
          schema: { type: string }
      responses:
        "200":
          description: The active goal and its projection
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GoalContract" }
        "404":
          description: 'No active goal: `{"detail": "no_goal"}` (an API without the route answers `Not Found`, which a client tells apart by `detail`)'
          content:
            application/json:
              schema:
                type: object
                required: [detail]
                properties:
                  detail: { type: string, enum: [no_goal] }
        "422": { $ref: "#/components/responses/RequestValidationError" }
        "500":
          description: "The load chart could not be built (a session with no saved load row, or a naive or unparseable stored start time); the detail is the chart's message"
          content: { application/json: { schema: { type: object } } }
    put:
      tags: [Goal]
      operationId: setGoal
      summary: Set the goal race (an exception to autonomy, not a gate)
      description: >
        The goal contract is one of the two athlete-owned exceptions to the system's
        autonomy, not a gate (research/00 AUT-02, AUT-03, GOAL-02). Setting it stores the race
        (date, distance, name) and the optional goal time as the active goal, superseding the one
        before it, and serves it with its projection as of now (F032 reference sections 2 and 6):
        the projected finish over the goal distance from the tagged races, the goal time's gap to
        it and the label. No plan is built from it. The race date is judged against the athlete's
        local today (a date before it is a 422 on `race.date` and nothing is stored); the
        projection is computed before the row is written, so a projection that fails stores
        nothing. Takes no `as_of`. A course profile or conditions are refused (422), not modelled.
      x-readiness: implemented
      x-owner-spec: "spec/01; spec/08 §8.5.2; research/00 GOAL-02"
      x-story: [initialize-race-goal, discuss-race-goal]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GoalContractInput" }
      responses:
        "200":
          description: Goal stored; served with its projection as of now
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GoalContract" }
        "422": { $ref: "#/components/responses/RequestValidationError" }
        "500":
          description: "The load chart could not be built (a session with no saved load row, or a naive or unparseable stored start time); the detail is the chart's message, and nothing is stored"
          content: { application/json: { schema: { type: object } } }

  /goal/preview:
    post:
      tags: [Goal]
      operationId: previewGoal
      summary: Compute the pace target for a proposed goal, without storing it
      description: >
        The projection a proposed race would get, nothing stored (F032 reference sections 2, 5 and
        6). The body is `setGoal`'s with the race's `date` optional: absent, the race is dated on
        the local date of the instant used (`as_of`, else now), and a date before that is a 422 on
        `race.date`, so a past race can be backtested through `as_of`. Nothing is written.
      x-readiness: implemented
      x-owner-spec: "spec/01 (race→pace/effort target); runcoach-api F032 (2026-10-29)"
      x-story: [initialize-race-goal]
      parameters:
        - name: as_of
          in: query
          required: false
          description: The instant to project at; default now. Parsed as getGoal's `as_of` is.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GoalPreviewInput" }
      responses:
        "200":
          description: The projection for the proposed goal
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaceTarget" }
        "422": { $ref: "#/components/responses/RequestValidationError" }
        "500":
          description: "The load chart could not be built (a session with no saved load row, or a naive or unparseable stored start time); the detail is the chart's message"
          content: { application/json: { schema: { type: object } } }

  /goal/proposals:
    get:
      tags: [Goal]
      operationId: listGoalProposals
      summary: System-proposed goal changes awaiting the athlete's decision
      description: >
        The engine may propose a revised goal when the projection drifts or an
        injury makes the goal infeasible, in the fixed order revised-pace →
        later-date (never a distance change). Presented for the athlete to decide.
      x-readiness: planned
      x-owner-spec: "spec/08 §8.5.2; research/00 GOAL-03, GOAL-04"
      x-story: [respond-to-goal-change-proposal]
      responses:
        "200":
          description: Open proposals
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/GoalProposal" }

  /goal/proposals/{proposal_id}:accept:
    post:
      tags: [Goal]
      operationId: acceptGoalProposal
      summary: Accept a system-proposed goal change
      x-readiness: planned
      x-owner-spec: "spec/08 §8.5.2"
      x-story: [respond-to-goal-change-proposal]
      parameters:
        - $ref: "#/components/parameters/ProposalId"
      responses:
        "200":
          description: Proposal accepted; new goal contract in force
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GoalContract" }
        "404": { $ref: "#/components/responses/NotFound" }

  # -------------------------------------------------------- Plan & Calendar
  /calendar:
    get:
      tags: [Plan & Calendar]
      operationId: getCalendar
      summary: Planned + completed days over a range, with compliance
      description: The single planned+completed calendar (Garmin-overlay + TrainingPeaks-compliance pattern). Changed days carry a decision reference for the "why" affordance.
      x-readiness: planned
      x-owner-spec: "spec/05 (plan), spec/06 (adaptation), spec/09 (why)"
      x-story: [view-calendar]
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
      responses:
        "200":
          description: Calendar days
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CalendarDay" }

  /plan/load:
    get:
      tags: [Plan & Calendar]
      operationId: getLoadSeries
      summary: Owned load/fitness-fatigue-form series (load-at-a-glance)
      x-readiness: planned
      x-owner-spec: "spec/03 §3.5 (CTL/ATL/TSB, multi-channel load)"
      x-story: [view-calendar, view-state]
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
      responses:
        "200":
          description: Load series
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoadSeries" }

  /constraints:
    post:
      tags: [Plan & Calendar]
      operationId: submitConstraint
      summary: Submit an availability/scheduling constraint (the modify interaction)
      description: >
        The athlete cannot edit the plan directly. A modify request is a
        constraint the weekly loop re-solves within its guardrails; the response
        reports what moved and why (apply-and-notify). This is the write behind
        the re-semanticized drag/travel/add-race affordances (§8).
      x-readiness: planned
      x-owner-spec: "spec/08 §8.4.2 (constraints model); spec/06 §6.2.2, §6.5, §6.8"
      x-story: [modify-upcoming-workouts]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Constraint" }
      responses:
        "200":
          description: Re-solved; what changed and why
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChangeSet" }
        "422": { $ref: "#/components/responses/ValidationError" }

  # --------------------------------------------------------------- Sessions
  /sessions:
    post:
      tags: [Sessions]
      operationId: ingestSession
      summary: Ingest a Garmin FIT file into the canonical record (manual-upload path)
      x-readiness: implemented
      x-owner-spec: "spec/02; runcoach-api F003"
      x-story: [sync-completed-from-garmin]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary, description: "A .fit file, ≤ 50 MB." }
                resting_capture:
                  type: boolean
                  default: false
                  description: >
                    F004 upload-time Tier-1 declaration — the athlete asserting this
                    file was a resting-HRV capture (config-based profile names cannot
                    reclassify an already-recorded file). Optional; a real bool
                    (true/1/on/yes and negatives coerced), anything else → 422.
                runs_and_captures_only:
                  type: boolean
                  default: false
                  description: >
                    F022: apply the archive import's keep rule to this one file
                    (runs and resting-HRV captures only). A file the rule does not
                    keep is a 200 IngestSkipped and nothing is stored; a kept file's
                    201 carries `filter_applied: true`. Sent with `resting_capture`
                    true → 422 (the declaration bypasses the rule). Optional; without
                    it every activity's reply is as before the field existed.
                    An HRV_STATUS file (file_id type 68) is an overnight night with or
                    without it; with `resting_capture` true it is a 422.
      responses:
        "201":
          description: >
            Ingested (or re-derived deterministically). An HRV_STATUS file is stored as
            one overnight night; `replaced_session_id` names a stored re-summary of the
            same night it replaced.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IngestResponse" }
        "200":
          description: >
            Skipped, nothing stored: with `runs_and_captures_only`, the file is not
            an activity, or it is neither a run nor a recognised resting capture;
            with or without it, an HRV_STATUS file that holds no night (`no_night`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IngestSkipped" }
        "400":
          description: Not a FIT file / parse failure / a required canonical field could not be determined / an overnight HRV series refused (two values at one timestamp, two summaries) / (with `runs_and_captures_only`) a file_id the screen fails
          content: { text/plain: { schema: { type: string } } }
        "409":
          description: Duplicate — already ingested, or an HRV_STATUS night whose later re-summary is stored (body names the existing session id)
          content: { text/plain: { schema: { type: string } } }
        "413":
          description: Upload exceeds the size/record/beat limit
          content: { text/plain: { schema: { type: string } } }
        "422": { $ref: "#/components/responses/ValidationError" }
      # NOTE (as-built): errors are FastAPI-default {detail: "..."} / plain text,
      # not the Error envelope below. Alignment #3 migrates these to Error.

    get:
      tags: [Sessions]
      operationId: listSessions
      summary: List ingested sessions (summaries), newest first
      x-readiness: implemented
      x-owner-spec: "spec/02"
      x-story: [view-calendar, view-workout]
      parameters:
        - $ref: "#/components/parameters/Since"
        - $ref: "#/components/parameters/Limit"
        - name: include_nights
          in: query
          required: false
          schema: { type: boolean, default: false }
          description: "When false (the default), rows with activity_tag overnight_hrv are left out and the pages are those of the store without them; when true they are listed among the others, newest first, named Overnight HRV. A cursor that names a night is served without the flag and skips that night."
      responses:
        "200":
          description: Page of session summaries
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/SessionSummary" }
        "422":
          description: "`limit` outside 1..200 or not an integer, or a `since` cursor that does not decode to an aware-UTC start_time and a session_id (a well-formed cursor naming no stored row is served) (FastAPI-default {detail})"
          content: { application/json: { schema: { type: object } } }

  /sessions/{session_id}:
    get:
      tags: [Sessions]
      operationId: getSession
      summary: Full canonical session (header + records + rr_intervals + context)
      description: >
        Raw-over-derived: returns the vendor-neutral canonical streams. The
        quarantined vendor sidecar (VO2max, Training Status, …) is deliberately
        excluded (spec/02 §2.3.6). As-built this returns an untyped dict;
        alignment #1 types it as SessionDetail (shape below is exact to the
        repo's models.py / db.py).
      x-readiness: implemented
      x-owner-spec: "spec/02 (canonical schema)"
      x-story: [view-workout]
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Canonical session detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionDetail" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Sessions]
      operationId: deleteSession
      summary: Delete a session and every row that hangs off it
      description: >
        The recovery path out of F004's upgrade window: a capture ingested before
        the athlete declared its profile carries no reading and a re-upload hits
        the UNIQUE (source_device, start_time) 409. Deleting frees the slot so
        "configure, delete, upload again" works. (A destructive control — the UI
        gates it behind explicit confirmation.)
      x-readiness: implemented
      x-owner-spec: "runcoach-api F004 (2026-09-06)"
      x-story: [sync-completed-from-garmin]
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/NotFound" }

  /sessions/{session_id}/features:
    get:
      tags: [Sessions]
      operationId: getSessionFeatures
      summary: Grade-adjusted pace, NGP and the session descriptors, computed on read
      description: >
        F013. The session's recorded-time duration and distance, average pace,
        grade-adjusted average pace (Minetti's cost of gradient over a +/-25 m
        window of reconstructed distance, clamped to +/-0.45 and flagged),
        normalized graded pace (NGP: device speed times g within contiguous
        blocks, 30 s windows) and the spec/03 section 3.2 descriptors, each a
        value or an unavailable reason, never imputed. Computed from the stored
        canonical records on every request; nothing is stored, so a deleted
        session has no features (404, the envelope of GET /sessions/{id}). A
        non-running session, or one with no records, is a 200 with every
        feature unavailable and the reason named: an all-unavailable session is
        an answer, not an error. The per-segment stream behind these figures is
        in-process only and not served.
      x-readiness: implemented
      x-owner-spec: "spec/03 section 3.2 and 3.3 (as amended by F013); runcoach-api F013"
      x-story: [view-workout]
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: The session's features, computed on read
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionFeatures" }
        "404": { $ref: "#/components/responses/NotFound" }

  /sessions/{session_id}/load:
    get:
      tags: [Sessions]
      operationId: getSessionLoad
      summary: The session's training load, HR-TRIMP first, as its upload or last recompute saved it
      description: >
        F017. One load number per session on the "threshold hour = 100" scale
        (spec/03 section 3.4): Banister's HR-TRIMP over running time with
        usable HR, scaled by the threshold-hour reference computed with the
        session's own sex coefficients. rTSS and sRPE-load report unavailable
        (no threshold pace, no RPE input) until their inputs exist. The body is
        computed inside the upload's own transaction, from the HR values the
        session's file carried (else the setting in effect on the run's date)
        and saved with every value used, its source and its anchor version;
        this route serves that saved body and reads no anchor, so a later
        profile change or dated entry moves nothing until recomputeSessionLoad
        replaces it. A refused session names the first gate it met (a closed
        enum) and still reports its inputs. A deleted session has no load (404,
        the envelope of GET /sessions/{id}).
      x-readiness: implemented
      x-owner-spec: "spec/03 section 3.4 (as amended by F017); runcoach-api F017"
      x-story: [view-workout]
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: The session's load body, as its upload or last recompute saved it
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionLoad" }
        "404": { $ref: "#/components/responses/NotFound" }

  /sessions/{session_id}/load/recompute:
    post:
      tags: [Sessions]
      operationId: recomputeSessionLoad
      summary: Recompute the session's saved load with the current HR files, dated entries and anchors
      description: >
        F021. Recomputes the session's load as an upload computes it, each HR
        value its file lacks taken as the setting in effect on the run's date,
        and replaces the saved body and its load_value in one transaction. 200
        in every case, a session with no saved load included (it gets one); a
        non-running session is recomputed as sport_not_running. The body is
        SessionLoad's fields at the top level plus changed. This is the only
        operation that replaces a saved load: a dated entry, a replaced or
        deleted entry and PATCH /me change none. An anchor version log out of
        step is a 500 naming the cause and the repair, writing nothing.
      x-readiness: implemented
      x-owner-spec: "spec/03 section 3.4 (as amended by F017 and F021); runcoach-api F021"
      x-story: [view-workout]
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: The recomputed body, as now saved, with changed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionLoadRecompute" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500":
          description: "The anchor version log is out of step; the detail names the cause and says to restart the API"
          content: { application/json: { schema: { type: object } } }

