openapi: 3.1.0

# =============================================================================
# Run Coaching System — UI <-> Engine API (TARGET CONTRACT)
# UI spec Section 4 artifact  ·  first cut 2026-09-06
#
# This is the TARGET contract, authored top-down from the engine spec
# (spec/01-09). It is reconciled against the backend's AS-BUILT contract,
# which FastAPI emits at /openapi.json. The diff between the two is the
# shared backlog. Neither the UI nor the backend owns this document — the
# engine spec owns the objects; this is their serialization.
#
# Conventions (custom extensions):
#   x-readiness:  implemented | stubbed | planned   (state in the backend today)
#   x-owner-spec: the engine section that OWNS the object (field-level truth)
#   x-story:      the UI user story/stories the operation serves
#
# As of 2026-09-09 the implemented endpoints in retsaf-nur are GET /health,
# /sessions (POST ingest, GET detail, DELETE) and GET /metrics/hrv (F005: the
# per-day series plus the verdict blocks, `from`/`to` optional); everything else
# is `planned` and is developed against a mock generated from this file until
# the backend catches up. POST /sessions carries the F004 `resting_capture`
# flag; SessionDetail carries the resolved, nullable `resting_rmssd_ms` (see its
# schema + x-invariant).
#
# OPEN backend alignments this contract assumes (see ui-development-plan.md):
#   1. GET /sessions/{id} gets a typed SessionDetail response_model
#      (today it returns an untyped dict).
#   2. Auth + athlete scoping exist in the contract from day one
#      (backend is single-athlete/no-auth now; athlete_id is already modelled).
#   3. Uniform Error envelope + `?since=` cursor pagination.
#   4. Resource naming: `sessions` (raw uploads/activities, as-built) vs.
#      `workouts` (engine-planned sessions). This draft uses BOTH deliberately:
#      /sessions = ingested activity records; /workouts = planned prescriptions.
# =============================================================================

info:
  title: Run Coaching System — UI↔Engine API
  version: 0.2.0-draft
  description: >
    Target contract for the athlete-facing web + mobile UI. Read/write surface
    over the deterministic coaching engine. The engine is the single source of
    truth for every training decision; this API only exposes the engine's
    objects and accepts the structured inputs it already consumes. See UI spec
    `spec/ui-00-outline.md` §4 and the engine spec `spec/01`–`spec/09`.

servers:
  - url: http://127.0.0.1:8000
    description: Local backend (retsaf-nur runcoach-api default)
  - url: https://api.example.invalid
    description: Placeholder for a hosted deployment (TBD)

tags:
  - name: System
    description: "Liveness/version. x-readiness: implemented."
  - name: Auth & Athlete
    description: "Session, profile, onboarding. x-readiness: planned (backend is single-athlete/no-auth today). Owner: spec/01, spec/04 §4.4."
  - name: Connections & Sync
    description: "Garmin OAuth + sync controls. x-readiness: planned. Owner: spec/02; Garmin API per research/07 §10."
  - name: Goal
    description: "Goal contract + pace target + system-proposed goal changes. x-readiness: planned. Owner: spec/01, spec/08 §8.5.2."
  - name: Plan & Calendar
    description: "Planned+completed calendar, load series, constraint-driven modify. x-readiness: planned. Owner: spec/05, spec/06."
  - name: Sessions
    description: "Ingested activity records (raw canonical). x-readiness: implemented (ingest + detail)."
  - name: Workouts
    description: "Engine-planned/structured workouts + compliance. x-readiness: planned. Owner: spec/05."
  - name: Subjective
    description: "Session-RPE, wellness, pain reports. x-readiness: planned. Owner: research/03, routed per spec/08 §8.4."
  - name: State & Metrics
    description: "Physiological state model + derived metrics, with confidence. x-readiness: planned. Owner: spec/03, spec/04."
  - name: Decisions & Changes
    description: "Decision log (explainability) + apply-and-notify change feed. x-readiness: planned. Owner: spec/09, spec/06 §6.8."
  - name: Coach
    description: "Conversational I/O layer (explain + translate). x-readiness: planned. Owner: spec/08."

security:
  - bearerAuth: []

paths:

  # ---------------------------------------------------------------- System
  /health:
    get:
      tags: [System]
      operationId: getHealth
      summary: Liveness and version
      security: []
      x-readiness: implemented
      x-owner-spec: "runcoach-api F001"
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthResponse" }

  # ------------------------------------------------------- Auth & Athlete
  /me:
    get:
      tags: [Auth & Athlete]
      operationId: getMe
      summary: The authenticated athlete's profile
      x-readiness: planned
      x-owner-spec: "spec/01 (athlete input); spec/04 §4.4 (starting state)"
      x-story: [authenticate, create-athlete]
      responses:
        "200":
          description: Athlete profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Athlete" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    patch:
      tags: [Auth & Athlete]
      operationId: updateMe
      summary: Update mutable profile fields
      x-readiness: planned
      x-owner-spec: "spec/01"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AthleteProfileUpdate" }
      responses:
        "200":
          description: Updated athlete
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Athlete" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /athletes:
    post:
      tags: [Auth & Athlete]
      operationId: createAthlete
      summary: Create an athlete via the onboarding questionnaire (feeds cold-start)
      description: >
        Account creation fused with the onboarding questionnaire. The payload is
        the data front-end for the cold-start estimator; it must collect exactly
        the fields spec/04 §4.4 consumes, plus consent to import historical Garmin
        data for the initial fit.
      security: []
      x-readiness: planned
      x-owner-spec: "spec/04 §4.4 (cold-start fields); spec/01"
      x-story: [create-athlete, onboarding-starting-state]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OnboardingInput" }
      responses:
        "201":
          description: Athlete created; cold-start estimate initiated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Athlete" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }

  # --------------------------------------------------- Connections & Sync
  /connections/garmin:
    get:
      tags: [Connections & Sync]
      operationId: getGarminConnection
      summary: Garmin connection status
      x-readiness: planned
      x-owner-spec: "spec/02; research/07 §4.3"
      x-story: [connect-garmin]
      responses:
        "200":
          description: Connection state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GarminConnection" }
    post:
      tags: [Connections & Sync]
      operationId: initiateGarminConnect
      summary: Begin the Garmin OAuth authorization handoff
      description: Returns the provider authorize URL the client redirects to. Token exchange is server-side.
      x-readiness: planned
      x-owner-spec: "research/07 §4.3, §10 (Garmin Connect Developer OAuth)"
      x-story: [connect-garmin]
      responses:
        "200":
          description: Authorize URL to redirect the athlete to
          content:
            application/json:
              schema:
                type: object
                required: [authorize_url]
                properties:
                  authorize_url: { type: string, format: uri }
    delete:
      tags: [Connections & Sync]
      operationId: disconnectGarmin
      summary: Revoke the Garmin connection
      x-readiness: planned
      x-story: [connect-garmin]
      responses:
        "204": { description: Disconnected }

  /sync/status:
    get:
      tags: [Connections & Sync]
      operationId: getSyncStatus
      summary: Last-synced (completed data) and last-pushed (plan) state
      x-readiness: planned
      x-owner-spec: "spec/02; research/07 §4.7, §4.8"
      x-story: [sync-completed-from-garmin, sync-plan-to-garmin]
      responses:
        "200":
          description: Sync status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SyncStatus" }

  /sync/completed:
    post:
      tags: [Connections & Sync]
      operationId: forceSyncCompleted
      summary: Force a reconcile of completed-activity data from Garmin
      description: >
        The engine receives Garmin completed data via push callbacks
        (research/07 §10), so this reconciles against already-pushed data and
        surfaces gaps; the manual-upload fallback is POST /sessions.
      x-readiness: planned
      x-owner-spec: "spec/02; research/07 §4.7, §10"
      x-story: [sync-completed-from-garmin]
      responses:
        "202":
          description: Reconcile accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SyncStatus" }

  /sync/plan:
    post:
      tags: [Connections & Sync]
      operationId: pushPlanToDevice
      summary: Push the current plan's upcoming workouts to the Garmin device
      description: >
        Uses the Garmin Training API workout create/schedule capability
        (research/07 §10). Normally automatic on plan change (apply-and-notify);
        this is the manual "push now" control.
      x-readiness: planned
      x-owner-spec: "research/07 §4.8, §10"
      x-story: [sync-plan-to-garmin]
      responses:
        "202":
          description: Push accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SyncStatus" }

  # ------------------------------------------------------------------ Goal
  /goal:
    get:
      tags: [Goal]
      operationId: getGoal
      summary: The current goal contract
      x-readiness: planned
      x-owner-spec: "spec/01 (goal-race + pace target)"
      x-story: [initialize-race-goal, view-state]
      responses:
        "200":
          description: Goal contract
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GoalContract" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Goal]
      operationId: setGoal
      summary: Set or confirm the goal contract (an athlete-owned gate)
      description: >
        The goal is one of the two athlete-owned gates (research/00 §1.9). Setting
        it is an explicit athlete confirmation and triggers (re-)periodization;
        the plan itself is then applied without any further gate.
      x-readiness: planned
      x-owner-spec: "spec/01; spec/08 §8.5.2; research/00 §1.9"
      x-story: [initialize-race-goal, discuss-race-goal]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GoalContractInput" }
      responses:
        "200":
          description: Goal set; re-periodization triggered
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GoalContract" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /goal/preview:
    post:
      tags: [Goal]
      operationId: previewGoal
      summary: Compute the pace/effort target for a proposed goal, without committing
      description: The wizard's preview step — the engine's translation of a proposed race into a pace/effort target, with confidence.
      x-readiness: planned
      x-owner-spec: "spec/01 (race→pace/effort target)"
      x-story: [initialize-race-goal]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GoalContractInput" }
      responses:
        "200":
          description: Pace/effort target preview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaceTarget" }

  /goal/proposals:
    get:
      tags: [Goal]
      operationId: listGoalProposals
      summary: System-proposed goal changes awaiting the athlete's decision
      description: >
        The engine may propose a revised goal when the projection drifts or an
        injury makes the goal infeasible, in the fixed order revised-pace →
        later-date (never a distance change). Presented for the athlete to decide.
      x-readiness: planned
      x-owner-spec: "spec/08 §8.5.2; research/00 §1.9"
      x-story: [respond-to-goal-change-proposal]
      responses:
        "200":
          description: Open proposals
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/GoalProposal" }

  /goal/proposals/{proposal_id}:accept:
    post:
      tags: [Goal]
      operationId: acceptGoalProposal
      summary: Accept a system-proposed goal change
      x-readiness: planned
      x-owner-spec: "spec/08 §8.5.2"
      x-story: [respond-to-goal-change-proposal]
      parameters:
        - $ref: "#/components/parameters/ProposalId"
      responses:
        "200":
          description: Proposal accepted; new goal contract in force
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GoalContract" }
        "404": { $ref: "#/components/responses/NotFound" }

  # -------------------------------------------------------- Plan & Calendar
  /calendar:
    get:
      tags: [Plan & Calendar]
      operationId: getCalendar
      summary: Planned + completed days over a range, with compliance
      description: The single planned+completed calendar (Garmin-overlay + TrainingPeaks-compliance pattern). Changed days carry a decision reference for the "why" affordance.
      x-readiness: planned
      x-owner-spec: "spec/05 (plan), spec/06 (adaptation), spec/09 (why)"
      x-story: [view-calendar]
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
      responses:
        "200":
          description: Calendar days
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CalendarDay" }

  /plan/load:
    get:
      tags: [Plan & Calendar]
      operationId: getLoadSeries
      summary: Owned load/fitness-fatigue-form series (load-at-a-glance)
      x-readiness: planned
      x-owner-spec: "spec/03 §3.5 (CTL/ATL/TSB, multi-channel load)"
      x-story: [view-calendar, view-state]
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
      responses:
        "200":
          description: Load series
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoadSeries" }

  /constraints:
    post:
      tags: [Plan & Calendar]
      operationId: submitConstraint
      summary: Submit an availability/scheduling constraint (the modify interaction)
      description: >
        The athlete cannot edit the plan directly. A modify request is a
        constraint the weekly loop re-solves within its guardrails; the response
        reports what moved and why (apply-and-notify). This is the write behind
        the re-semanticized drag/travel/add-race affordances (§8).
      x-readiness: planned
      x-owner-spec: "spec/08 §8.4.2 (constraints model); spec/06 §6.2.2, §6.5, §6.8"
      x-story: [modify-upcoming-workouts]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Constraint" }
      responses:
        "200":
          description: Re-solved; what changed and why
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChangeSet" }
        "422": { $ref: "#/components/responses/ValidationError" }

  # --------------------------------------------------------------- Sessions
  /sessions:
    post:
      tags: [Sessions]
      operationId: ingestSession
      summary: Ingest a Garmin FIT file into the canonical record (manual-upload path)
      x-readiness: implemented
      x-owner-spec: "spec/02; runcoach-api F003"
      x-story: [sync-completed-from-garmin]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary, description: "A .fit file, ≤ 50 MB." }
                resting_capture:
                  type: boolean
                  default: false
                  description: >
                    F004 upload-time Tier-1 declaration — the athlete asserting this
                    file was a resting-HRV capture (config-based profile names cannot
                    reclassify an already-recorded file). Optional; a real bool
                    (true/1/on/yes and negatives coerced), anything else → 422.
      responses:
        "201":
          description: Ingested (or re-derived deterministically)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IngestResponse" }
        "400":
          description: Not a FIT file / parse failure / a required canonical field could not be determined
          content: { text/plain: { schema: { type: string } } }
        "409":
          description: Duplicate — already ingested (body names the existing session id)
          content: { text/plain: { schema: { type: string } } }
        "413":
          description: Upload exceeds the size/record/beat limit
          content: { text/plain: { schema: { type: string } } }
      # NOTE (as-built): errors are FastAPI-default {detail: "..."} / plain text,
      # not the Error envelope below. Alignment #3 migrates these to Error.

    get:
      tags: [Sessions]
      operationId: listSessions
      summary: List ingested sessions (summaries), newest first
      x-readiness: planned
      x-owner-spec: "spec/02"
      x-story: [view-calendar, view-workout]
      parameters:
        - $ref: "#/components/parameters/Since"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Page of session summaries
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/SessionSummary" }

  /sessions/{session_id}:
    get:
      tags: [Sessions]
      operationId: getSession
      summary: Full canonical session (header + records + rr_intervals + context)
      description: >
        Raw-over-derived: returns the vendor-neutral canonical streams. The
        quarantined vendor sidecar (VO2max, Training Status, …) is deliberately
        excluded (spec/02 §2.3.6). As-built this returns an untyped dict;
        alignment #1 types it as SessionDetail (shape below is exact to the
        repo's models.py / db.py).
      x-readiness: implemented
      x-owner-spec: "spec/02 (canonical schema)"
      x-story: [view-workout]
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Canonical session detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionDetail" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Sessions]
      operationId: deleteSession
      summary: Delete a session and every row that hangs off it
      description: >
        The recovery path out of F004's upgrade window: a capture ingested before
        the athlete declared its profile carries no reading and a re-upload hits
        the UNIQUE (source_device, start_time) 409. Deleting frees the slot so
        "configure, delete, upload again" works. (A destructive control — the UI
        gates it behind explicit confirmation.)
      x-readiness: implemented
      x-owner-spec: "runcoach-api F004 (2026-09-06)"
      x-story: [sync-completed-from-garmin]
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/NotFound" }

  # --------------------------------------------------------------- Workouts
  /workouts/{workout_id}:
    get:
      tags: [Workouts]
      operationId: getWorkout
      summary: A planned/structured workout (prescription) and its completion, if any
      description: >
        The planned workout: structured steps, relative-anchored targets, the
        determinant(s) it targets, and the "why this session" rationale. When a
        completed activity is linked, the compliance/execution overlay is included.
      x-readiness: planned
      x-owner-spec: "spec/05 (workout representation, relative-anchored paces, determinant targeting)"
      x-story: [view-workout]
      parameters:
        - $ref: "#/components/parameters/WorkoutId"
      responses:
        "200":
          description: Planned workout (+ optional completion)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlannedWorkout" }
        "404": { $ref: "#/components/responses/NotFound" }

  # -------------------------------------------------------------- Subjective
  /workouts/{workout_id}/feedback:
    post:
      tags: [Subjective]
      operationId: postSessionFeedback
      summary: Post-session subjective feedback (session-RPE + comment)
      x-readiness: planned
      x-owner-spec: "research/03 (session-RPE); routed per spec/08 §8.4"
      x-story: [subjective-feedback]
      parameters:
        - $ref: "#/components/parameters/WorkoutId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SessionFeedback" }
      responses:
        "200":
          description: Captured; loop-closure summary of any resulting plan change
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChangeSet" }

  /wellness:
    post:
      tags: [Subjective]
      operationId: postWellness
      summary: Five-item wellness check-in
      x-readiness: planned
      x-owner-spec: "research/03 §3.3 (five-item wellness); spec/06 §6.2.4 (readiness fusion)"
      x-story: [subjective-feedback]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WellnessReport" }
      responses:
        "200":
          description: Captured; loop-closure summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChangeSet" }

  /pain:
    post:
      tags: [Subjective]
      operationId: postPain
      summary: Pain traffic-light report
      x-readiness: planned
      x-owner-spec: "research/03 §3.5 (pain traffic-light); spec/06 §6.4 (injury-risk verdict)"
      x-story: [subjective-feedback]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PainReport" }
      responses:
        "200":
          description: Captured; may return a safety/escalation instruction
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChangeSet" }

  # ---------------------------------------------------------- State & Metrics
  /state:
    get:
      tags: [State & Metrics]
      operationId: getState
      summary: Physiological state model + gap-to-goal, each with confidence
      x-readiness: planned
      x-owner-spec: "spec/04 (determinant profile, confidence); spec/04 §4.7 / spec/01 §1.4 (gap-to-goal)"
      x-story: [view-state]
      responses:
        "200":
          description: Current state estimate
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StateModel" }

  /metrics/hrv:
    get:
      tags: [State & Metrics]
      operationId: getHrvTrend
      summary: HRV trend (ln rMSSD vs SWC band)
      x-readiness: implemented
      x-owner-spec: "spec/03 §3.7; runcoach-api F005 (2026-09-09)"
      x-story: [view-state]
      description: >
        One point per athlete-local day in [from, to], each judged against its
        own 60-day baseline [d-66, d-7], plus the verdict blocks for `to` — the
        mean, the band, the baseline, every reading that fed the mean and every
        stored row that fed nothing, with its reason — so the verdict can be
        recomputed by hand (research/00 §1.6). Both parameters are optional as
        built (F005/T091, 2026-09-09): `to` defaults to the athlete's local
        today in the configured zone and `from` to `to`, so a bare call yields
        one point. Unauthenticated today like every as-built route.
      parameters:
        - name: from
          in: query
          required: false
          description: "Athlete-local date (YYYY-MM-DD). Defaults to `to`. After `to` → 422."
          schema: { type: string, format: date }
        - name: to
          in: query
          required: false
          description: >
            Athlete-local date (YYYY-MM-DD). Defaults to the athlete's local
            today. `to − from` greater than 366 days → 422.
          schema: { type: string, format: date }
      responses:
        "200":
          description: HRV trend series and the verdict for `to`
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HrvTrend" }
        "422":
          description: "`from` after `to`, a range longer than 366 days, or a malformed date (FastAPI-default {detail})"
          content: { application/json: { schema: { type: object } } }

  # -------------------------------------------------------- Decisions & Changes
  /changes:
    get:
      tags: [Decisions & Changes]
      operationId: getChanges
      summary: Apply-and-notify change feed (poll-first; upgradeable to SSE later)
      description: The "what changed since you last looked" feed. Poll with the cursor; the client model is written so a later SSE/WebSocket transport needs no schema change.
      x-readiness: planned
      x-owner-spec: "spec/06 §6.8 (apply-and-notify); spec/09"
      x-story: [review-changes]
      parameters:
        - $ref: "#/components/parameters/Since"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Page of change-feed items
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/ChangeFeedItem" }

  /decisions/{decision_id}:
    get:
      tags: [Decisions & Changes]
      operationId: getDecision
      summary: A single decision-log record (the "why" behind a change)
      description: Every applied adaptation logged with its inputs and the rule that fired; the explanation surface reads this. Presents numbers the engine already computed — never new ones.
      x-readiness: planned
      x-owner-spec: "spec/09 (decision-log schema)"
      x-story: [explain-any-change]
      parameters:
        - $ref: "#/components/parameters/DecisionId"
      responses:
        "200":
          description: Decision record
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DecisionRecord" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ------------------------------------------------------------------- Coach
  /coach/messages:
    get:
      tags: [Coach]
      operationId: getCoachMessages
      summary: Conversation history
      x-readiness: planned
      x-owner-spec: "spec/08"
      x-story: [discuss-race-goal, explain-any-change]
      parameters:
        - $ref: "#/components/parameters/Since"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Page of messages
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/CoachMessage" }
    post:
      tags: [Coach]
      operationId: sendCoachMessage
      summary: Send free-text to the coach (explain + translate I/O layer)
      description: >
        The LLM explains applied decisions (reading the decision log/state) and
        translates free-text into the engine's structured inputs (constraint,
        injury/soreness, subjective, plan-change request). It never generates,
        personalizes, or decides the plan (FTO — research/06 §11). A goal-change
        request routes to the goal-contract hand-off (the one gate). Streamed.
      x-readiness: planned
      x-owner-spec: "spec/08 §8.4 (structured-input contract); spec/09 (records read)"
      x-story: [discuss-race-goal, modify-upcoming-workouts, subjective-feedback, explain-any-change]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, maxLength: 8000 }
      responses:
        "200":
          description: Assistant reply (may reference decisions and/or a resulting ChangeSet)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CoachMessage" }
            text/event-stream:
              schema: { type: string, description: "Server-sent chunks of the reply." }

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Planned. Backend is single-athlete/no-auth today; alignment #2 adds this."

  parameters:
    SessionId:
      name: session_id
      in: path
      required: true
      schema: { type: string }
      description: Deterministic id = truncated SHA-256 over (source_device, start_time).
    WorkoutId:
      name: workout_id
      in: path
      required: true
      schema: { type: string }
    DecisionId:
      name: decision_id
      in: path
      required: true
      schema: { type: string }
    ProposalId:
      name: proposal_id
      in: path
      required: true
      schema: { type: string }
    Since:
      name: since
      in: query
      required: false
      schema: { type: string }
      description: Opaque cursor from a prior page's next_cursor.
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }

  responses:
    Unauthorized:
      description: Missing/invalid credentials
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    NotFound:
      description: Resource not found
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Conflict:
      description: Conflict (e.g. duplicate)
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    ValidationError:
      description: Request failed validation
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  schemas:

    # ---- Common ---------------------------------------------------------
    Error:
      type: object
      description: Uniform error envelope (alignment #3). As-built endpoints currently return FastAPI {detail}.
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, example: not_found }
            message: { type: string }
            details: { type: object, additionalProperties: true }

    Page:
      type: object
      description: Cursor pagination envelope.
      required: [items]
      properties:
        items: { type: array, items: {} }
        next_cursor:
          type: string
          nullable: true
          description: Pass as `since` to fetch the next page; null when exhausted.

    ConfidenceValue:
      type: object
      description: >
        The anti-false-precision primitive. A point estimate with an optional
        interval and a confidence label; `provisional` flags cold-start / low-data
        estimates the UI must present as provisional (spec/04 §4.6, spec/09).
      required: [value]
      properties:
        value: { type: number }
        unit: { type: string, nullable: true }
        interval:
          type: object
          nullable: true
          properties:
            low: { type: number }
            high: { type: number }
        confidence:
          type: string
          enum: [low, medium, high]
        provisional: { type: boolean, default: false }

    Trend:
      type: object
      properties:
        direction: { type: string, enum: [improving, stable, declining, unknown] }
        rate: { type: number, nullable: true, description: "Units per week; sign matches direction." }

    # ---- System ---------------------------------------------------------
    HealthResponse:
      type: object
      required: [status, version]
      properties:
        status: { type: string, enum: [ok] }
        version: { type: string }

    # ---- Sessions (canonical raw — EXACT to repo models.py / db.py) ------
    IngestResponse:
      type: object
      required: [session_id, quality_flags]
      properties:
        session_id: { type: string }
        quality_flags:
          type: array
          items: { type: string }
          description: Data-quality flags raised at ingest (never hidden). See spec/02 §2.4.

    SessionDetail:
      type: object
      description: Canonical session as GET /sessions/{id} returns it (quarantine sidecar excluded).
      required: [session_id, start_time, sport, source_vendor, records, rr_intervals]
      properties:
        session_id: { type: string }
        athlete_id: { type: string, nullable: true }
        start_time: { type: string, description: "ISO-8601." }
        sport: { type: string }
        activity_tag: { type: string, nullable: true }
        source_vendor: { type: string }
        source_device: { type: string, nullable: true }
        recording_interval:
          type: string
          nullable: true
          description: Descriptor, not a period — "1hz" / "smart" / "irregular" (spec/02 §2.2.3).
        hr_source: { type: string, nullable: true }
        rr_valid_fraction:
          type: number
          nullable: true
          description: Surviving-beat fraction; null when no RR stream (distinct from 0.0).
        rmssd_precomputed: { type: number, nullable: true, description: "Device-ONLY audit record of resting rMSSD (ms) — the device value on Tier 2, null on Tier 1. Not the engine's read; see resting_rmssd_ms." }
        resting_rmssd_ms:
          type: number
          nullable: true
          exclusiveMinimum: 0
          x-invariant: >
            Scoped, not table-wide. Post-amendment rows (written 2026-09-06+):
            hrv_source_tier != null  ⇒  resting_rmssd_ms != null AND > 0 (both
            tiers write tier and reading together past the non-positive gate).
            Pre-amendment Tier-1 rows may have hrv_source_tier != null WITH
            resting_rmssd_ms == null (the amendment resolved the rule, not the
            rows; no backfill). So a non-null tier does NOT imply a non-null
            reading across the window.
          description: >
            RESOLVED resting rMSSD (ms) the engine (E003) reads on either tier —
            device value on Tier 2, system-computed from beats on Tier 1 (added
            2026-09-06). Nullable, and when present strictly positive
            (exclusiveMinimum 0). Per x-invariant, a non-null hrv_source_tier does
            NOT guarantee a non-null value across the amendment window, so
            consumers guard the read (never assume ln() is safe) and the UI
            surfaces a null reading as provisional/absent, never as zero. This is
            the engine's read; rmssd_precomputed is only the device-value audit.
        hrv_source_tier:
          type: string
          nullable: true
          enum: [chest_strap_raw, health_snapshot, health_api_overnight]
          description: >
            Which tier produced the reading. Non-null does not by itself imply a
            non-null resting_rmssd_ms — see that field's x-invariant.
        rr_source: { type: string, nullable: true, description: "Session-level RR-stream source (spec/02 §2.2.3)." }
        quality_flags: { type: array, items: { type: string } }
        summary: { type: object, nullable: true, additionalProperties: true }
        context: { $ref: "#/components/schemas/SessionContext" }
        records:
          type: array
          items: { $ref: "#/components/schemas/Record" }
        rr_intervals:
          type: array
          items: { $ref: "#/components/schemas/RRInterval" }

    Record:
      type: object
      description: One per-sample canonical record (raw streams).
      required: [t]
      properties:
        t: { type: number, description: "Seconds from session start." }
        lat: { type: number, nullable: true }
        lon: { type: number, nullable: true }
        distance: { type: number, nullable: true }
        speed: { type: number, nullable: true }
        heart_rate: { type: number, nullable: true }
        cadence: { type: number, nullable: true }
        altitude: { type: number, nullable: true }
        power: { type: number, nullable: true }
        power_model: { type: string, nullable: true }
        vertical_oscillation: { type: number, nullable: true }
        ground_contact_time: { type: number, nullable: true }
        gct_balance: { type: number, nullable: true }
        step_length: { type: number, nullable: true }
        temperature: { type: number, nullable: true, description: "Device thermistor, not environmental truth." }
        gps_degraded: { type: boolean, nullable: true }
        sample_quality: { type: array, items: { type: string } }

    RRInterval:
      type: object
      properties:
        seq: { type: integer, nullable: true }
        rr_ms: { type: number, nullable: true }
        rr_source: { type: string, nullable: true, description: "Per-beat tier (spec/02 §2.2.3)." }
        rr_carrier: { type: string, nullable: true }
        is_artefact: { type: boolean, nullable: true }

    SessionContext:
      type: object
      nullable: true
      description: Environmental + provenance metadata (spec/02 §2.2.4). env_* require an external weather source, null on the FIT-upload route.
      properties:
        ingested_at: { type: string, nullable: true }
        provenance: { type: object, additionalProperties: true }
        env_temperature_c: { type: number, nullable: true }
        env_humidity_pct: { type: number, nullable: true }
        env_wind_ms: { type: number, nullable: true }
        env_wind_dir: { type: string, nullable: true }
        subjective: { type: object, nullable: true, additionalProperties: true }

    SessionSummary:
      type: object
      description: List-view projection of a session (planned shape).
      properties:
        session_id: { type: string }
        start_time: { type: string }
        sport: { type: string }
        activity_tag: { type: string, nullable: true }
        distance_m: { type: number, nullable: true }
        duration_s: { type: number, nullable: true }
        avg_pace_s_per_km: { type: number, nullable: true }
        quality_flags: { type: array, items: { type: string } }
        workout_id: { type: string, nullable: true, description: "Linked planned workout, if this activity executed one." }

    # ---- Athlete / onboarding (planned — field-level per spec/04 §4.4) ---
    Athlete:
      type: object
      description: "Planned. Field-level fidelity pending a full read of spec/01 + spec/04 §4.4."
      properties:
        id: { type: string }
        display_name: { type: string, nullable: true }
        sex: { type: string, nullable: true, enum: [female, male, unspecified] }
        birth_date: { type: string, format: date, nullable: true }
        units: { $ref: "#/components/schemas/UnitPrefs" }
        created_at: { type: string }

    AthleteProfileUpdate:
      type: object
      properties:
        display_name: { type: string }
        units: { $ref: "#/components/schemas/UnitPrefs" }

    UnitPrefs:
      type: object
      properties:
        distance: { type: string, enum: [km, mi], default: km }
        pace: { type: string, enum: [min_per_km, min_per_mi], default: min_per_km }
        temperature: { type: string, enum: [c, f], default: c }

    OnboardingInput:
      type: object
      description: "Cold-start questionnaire (planned). Fields must match spec/04 §4.4 exactly at drafting."
      required: [consent_import_history]
      properties:
        sex: { type: string, enum: [female, male, unspecified] }
        birth_date: { type: string, format: date }
        height_cm: { type: number, nullable: true }
        weight_kg: { type: number, nullable: true }
        resting_hr_bpm: { type: number, nullable: true }
        self_rated_activity: { type: integer, nullable: true, description: "Non-exercise activity index for the cold-start VO2max seed (spec/04 §4.4)." }
        recent_weekly_km: { type: number, nullable: true }
        runs_per_week: { type: integer, nullable: true }
        consent_import_history: { type: boolean, description: "Consent to import historical Garmin data for the initial fit." }

    # ---- Goal (planned) -------------------------------------------------
    GoalContract:
      type: object
      description: "Planned. Owner spec/01."
      properties:
        id: { type: string }
        race: { $ref: "#/components/schemas/GoalRace" }
        target: { $ref: "#/components/schemas/PaceTarget" }
        status: { type: string, enum: [active, superseded, completed] }
        created_at: { type: string }

    GoalContractInput:
      type: object
      required: [race]
      properties:
        race: { $ref: "#/components/schemas/GoalRace" }
        target_time_s: { type: number, nullable: true, description: "Athlete's goal finish time; omit to let the engine propose one." }

    GoalRace:
      type: object
      required: [distance_m, date]
      properties:
        name: { type: string, nullable: true }
        date: { type: string, format: date }
        distance_m: { type: number }
        course_elevation:
          type: object
          nullable: true
          description: Course elevation profile (spec/01). Series or reference; exact encoding TBD at drafting.
          properties:
            points:
              type: array
              items:
                type: object
                properties:
                  distance_m: { type: number }
                  altitude_m: { type: number }
        environment:
          type: object
          nullable: true
          properties:
            temperature_c: { type: number, nullable: true }
            humidity_pct: { type: number, nullable: true }
            wind_ms: { type: number, nullable: true }

    PaceTarget:
      type: object
      description: The engine's translation of the goal into a pace/effort target, with confidence.
      properties:
        avg_pace_s_per_km: { $ref: "#/components/schemas/ConfidenceValue" }
        projected_time_s: { $ref: "#/components/schemas/ConfidenceValue" }
        effort_note: { type: string, nullable: true }
        gap_to_goal: { $ref: "#/components/schemas/GapToGoal" }

    GapToGoal:
      type: object
      description: Determinant-decomposed distance between current projection and goal (spec/04 §4.7).
      properties:
        summary: { type: string, nullable: true }
        components:
          type: array
          items:
            type: object
            properties:
              determinant: { type: string }
              contribution: { type: number, description: "Signed contribution to the pace gap." }

    GoalProposal:
      type: object
      properties:
        id: { type: string }
        reason: { type: string, description: "Why the engine proposes a change (drift / injury-infeasible)." }
        ordered_options:
          type: array
          description: Fixed order — revised pace first, later date second; never a distance change.
          items:
            type: object
            properties:
              kind: { type: string, enum: [revised_pace, later_date] }
              target: { $ref: "#/components/schemas/PaceTarget" }
              new_date: { type: string, format: date, nullable: true }

    # ---- Plan / calendar (planned) --------------------------------------
    CalendarDay:
      type: object
      properties:
        date: { type: string, format: date }
        planned:
          type: array
          items: { $ref: "#/components/schemas/WorkoutRef" }
        completed:
          type: array
          items: { $ref: "#/components/schemas/SessionSummary" }
        compliance: { $ref: "#/components/schemas/Compliance" }
        changed:
          type: boolean
          description: True if the engine changed this day since the athlete last looked.
        decision_id:
          type: string
          nullable: true
          description: The "why" affordance target — the decision that changed this day.

    WorkoutRef:
      type: object
      properties:
        workout_id: { type: string }
        title: { type: string }
        type: { type: string, description: "Workout typology label (spec/05)." }
        primary_determinant: { type: string, nullable: true }

    Compliance:
      type: object
      nullable: true
      description: Planned-vs-completed (the execution-score pattern). Thresholds based on owned metrics, not TSS alone.
      properties:
        execution_score: { type: number, nullable: true, description: "0–1." }
        band: { type: string, enum: [green, amber, red], nullable: true }

    LoadSeries:
      type: object
      properties:
        points:
          type: array
          items:
            type: object
            properties:
              date: { type: string, format: date }
              ctl: { type: number, nullable: true }
              atl: { type: number, nullable: true }
              tsb: { type: number, nullable: true }
              channels:
                type: object
                nullable: true
                additionalProperties: { type: number }
                description: Multi-channel load (e.g. aerobic vs mechanical), spec/03 §3 / doc06 §9.

    Constraint:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          enum: [unavailable_days, time_budget, travel, recurring_rule, add_race, move_session]
        window:
          type: object
          nullable: true
          properties:
            from: { type: string, format: date }
            to: { type: string, format: date }
        payload:
          type: object
          additionalProperties: true
          description: Kind-specific detail (e.g. move_session → {workout_id, to_date}); firmed at §8 drafting.

    ChangeSet:
      type: object
      description: What the engine changed in response to an input, and why (apply-and-notify + loop closure).
      properties:
        moved:
          type: array
          items:
            type: object
            properties:
              workout_id: { type: string }
              from_date: { type: string, format: date, nullable: true }
              to_date: { type: string, format: date, nullable: true }
              change: { type: string, enum: [moved, added, removed, rescaled, softened] }
        rationale: { type: string }
        decision_ids: { type: array, items: { type: string } }
        safety_instruction:
          $ref: "#/components/schemas/SafetyInstruction"

    SafetyInstruction:
      type: object
      nullable: true
      description: A stop/return-to-run/seek-assessment instruction, surfaced plainly, never softened (spec/08 §8.5).
      properties:
        severity: { type: string, enum: [caution, stop, seek_assessment] }
        message: { type: string }

    # ---- Workouts (planned) ---------------------------------------------
    PlannedWorkout:
      type: object
      description: "Planned. Owner spec/05 (workout representation)."
      properties:
        id: { type: string }
        date: { type: string, format: date }
        title: { type: string }
        type: { type: string }
        determinant_targets:
          type: array
          items: { type: string }
          description: Which physiological determinant(s) this session targets (spec/05 / spec/01 determinants).
        rationale: { type: string, description: "The 'why this session' text, grounded in the engine's intent." }
        steps:
          type: array
          items: { $ref: "#/components/schemas/WorkoutStep" }
        completion:
          allOf:
            - $ref: "#/components/schemas/Compliance"
          nullable: true

    WorkoutStep:
      type: object
      properties:
        order: { type: integer }
        kind: { type: string, enum: [warmup, work, recovery, cooldown, repeat] }
        repeat_count: { type: integer, nullable: true }
        duration_s: { type: number, nullable: true }
        distance_m: { type: number, nullable: true }
        target:
          type: object
          nullable: true
          description: Relative-anchored target — stored relative to the current state estimate so zones update automatically (spec/05).
          properties:
            metric: { type: string, enum: [pace, hr, power, effort] }
            anchor: { type: string, description: "e.g. threshold_pace, critical_speed." }
            low: { type: number, nullable: true }
            high: { type: number, nullable: true }

    # ---- Subjective (planned) -------------------------------------------
    SessionFeedback:
      type: object
      required: [rpe]
      properties:
        rpe: { type: integer, minimum: 1, maximum: 10, description: "Session-RPE (research/03)." }
        comment: { type: string, nullable: true }

    WellnessReport:
      type: object
      description: Five-item wellness (research/03 §3.3), each 1–5.
      required: [fatigue, sleep, soreness, stress, mood]
      properties:
        fatigue: { type: integer, minimum: 1, maximum: 5 }
        sleep: { type: integer, minimum: 1, maximum: 5 }
        soreness: { type: integer, minimum: 1, maximum: 5 }
        stress: { type: integer, minimum: 1, maximum: 5 }
        mood: { type: integer, minimum: 1, maximum: 5 }
        sleep_duration_h: { type: number, nullable: true }
        illness_flag: { type: boolean, nullable: true }

    PainReport:
      type: object
      description: Pain traffic-light (research/03 §3.5).
      required: [location, intensity]
      properties:
        location: { type: string, description: "Body location; implies tissue type for the verdict." }
        intensity: { type: integer, minimum: 0, maximum: 10 }
        overnight_settle: { type: boolean, nullable: true }
        weekly_trend: { type: string, enum: [improving, stable, worsening], nullable: true }

    # ---- State & metrics (planned) --------------------------------------
    StateModel:
      type: object
      description: "Owned determinant profile with confidence + gap-to-goal (spec/04)."
      properties:
        as_of: { type: string }
        determinants:
          type: array
          items: { $ref: "#/components/schemas/Determinant" }
        readiness:
          type: object
          nullable: true
          properties:
            verdict: { type: string, enum: [ready, caution, back_off], nullable: true }
            confidence: { type: string, enum: [low, medium, high], nullable: true }
        gap_to_goal: { $ref: "#/components/schemas/GapToGoal" }

    Determinant:
      type: object
      properties:
        name:
          type: string
          enum: [critical_speed, d_prime, vvo2max, functional_threshold_pace, running_economy, durability, riegel_exponent]
        estimate: { $ref: "#/components/schemas/ConfidenceValue" }
        trend: { $ref: "#/components/schemas/Trend" }

    HrvTrend:
      type: object
      description: >
        Owner spec/03 §3.7; as-built runcoach-api F005 (2026-09-09), per-tier
        datasets F006 (2026-09-21). `points[]` is the chart's series, which
        gains one field (`dataset`, AC14); everything else is the verdict for
        `to` and every input that produced it, added additively so the response
        is reproducible by hand (research/00 §1.6). `baseline`, `band`,
        `verdict` and `below_by` keep their names and now mean THE SELECTED
        DATASET'S; `datasets[]`, `selected_dataset`, `selected_reason` and
        `disagreed_with` are added beside them and nothing non-nullable became
        nullable (AC12), so `info.version` does not move for this change — the
        sprint's one breaking change was the removal of the exclusion reason
        F005 published for a reading of a tier other than the one holding the
        baseline, which took it to 0.2.0-draft. Field-level truth is the
        as-built `HrvTrendResponse` in /openapi.json.
      properties:
        points:
          type: array
          description: >
            One entry per athlete-local day in [from, to], in date order. Each
            day is judged against its OWN baseline [d-66, d-7]; the band is a
            property of that baseline, so a day with no reading still carries
            it, and an unestablished-but-computable baseline (2 ≤ n < 14) still
            carries it while the day's verdict is withheld. The last entry
            describes `to` and its band equals `band`.
          items:
            type: object
            properties:
              date: { type: string, format: date }
              ln_rmssd:
                type: number
                nullable: true
                description: ln of that day's reading on the baseline tier; null when the post-exclusion series has none that day.
              baseline:
                type: number
                nullable: true
                description: Mean of ln rMSSD over [d-66, d-7]; null together with swc_low/swc_high only when that baseline holds fewer than two readings.
              swc_low: { type: number, nullable: true, description: "That day's band.lo; null iff baseline is null." }
              swc_high: { type: number, nullable: true, description: "That day's band.hi; null iff baseline is null." }
              dataset:
                type: string
                nullable: true
                description: >
                  The source tier of the dataset this day's band came from
                  (F006 AC14). Selection runs per LOCAL DAY and reads nothing
                  from yesterday, so two adjacent points can be drawn against
                  two different instruments, whose bands differ by the
                  systematic bias between the tiers; a chart that does not read
                  this field switches instrument between adjacent days and
                  draws the step as a change in the athlete. Null only when no
                  reading of any tier exists in that day's [d-66, d], which is
                  narrower than `baseline` being null: a dataset holding one
                  baseline reading has a tier and no band, so this is non-null
                  while the other three are null. On the response's own day it
                  is `selected_dataset` when one was selected, and `datasets[]`
                  describes it in full.
        date: { type: string, format: date, description: "The local day the verdict is about (`to`)." }
        from: { type: string, format: date, description: "The start of the requested range; defaults to `to`." }
        timezone: { type: string, description: "The IANA zone every row was bucketed into local days with." }
        verdict:
          type: string
          enum: [hrv_normal, hrv_suppressed, hrv_unavailable]
          description: >
            hrv_normal and hrv_suppressed both assert an established baseline --
            baseline.n at or above the min_baseline_readings threshold the
            response echoes -- and differ only in where the 7-day mean sits:
            strictly below band.lo is hrv_suppressed, inside or above the band is
            hrv_normal. hrv_unavailable has six causes, and the response names
            which of them fired; judge evaluates them in this order and reports
            the first: when no resting-HRV reading of any tier can sustain a trend
            -- the structural case, resolve_baseline_tier answering "no tier at
            all"; when there are fewer than two baseline readings, so no band
            exists; when there are fewer than min_window_readings (3) readings of
            baseline.tier in the judged week; when the judged week is not a fair
            sample of the resolved tier, its readings all predating the athlete's
            return to, or first adoption of, another device (T125/T132); when
            there is a baseline below min_baseline_readings (14), reported as
            established: false -- any week judged against an unestablished
            baseline (below, inside or above the band alike: 3.7.3 withholds the
            suppression there, and hrv_normal there would tell a consumer
            readiness is intact on evidence this same response reports
            unestablished, the up-regulating direction research/00 1.7 forbids);
            and when the judged day is after the athlete's local today in
            timezone, which is decided at the route and overrides whichever of the
            other five would otherwise have applied -- whatever the window holds,
            no verdict is asserted about a day that has not happened, and the
            other fields are still reported as computed. The band is still
            reported whenever the baseline can build one, established or not, so
            an unavailable verdict remains checkable by hand.
        unavailable_reason:
          type: string
          nullable: true
          enum:
            - no_tier_sustains_a_trend
            - no_band
            - week_too_thin
            - week_not_representative
            - baseline_unestablished
            - day_not_happened
          description: >
            Why verdict is hrv_unavailable; null whenever it is not (research/00
            §1.6 -- this is the one place that invariant failed until T137,
            closing F005's Negative Class row "the verdict still cannot say why it
            is unavailable", open since review cycle 4). judge evaluates four
            causes in a fixed order and reports the first that fires:
            no_tier_sustains_a_trend (no resting-HRV reading of any tier can
            sustain a trend -- resolve_baseline_tier answered "no tier at all") or
            no_band (a tier resolved, but its baseline holds fewer than two
            readings, so no band exists -- build_band answers null on fewer than
            two baseline readings, so no band exists to judge the week against)
            whenever band is null; then week_too_thin (fewer than
            min_window_readings (3) readings of baseline.tier in the judged week;
            readings of other tiers feed their own datasets and do not count
            toward readings_in_window); then
            week_not_representative (the judged week is not a fair sample of the
            resolved tier, baseline.tier -- T125/T132: a returning or brand-new
            device's week entirely predates the tier being judged); then
            baseline_unestablished (a baseline below min_baseline_readings (14),
            reported as established: false -- baseline.n below the threshold the
            response echoes, T116). day_not_happened (the judged day is after the
            athlete's local today, date beyond today in timezone) is decided at
            the route, after judge, and overrides whichever of the other five
            would otherwise have applied -- the fields that would explain them are
            still computed and returned as usual, but a day that has not happened
            is the one true reason no verdict is asserted about it.
        ln_rmssd_7d_mean:
          type: number
          nullable: true
          description: Mean of ln rMSSD over the readings in `window`; null only when the window is empty.
        below_by:
          type: number
          nullable: true
          description: band.lo − ln_rmssd_7d_mean when the verdict is hrv_suppressed; null otherwise.
        band:
          type: object
          nullable: true
          description: The SWC band in log space over the baseline, mean ± half_width. Null only when the baseline holds fewer than two readings.
          properties:
            mean: { type: number }
            half_width: { type: number, description: "max(swc_factor × sample SD of ln rMSSD over the baseline, band_floor)." }
            lo: { type: number }
            hi: { type: number }
            floored: { type: boolean, description: "True when the computed half-width fell below band_floor." }
        baseline:
          type: object
          properties:
            window:
              type: array
              items: { type: string, format: date }
              minItems: 2
              maxItems: 2
              description: >
                Closed local-date interval [max(date-66, R), date-7], where R is
                the day the current baseline era began. R is not reset_on: a
                tier-change era boundary clips this window whether or not the
                change is reported, so a clipped window beside a null
                reset_reason is a correct state (the readings clipped away are
                listed before_reset: tier_change). For coverage_gap, R is the
                later of the resumption and any era boundary: the two clips
                compose as the later of their first days, so R is reset_on only
                when no era boundary falls after the resumption, and window[0]
                may lie after reset_on. A third clip is per dataset and unreported:
                an internal capture hole of more than gap_reset_days (21) silent
                local days inside the window the first two clips left -- one tier
                silent while another bridged it, which the global gap cannot see --
                clips this dataset at its last resumption, and the readings clipped
                away are listed before_reset: coverage_gap beside a reset_reason
                that stays null or the era rule's. The three clips compose as the
                latest first day. Empty
                after a reset landing inside the judged week, rendered as the
                formula yields it (first after last) with n 0 — clients must not
                assume window[0] ≤ window[1].
            n: { type: integer, description: "Baseline readings, one per local day on `tier`." }
            tier: { type: string, nullable: true, description: "The source tier the baseline and window are built on." }
            established: { type: boolean, description: "n ≥ min_baseline_readings. Below it both verdicts are withheld — hrv_suppressed and hrv_normal alike — and hrv_unavailable is the only verdict emitted (see verdict)." }
            reset_on:
              type: string
              format: date
              nullable: true
              description: >
                The day the current baseline era began, when the re-establishment
                is reported. It says what the athlete is told, not how window was
                built — a null reset_on does not mean the baseline spans the full
                60 days; read window.
            reset_reason:
              type: string
              enum: [coverage_gap, tier_change]
              nullable: true
              description: >
                Why the re-establishment is reported. The baseline clip is decided by the
                era boundary alone, never by its report, so a null here can sit beside a
                clipped `window`; and a third clip, per dataset and unreported, widens that
                state: each dataset is also clipped at its last internal capture hole of
                more than gap_reset_days (21) silent local days, counted exactly as
                coverage_gap_reset counts a gap, with the pre-hole readings listed
                `before_reset: coverage_gap` while this stays null or the era rule's. The
                three clips -- era boundary, coverage gap, internal hole -- compose as the
                latest first day, and only the first two are ever reported here. A
                reported `tier_change` is always clipped, though once the era's first day
                is date-66 or older the clip `max(date-66, R)` is a no-op and `window` is
                indistinguishable from the un-clipped [date-66, date-7]. That no-op
                stretch is conditional, not promised: a reported `tier_change` sits beside
                an un-clipped `window` only once date-66 has reached R, and then only on
                the days the report is still live. Liveness is rule 4's three conditions
                together, not any one of them alone: the resolved tier still holds
                min_baseline_readings distinct days in the baseline window, the previous
                window [date-126, date-67] is still sustained by a tier other than the
                resolved one, and the two eras still do not interleave -- the era
                boundary's stray readings fewer than min_baseline_readings days in all and
                fewer than min_window_readings days inside the judged week [date-6, date]
                (`tier_change_reset` clauses (a), (b) and (c)). Any one can lapse while
                the others hold -- a new tier that never reaches min_baseline_readings, an
                old tier whose density decays, a few days of the other device inside the
                judged week -- and this is null on such a day. So every day a
                `tier_change` is reported before date-66 reaches R carries a clipped
                `window`, and a client cannot infer from seeing a `tier_change` that an
                un-clipped `window` will follow (F005 decision log D4, 2026-09-13; T103,
                T105, T109).
        window:
          type: array
          items: { type: string, format: date }
          minItems: 2
          maxItems: 2
          description: The closed local-date interval [date-6, date] the mean is taken over.
        readings_in_window: { type: integer }
        included:
          type: array
          description: The readings that fed ln_rmssd_7d_mean, only; the baseline is summarised by `baseline`.
          items:
            type: object
            properties:
              date: { type: string, format: date }
              session_id: { type: string }
              tier: { type: string }
              rmssd_ms: { type: number }
        excluded:
          type: array
          description: Every stored row inside [date-66, date] that fed neither the baseline nor the window, with its reason.
          items:
            type: object
            properties:
              date: { type: string, format: date }
              session_id: { type: string }
              reason:
                type: string
                description: >
                  One of pre_amendment_window, null_tier, unknown_tier: <tier>,
                  unusable_value: <value>,
                  same_day_later_capture, before_reset: <coverage_gap|tier_change>.
        thresholds:
          type: object
          description: >
            The band, verdict and tier-resolution constants (spec/03 §3.7).
            They are not all of tier resolution: it also applies recency_tolerance_days, which this
            response does not echo, so a client applying these six can derive a baseline.tier that
            disagrees with the reported one (IDEA-070, 2026-09-15).
          properties:
            baseline_days: { type: integer }
            min_baseline_readings: { type: integer }
            min_window_readings: { type: integer }
            gap_reset_days: { type: integer }
            band_floor: { type: number }
            swc_factor: { type: number }
        datasets:
          type: array
          description: >
            One entry per source tier present in the gap-clipped span —
            [date-66, date], or [baseline.reset_on, date] when a global
            coverage gap clipped the series — in fidelity
            order, each with its own baseline, its own band and its own reading
            of the judged week against that band (F006 AC1/AC2/AC10, added
            2026-09-21 by T159; the span corrected from [date-66, date] by
            sprint-006 spec review, 2026-09-21). A tier read only before such a
            resumption has no entry here at all: its readings are listed in
            `excluded` as `before_reset: coverage_gap`, so a consumer counting
            tiers reads them there rather than finding them nowhere.
            Each tier keeps its own dataset and no reading
            of one contributes to another's baseline (spec/03 §3.7.3's
            anti-mixing rule, honoured by construction), so the datasets the
            verdict was NOT taken from are retained rather than discarded:
            every reading inside the span is in exactly one dataset here or in
            `excluded` with a reason, never in neither and never in both (AC15,
            research/00 §1.6). Empty only when no reading of any tier exists in
            the span. Additive: `baseline`, `band` and `verdict` still describe
            the selected dataset and nothing non-nullable became nullable
            (AC12).
          items:
            type: object
            properties:
              tier:
                type: string
                description: >
                  The source tier, which IS the dataset's key: the stored
                  source_device is the watch, so per-unit device identity is a
                  later feature. One entry per tier present in the gap-clipped
                  span, in fidelity order, highest first.
              n:
                type: integer
                description: >
                  Baseline readings of this tier, one per local day, over THIS
                  dataset's own post-clip baseline window. It is `baseline.n`
                  only for the selected dataset, and each dataset's window can
                  be clipped at a different day: the coverage gap is global,
                  the era boundary and the internal capture hole are this
                  dataset's own.
              established:
                type: boolean
                description: >
                  n ≥ min_baseline_readings, for this dataset alone. A dataset
                  must be established AND hold at least min_window_readings
                  judged-week days to be a candidate for selection (AC8);
                  `week_days` is the other half of that test.
              band:
                type: object
                nullable: true
                description: >
                  This dataset's own SWC band over its own baseline — the
                  yardstick its own week is read against here. Null only when
                  this dataset holds fewer than two baseline readings, in which
                  case it cannot disagree with anything and is visible carrying
                  `n` and `week_days` instead (AC10). The selected dataset's
                  band is the response's `band`.
                properties:
                  mean: { type: number }
                  half_width: { type: number }
                  lo: { type: number }
                  hi: { type: number }
                  floored: { type: boolean }
              fidelity_rank:
                type: integer
                description: >
                  This tier's ordinal in the source hierarchy spec/03 §3.7.1
                  ratifies, 0 being the highest: a chest-strap RR capture this
                  system reduces to rMSSD itself, degrading — at reduced
                  confidence — to a device-computed numeric resting rMSSD.
                  THIS is the sense of quality that arbitrates; selection
                  promotes the lowest rank among the judgeable datasets, so
                  `selected_reason` is recomputable by hand from this field
                  beside `established`, `week_days` and `last_read`. The other
                  sense — the numeric per-tier CONFIDENCE WEIGHT at which
                  §3.7.1 admits the numeric tiers — is deliberately not here:
                  §3.7.4 computes no confidence weight in Section 3 and defers
                  the weighting to Section 6's readiness fusion, so emitting
                  one would mint a constant Section 3 does not own.
              last_read:
                type: string
                format: date
                nullable: true
                description: >
                  The latest local day this tier was read on INSIDE the
                  baseline window [date-66, date-7] — the slice the recency
                  gate is normative over (AC6), not the latest reading overall.
                  Null when this tier has no reading in that window at all. The
                  gate is reproducible from this field: a judgeable dataset more
                  than recency_tolerance_days behind the greatest `last_read`
                  among the ESTABLISHED datasets is skipped, strictly greater
                  than, so a dataset exactly at the tolerance is kept. The
                  response does not echo recency_tolerance_days (IDEA-070).
              week_days:
                type: integer
                description: >
                  Distinct local days of the judged week [date-6, date] this
                  tier was read on — this dataset's share of the week, which is
                  `readings_in_window` only for the selected dataset. It is the
                  count half of judgeability (at least min_window_readings, 3)
                  and it is what weighs a name in `disagreed_with`.
              week_mean:
                type: number
                nullable: true
                description: >
                  Mean of ln rMSSD over this dataset's own judged-week
                  readings; null when it has none. It is `ln_rmssd_7d_mean` for
                  the selected dataset and is computed the same way for every
                  other, so `below` can be recomputed by hand from this and
                  `band`.
              below:
                type: boolean
                nullable: true
                description: >
                  week_mean < band.lo, STRICTLY LESS — the same comparison the
                  verdict makes for hrv_suppressed, made here against this
                  dataset's own band whether or not it is judgeable and whether
                  or not its own verdict would be withheld (AC10, taken
                  literally). Null when either side is missing, and a dataset
                  whose `below` is null cannot appear in `disagreed_with`.
                  Reported for every dataset, including when nothing is
                  selected and `disagreed_with` is empty by construction.
              reset_on:
                type: string
                format: date
                nullable: true
                description: >
                  This dataset's OWN reported re-establishment day, decided per
                  dataset (AC17): the global coverage gap's resumption when one
                  fired — the same on every dataset, since a gap measures the
                  silence of the series as a whole — else this dataset's own era
                  boundary when that is reported, else null. `baseline.reset_on`
                  is the SELECTED dataset's, so a dataset that is not selected
                  can carry a report the rest of the response never shows.
              reset_reason:
                type: string
                enum: [coverage_gap, tier_change]
                nullable: true
                description: >
                  Why this dataset's re-establishment is reported, with the same
                  meanings as `baseline.reset_reason` and the same caveat: the
                  report is not the clip. A dataset's baseline window is clipped
                  by its era boundary whether or not the change is reported, and
                  by an internal capture hole of more than gap_reset_days silent
                  local days, which is never reported at all — so a null here
                  can sit beside an `n` far below what the 60 days of
                  [date-66, date-7] would hold.
        selected_dataset:
          type: string
          nullable: true
          description: >
            The source tier of the dataset `baseline`, `band`, `verdict` and
            `below_by` describe — the highest-fidelity JUDGEABLE dataset the
            recency gate did not skip (F006 AC5–AC8). Null when no dataset was
            selected, which is EITHER that no dataset is judgeable OR that every
            judgeable one was skipped as stale. In that case the verdict is
            hrv_unavailable and `baseline`/`band` are still populated, from the
            dataset the athlete was read on last (AC9's presentation fallback,
            F005's rule 3 retained), so every field non-nullable before F006
            still carries a value and this addition stays additive (AC12). The
            fallback PRESENTS; it never judges — no verdict is conferred by it,
            and `disagreed_with` is empty there even when the presented
            dataset's own week reads below its band, because a disagreement is
            with a verdict and there is none to disagree with. `datasets[]`
            still shows every dataset's side, so that state stays legible.
        selected_reason:
          type: string
          nullable: true
          enum:
            - highest_fidelity_judgeable
            - higher_fidelity_skipped_stale
          description: >
            Why `selected_dataset` is the one, drawn from a closed enum:
            `highest_fidelity_judgeable` — no judgeable dataset outranks it;
            `higher_fidelity_skipped_stale` — one did, and the recency gate
            skipped it as stale, so the verdict is being taken from a
            lower-fidelity instrument and the response says so rather than
            leaving that fall invisible. Non-null EXACTLY WHEN
            `selected_dataset` is non-null, null with null (AC13; the same
            shape `unavailable_reason` carries). It is derived from the
            selection rather than stored beside it, so it cannot disagree with
            which datasets were skipped.
        disagreed_with:
          type: array
          description: >
            The datasets whose judged week reads the OTHER SIDE OF THEIR OWN
            BAND from the selected dataset, in fidelity order, each with the
            judged-week count that weighs it (F006 AC10/AC11). Both directions
            are reported: a dataset below its band while the selected one reads
            within, and one within while the selected one reads below. A
            dataset below its band beside a selected dataset also below its own
            AGREES with the verdict and is not named. Judgeability is never
            consulted — a band from two baseline readings and a week of one can
            name a dataset here — so `week_days` is what a consumer weighs the
            name by. Disagreement NEVER OVERRIDES: `verdict` is the selected
            dataset's, unchanged, whatever is listed here. EMPTY WHENEVER
            `verdict` is `hrv_unavailable`, for any cause (research/00 §5.4
            (iii), amended 2026-09-21): a disagreement is a claim ABOUT a
            verdict and none was conferred. One condition over all three
            verdict-free states — `selected_dataset` null, where the
            presentation fallback speaks; a dataset that IS selected whose
            verdict is withheld because a returning dataset's judged week is
            entirely later than its own (`week_not_representative`); and a day
            that has not happened (`day_not_happened`). `datasets[]` still
            carries every dataset's own `below` on those days, and
            `selected_dataset`, `selected_reason` and the retained
            `baseline`/`band` are kept as computed. This is the response's one report of the
            exposure F006 accepts: hrv_normal can be promoted from the best
            available instrument while another dataset reads below its own band,
            and a consumer reading `verdict` alone is not told (research/00
            §1.7's forbidden direction, accepted and measured against shipped
            F005 rather than denied).
          items:
            type: object
            properties:
              dataset: { type: string, description: "The disagreeing dataset's source tier." }
              week_days:
                type: integer
                description: >
                  That dataset's `week_days`, repeated here so the name can be
                  weighed where it is read: a judged week of one morning can
                  disagree, and the count is the difference between a second
                  instrument contradicting the verdict all week and a single
                  stray capture.

    # ---- Decisions & changes (planned) ----------------------------------
    DecisionRecord:
      type: object
      description: "Owner spec/09. Every applied adaptation, its inputs, and the rule that fired."
      properties:
        id: { type: string }
        timestamp: { type: string }
        timescale: { type: string, enum: [long_term, weekly, recent_workout, daily_readiness, intra_workout] }
        trigger: { type: string }
        inputs:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              value: {}
        rule_fired: { type: string, description: "The arbitration rung / rule id (spec/06 §6.5)." }
        action: { type: string }
        affected:
          type: object
          properties:
            dates: { type: array, items: { type: string, format: date } }
            workout_ids: { type: array, items: { type: string } }
        explanation: { type: string, description: "Plain-language rendering; numbers are the engine's, not invented." }

    ChangeFeedItem:
      type: object
      properties:
        id: { type: string }
        timestamp: { type: string }
        kind: { type: string, enum: [plan_change, goal_proposal, safety, data_quality, sync] }
        summary: { type: string }
        decision_id: { type: string, nullable: true }
        seen: { type: boolean, default: false }

    # ---- Connections & sync (planned) -----------------------------------
    GarminConnection:
      type: object
      properties:
        connected: { type: boolean }
        scopes: { type: array, items: { type: string } }
        connected_at: { type: string, nullable: true }

    SyncStatus:
      type: object
      properties:
        completed_last_synced_at: { type: string, nullable: true }
        plan_last_pushed_at: { type: string, nullable: true }
        pending: { type: boolean, default: false }
        last_error: { type: string, nullable: true }

    # ---- Coach (planned) ------------------------------------------------
    CoachMessage:
      type: object
      properties:
        id: { type: string }
        role: { type: string, enum: [athlete, coach] }
        text: { type: string }
        created_at: { type: string }
        parsed_input:
          type: object
          nullable: true
          description: When an athlete message translated into a structured input, its recognized kind (spec/08 §8.4).
          properties:
            kind: { type: string, enum: [constraint, injury, subjective, plan_change_request, goal_change, explanation_request] }
        references:
          type: array
          items: { type: string }
          description: Decision-record ids this reply is grounded in.
        change_set:
          allOf: [ { $ref: "#/components/schemas/ChangeSet" } ]
          nullable: true
