      summary: Physiological state model + gap-to-goal, each with confidence
      x-readiness: implemented
      x-owner-spec: "spec/04 (determinant profile, confidence); spec/04 §4.7 / spec/01 §1.4 (gap-to-goal); runcoach-api F024 (2026-10-15), F026, F027, F029"
      x-story: [view-state]
      description: >
        Computed on read from the tagged races and the threshold workouts (tagged Training or named in
        `threshold_workout_names`); nothing is stored or written. Two determinants are served, in this
        order: `functional_threshold_pace` (F024, F026, F027) and `riegel_exponent`, the endurance
        exponent b from the tagged races (F029), each with its 80 % interval, its confidence and the
        efforts it was computed from. `readiness` and `gap_to_goal` are null; the other determinants are absent.
        The load chart is built on every request for the fitness screen; a store whose chart cannot be
        built is a 500.
      parameters:
        - name: as_of
          in: query
          required: false
          description: >
            The instant to estimate at; default now. An ISO 8601 extended-form date-time with a
            zone, at or before now; or a `YYYY-MM-DD` date, meaning the last instant before the
            next local midnight in `athlete_timezone`, clamped to now (so today is accepted). A
            date after today in `athlete_timezone`, a naive or future date-time, a basic or
            week-form date (`20261014`, `2026-W42-3`) and an unparseable value are 422.
          schema: { type: string }
      responses:
        "200":
          description: Current state estimate
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StateModel" }
        "422": { $ref: "#/components/responses/RequestValidationError" }
        "500":
          description: "The load chart could not be built (a session with no saved load row, or a naive or unparseable stored start time); the detail is the chart's message"
          content: { application/json: { schema: { type: object } } }

  /metrics/hrv:
    get:
      tags: [State & Metrics]
      operationId: getHrvTrend
      summary: HRV trend (ln rMSSD vs SWC band)
      x-readiness: implemented
      x-owner-spec: "spec/03 §3.7; runcoach-api F005 (2026-09-09)"
      x-story: [view-state]
      description: >
        One point per athlete-local day in [from, to], each judged against its
        own dataset baseline window, the nominal [date-66, date-7] clipped on
        that day at the latest of the coverage-gap resumption, the era boundary
        and the last internal hole (research/00 HRV-12, T-09), plus the verdict
        blocks for `to` — the
        mean, the band, the baseline, every reading that fed the mean and every
        stored row that fed nothing, with its reason — so the verdict can be
        recomputed by hand from the response, as research/00 PRIN-12 asks; the
        inputs it does not serve are PRIN-12's OPEN exceptions (PRIN-24, PRIN-27). Both
        parameters are optional as built (F005/T091, 2026-09-09): `to` defaults
        to the athlete's local
        today in the configured zone and `from` to `to`, so a bare call yields
        one point. Unauthenticated today like every as-built route.
      parameters:
        - name: from
          in: query
          required: false
          description: "Athlete-local date (YYYY-MM-DD). Defaults to `to`. After `to` → 422."
          schema: { type: string, format: date }
        - name: to
          in: query
          required: false
          description: >
            Athlete-local date (YYYY-MM-DD). Defaults to the athlete's local
            today. `to − from` greater than 366 days → 422.
          schema: { type: string, format: date }
      responses:
        "200":
          description: HRV trend series and the verdict for `to`
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HrvTrend" }
        "422":
          description: "`from` after `to`, a range longer than 366 days, or a malformed date (FastAPI-default {detail})"
          content: { application/json: { schema: { type: object } } }

  /metrics/load:
    get:
      tags: [State & Metrics]
      operationId: getLoadChart
      summary: The fitness, fatigue and form chart (daily load, CTL, ATL, TSB)
      description: >
        F018. One entry per athlete-local date from the first day holding a
        running session to today (rest days included), each with the day's
        load (the sum of the saved loads of the runs it counted), CTL and ATL
        (EWMAs at the fixed 42- and 7-day rates, research/00 REG-01, REG-20,
        IND-06), TSB (yesterday's CTL minus yesterday's ATL), the runs it
        counted, the runs it could not count with their reason, and the
        sessions it excluded (a non-running sport or a declared resting
        capture). A run without a saved load is never a 0: its day moves like
        a rest day and is marked. Both curves start at the seed, the mean daily
        load over the first 42 days of history (all of it when shorter), with
        those days provisional. Computed on read from the saved loads (F017; a
        recompute replaces one) and the configured athlete_timezone; nothing is stored. The
        curves always run from the first day of history; from and to only
        choose which days are returned. Both parameters are optional: to
        defaults to the athlete's local today and from to the earlier of
        first_day and to, so a to before history answers days empty. No range
        cap. Unauthenticated today like every as-built route.
      x-readiness: implemented
      x-owner-spec: "spec/03 section 3.5 (as amended by F018); runcoach-api F018"
      x-story: [view-state]
      parameters:
        - name: from
          in: query
          required: false
          description: "Athlete-local date (YYYY-MM-DD). Defaults to the earlier of first_day and to. After to: 422."
          schema: { type: string, format: date }
        - name: to
          in: query
          required: false
          description: "Athlete-local date (YYYY-MM-DD). Defaults to the athlete's local today. After today: 422."
          schema: { type: string, format: date }
      responses:
        "200":
          description: The chart over [from, to], with first_day and the seed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoadChart" }
        "422":
          description: "from after to, to after the local today, or a malformed date (FastAPI-default {detail})"
          content: { application/json: { schema: { type: object } } }

