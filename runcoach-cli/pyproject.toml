[project]
name = "runcoach-cli"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "tomli-w>=1.0",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
garmin = [
    "garminconnect>=0.3.17,<0.4; python_version >= '3.12'",
    "curl_cffi; python_version >= '3.12'",
]

[project.scripts]
runcoach = "runcoach_cli.main:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/runcoach_cli"]
