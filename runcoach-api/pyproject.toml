[project]
name = "runcoach-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.5",
    "tomli-w>=1.0",
    "fitdecode>=0.10",
    "python-multipart>=0.0.9",
    # T078 (F005): the IANA time-zone database. Python's stdlib `zoneinfo` has
    # no bundled tzdb and reads the system one, which Windows does not ship --
    # without this, `zoneinfo.available_timezones()` is empty and every
    # `athlete_timezone` is unresolvable.
    "tzdata>=2024.1",
]

[project.scripts]
runcoach-api = "runcoach_api.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    # T048: property-based tests for RR burst detection
    # (tests/test_rr_reconstruction_properties.py). Per-package dev
    # dependency, not workspace-root -- the root group carries only
    # `pytest` as workspace-level tooling.
    "hypothesis>=6.100",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/runcoach_api"]
