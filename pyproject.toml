[project]
name = "runcoach-workspace"
version = "0.0.0"
requires-python = ">=3.11"

[tool.uv.workspace]
members = ["runcoach-api", "runcoach-cli"]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
# Workspace members have same-named test modules (e.g. both runcoach-api/
# and runcoach-cli/ have tests/test_config.py) with no __init__.py in their
# tests/ dirs. The default "prepend" import mode can't disambiguate two
# same-named modules across directories ("import file mismatch"). importlib
# mode imports each test file by its own path instead of a shared module
# namespace, which is the standard fix for this exact multi-package layout.
addopts = "--import-mode=importlib"

[tool.ruff]
# T070: declare-only. This repo writes long prose docstrings
# (hrv_classification.py is ~70% docstring), so line-length is set above
# ruff's 88-char default to match the existing corpus (longest line today
# is 108 chars) rather than flagging it. Lint selection is left at ruff's
# default rule set on purpose -- first run should be informative, not
# punitive. Do not add `ruff format` or narrow/widen the rule set here;
# that's a separate, reviewed decision.
line-length = 110
