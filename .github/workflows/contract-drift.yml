name: contract-drift

# Fails when the backend's live surface drifts away from the endpoints the
# target contract (contracts/openapi.yaml) marks x-readiness: implemented.
# See contracts/check_drift.py for exactly what is (and isn't) checked.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "contracts/**"
      - "runcoach-api/**"
      - ".github/workflows/contract-drift.yml"

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Contract drift check
        # --package runcoach-api puts the FastAPI app on the path so the check
        # can generate the as-built schema in-process (no server/config needed).
        # --with pyyaml supplies the dep the check itself needs. T091 has since
        # added pyyaml to runcoach-api's dev group, so this flag is now
        # belt-and-braces rather than load-bearing -- it is kept because
        # `.claude/rules/project-api-contract.md` rule 4 puts this exact command
        # in the acceptance probe of every route-changing task, and the workflow
        # and the probe should be the same command.
        run: uv run --package runcoach-api --with pyyaml python contracts/check_drift.py
